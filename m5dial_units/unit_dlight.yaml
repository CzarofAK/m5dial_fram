# =====================================================================
#  m5dial_units/unit_dlight.yaml — M5Stack DLight Unit (BH1750)
#  YouTrack FR-67: ambient light at the windscreen, basis for
#  automatic dimming of the displays.
#
#  Optional hardware, so it's NOT in the shared header: a dial only
#  gets it if a DLight Unit is actually plugged in. Include it from the
#  device file like a page package, but without a p<n> slot (no page,
#  no page order).
#
#  Wiring: Grove cable into the RED port (Port A, I2C):
#  G13 = SDA, G15 = SCL. The WHITE port (Port B, G1/G2) has no I2C.
#  Own bus `bus_ext`, separate from the internal `bus_int`
#  (GPIO11/12), so an external cable can't disturb the onboard bus.
#  100 kHz is fine for the short 20 cm Grove cable.
#
#  Automatic dimming: this dial sits in front of the DRIVER, so it has
#  to follow the light right away (tunnel, garage, oncoming sun), not
#  slowly like the living-area displays. Read every 1 s, smoothed with
#  an exponential moving average (alpha 0.3, ~3 s to settle), and each
#  smoothed value goes straight to the header's apply_daynight via
#  g_auto_lux. The curve itself lives in the header (substitutions
#  dim_*). Only in AUTO mode; triple-click DAY/NIGHT still overrides.
#
#  Recorder: the fast value stays internal; HA only gets a copy that
#  publishes on a 10 % change (FRAM rule, KB FR-A-15).
# =====================================================================

i2c:
  - id: bus_ext
    sda: GPIO13
    scl: GPIO15
    frequency: 100kHz
    scan: true

sensor:
  - platform: bh1750
    i2c_id: bus_ext
    id: s_lux
    internal: true
    address: 0x23
    update_interval: 1s
    filters:
      - exponential_moving_average:
          alpha: 0.3
          send_every: 1
    on_value:
      - lambda: |-
          id(g_auto_lux) = std::isnan(x) ? -1.0f : x;
      - script.execute: apply_daynight

  - platform: copy
    source_id: s_lux
    name: "Ambient Light"
    filters:
      - delta: 10%
