# =====================================================================
#  m5dial_fram.yaml — header for every M5 Dial in the FRAM
#  FRAM M5Dial Cockpit
#
#  Applies to EVERY dial in the FRAM. Contains everything that's wired
#  to the M5 Dial and that every page needs — but no page itself and
#  nothing that only applies to a single device.
#
#  The device name, the home page, and the page list therefore do NOT
#  live here, but in the _cockpit file. Otherwise a second dial in the
#  FRAM couldn't share this header.
#
#  Assumes basics.yaml (already in the ESPHome directory and NOT
#  included from here). From there come wifi, api, ota, logger,
#  web_server, restart_button, and the time source
#  `homeassistant_time`.
#
#  This header is included by the device file
#  m5dial_fram_cockpit.yaml, which also brings in the pages.
#
#  NOTE: the pin assignment hasn't been checked against the device yet.
# =====================================================================

substitutions:
  # ---- Layout grid, design.md §3 ------------------------------------
  # Lives only here now. The pages inherit it.
  #
  # ${name}, ${friendly_name} and ${home_page} come from the _cockpit —
  # they're statements about ONE device, not about the model.
  y_main: "-20"
  y_line2: "15"
  y_row: "48"
  y_footer: "-32"
  y_cap: "-42"
  x_col: "40"

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: apply_daynight

esp32:
  # `board: esp32s3` isn't a real PlatformIO board id (it's the chip
  # variant name, not a board) -- ESPHome rejects it as unknown and
  # asks for `variant:` instead. Matches M5's own example config
  # (docs.m5stack.com/en/homeassistant/kit/dial), which likewise has
  # no `board:` key at all.
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# =====================================================================
#  Hardware
# =====================================================================
i2c:
  - id: bus_int
    sda: GPIO11
    scl: GPIO12
    scan: true

spi:
  - id: bus_disp
    clk_pin: GPIO6
    mosi_pin: GPIO5

display:
  - platform: mipi_spi
    id: disp_main
    model: GC9A01A
    spi_id: bus_disp
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    dimensions:
      width: 240
      height: 240
    # The GC9A01A glass in the M5Dial is mounted inverted. Without this
    # line every color arrives as its complementary color: green turns
    # pink, red turns green. Documented that way in M5's own guide for
    # the Dial with mipi_spi (docs.m5stack.com/en/homeassistant/kit/dial),
    # there alongside data_rate: 40MHz.
    invert_colors: true
    data_rate: 40MHz
    auto_clear_enabled: false
    # rotation does NOT belong here as long as LVGL is active —
    # it belongs in the lvgl block.

# The touch controller is an FT3267 and runs over the ft5x06 platform at
# address 0x38. NO interrupt_pin: the M5Dial reference config has GPIO14
# explicitly commented out — without the pin it's polled instead.
# With interrupt_pin, the first flash produced:
#   [E][component:143]: touchscreen is marked FAILED: unspecified
touchscreen:
  - platform: ft5x06
    id: touch_main
    i2c_id: bus_int
    address: 0x38
    display: disp_main

output:
  - platform: ledc
    id: out_backlight
    pin: GPIO9

light:
  - platform: monochromatic
    id: lgt_backlight
    output: out_backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

# =====================================================================
#  Sensors
# =====================================================================
#  The rotary encoder belongs to the device. The data sources below are
#  the EXCEPTION:
#
#  ONLY VALUES NEEDED BY MORE THAN ONE PAGE BELONG HERE.
#  Everything else lives on the page that displays it, with a
#  page-prefixed ID (s_power_1_soc, s_gas_a). Duplicate IDs are a hard
#  error in ESPHome — a collision fails at `esphome config`, not at
#  runtime. If a second page needs a value: move the sensor definition
#  here, rename the IDs, the validator will point out the leftovers.
# ---------------------------------------------------------------------
sensor:
  # M5 Dial: 16 detents, 64 pulses, 4 edges per detent — that's why
  # there's NO `resolution:`; otherwise one detent would jump four
  # pages. Doesn't know the page count: page.next just walks the list,
  # however long it is.
  - platform: rotary_encoder
    id: s_encoder
    internal: true
    pin_a: GPIO40
    pin_b: GPIO41
    on_clockwise:
      - lvgl.page.next
    on_anticlockwise:
      - lvgl.page.previous

  # ---- shared: clock page and temperature page ----------------------
  # There's (still) no real outdoor sensor on the vehicle. Until then
  # the value comes from the weather forecast for the location — that's
  # the region's air temperature, not the one at the vehicle. Once a
  # sensor exists: swap the entity_id and drop `attribute:`.
  - platform: homeassistant
    id: s_aussentemp
    entity_id: weather.forecast_home
    attribute: temperature

binary_sensor:
  - platform: gpio
    id: s_frontbutton
    internal: true
    pin:
      number: GPIO42
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      # Triple click: AUTO -> DAY -> NIGHT -> AUTO
      - timing:
          - ON for at most 0.35s
          - OFF for at most 0.35s
          - ON for at most 0.35s
          - OFF for at most 0.35s
          - ON for at most 0.35s
          - OFF for at least 0.2s
        then:
          - globals.set:
              id: g_daynight
              value: !lambda "return (id(g_daynight) + 1) % 3;"
          - script.execute: apply_daynight
      # Double click: back to the home page
      - timing:
          - ON for at most 0.35s
          - OFF for at most 0.35s
          - ON for at most 0.35s
          - OFF for at least 0.5s
        then:
          - lvgl.page.show: ${home_page}
      # Long press: also back to the home page
      - timing:
          - ON for 0.5s to 3s
          - OFF for at least 0.2s
        then:
          - lvgl.page.show: ${home_page}

text_sensor:
  # ---- shared: is the vehicle driving? -------------------------------
  # Later suppresses the overlays (pre-flight, cat litter box).
  # mbapi2020 delivers a state, not a switch:
  #   0 lock · 1 off · 2 accessory · 4 on · 5 start
  # Since v0.19.0, value_short/value_description are gone, so the state
  # is the bare number. The comparison below covers both.
  - platform: homeassistant
    id: s_ignition
    entity_id: sensor.nw19939_ignition_state

  # ---- shared: sun.sun follows the vehicle's GPS position ------------
  - platform: homeassistant
    id: s_sun
    entity_id: sun.sun
    on_value:
      - script.execute: apply_daynight

# =====================================================================
#  Day / Night
# =====================================================================
#  design.md §6: day and night differ ONLY in backlight brightness,
#  never in the color scheme -- except the clock page, a deliberate,
#  documented exception (design.md §6). This script is therefore the
#  one place in the header that reaches into a specific page's widget
#  (clock_face, from page_clock.yaml). That's only safe because every
#  cockpit currently includes the same page set (m5dial_fram_cockpit.yaml's
#  own comment: "otherwise the same packages") -- if a future dial ever
#  drops the clock page, this call needs to come out too, or the build
#  breaks on the missing id.
globals:
  - id: g_daynight
    type: int
    restore_value: true
    initial_value: "0" # 0 AUTO, 1 DAY, 2 NIGHT

script:
  - id: apply_daynight
    mode: restart
    then:
      - lambda: |-
          bool night;
          int m = id(g_daynight);
          if (m == 1) {
            night = false;
          } else if (m == 2) {
            night = true;
          } else {
            night = id(s_sun).has_state() && id(s_sun).state != "above_horizon";
          }
          auto call = id(lgt_backlight).turn_on();
          call.set_brightness(night ? 0.25f : 1.0f);
          call.perform();
          id(clock_face).set_night_mode(night);

# =====================================================================
#  LVGL frame
# =====================================================================
#  Only the frame. The pages: come from the page packages.
lvgl:
  id: lvgl_main
  displays:
    - disp_main
  touchscreens:
    - touch_main
  default_font: montserrat_16
  # Measured on the device: 0 is correct, not 180 (design.md §1 was
  # wrong). If a rotation is ever needed again: it goes here, not under
  # display: — with LVGL active, validation aborts otherwise.
  rotation: 0
  buffer_size: 25% # no PSRAM on the M5StampS3
  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER
