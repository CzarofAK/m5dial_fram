# =====================================================================
#  m5dial_fram_cockpit.yaml — device file
#  The dial on the dashboard, driver position.
#
#  This file creates the ESPHome device; it must live directly in
#  /config/esphome/, since the dashboard doesn't list subfolders
#  (os.listdir, non-recursive). The included files may sit deeper.
#
#  It contains no widgets, no lambdas, no geometry itself — only four
#  statements about THIS device:
#    1. what it's called,
#    2. where home is,
#    3. which pages it shows,
#    4. in which order.
#
#  THE ORDER OF THE PAGE PACKAGES IS THE PAGE ORDER.
#  Reordering means swapping two lines here (design.md §10).
#
#  A second dial in the FRAM gets a second file of this kind and
#  otherwise the same packages.
# =====================================================================

substitutions:
  name: "m5dial-fram-cockpit"
  friendly_name: "m5dial_fram_cockpit"

  # Page that double-click and long press jump back to. Must be the
  # LVGL page id (design.md §10: page_<name>), not the short page
  # name -- lvgl.page.show: ${home_page} in the header needs the id.
  home_page: "page_clock"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

packages:
  basics: !include .basics.yaml
  header: !include .m5dial_fram.yaml

  p0: !include m5dial_pages/page_clock.yaml
  p1: !include m5dial_pages/page_power_1.yaml
  p2: !include m5dial_pages/page_power_2.yaml
  p3: !include m5dial_pages/page_gas.yaml
  p4: !include m5dial_pages/page_water.yaml
  # p5-p11: draft pages, most with placeholder entity_ids that don't
  # point at anything real yet (design.md §15) -- they'll compile and
  # show "---" everywhere rather than break the build, but check each
  # one's entity_ids before relying on it.
  p5: !include m5dial_pages/page_levelling.yaml
  p6: !include m5dial_pages/page_climate.yaml
  p7: !include m5dial_pages/page_boiler.yaml
  p8: !include m5dial_pages/page_fans.yaml
  p9: !include m5dial_pages/page_lights_outside.yaml
  p10: !include m5dial_pages/page_entrance.yaml
  p11: !include m5dial_pages/page_ipixel.yaml

  # Overlays (design.md §15): not pages, no p<n> slot, no page order --
  # they add to LVGL's top_layer instead of pages:, shown over whatever
  # page is current.
  ov_litterbox: !include m5dial_pages/overlay_litterbox.yaml
