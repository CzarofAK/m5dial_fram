# =====================================================================
#  basics.example.yaml — template for .basics.yaml
#
#  m5dial_fram.yaml assumes a `.basics.yaml` already sits in the
#  ESPHome directory (design_rules.md §12) and does NOT include it
#  itself. m5dial_fram_cockpit.yaml pulls it in as the `basics:`
#  package.
#
#  Copy this file to /config/esphome/.basics.yaml (or wherever your
#  ESPHome directory is) and adjust to taste. It's shared by every
#  ESPHome device in the install, not just the M5 Dials, which is why
#  it lives outside this repo instead of being included from here.
#
#  Needs these keys in secrets.yaml:
#    wifi_ssid, wifi_password, password (used by the OTA platform),
#    api_encryption_key, ap_password
# =====================================================================

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 17dB
  reboot_timeout: 0s
  on_connect:
    - logger.log: "WiFi CONNECTED"
  on_disconnect:
    - logger.log: "WiFi DISCONNECTED"
  ap:
    # Fallback AP, so a device with bad wifi credentials is still
    # reachable. ${name} comes from the device file (e.g.
    # m5dial_fram_cockpit.yaml), so the AP name identifies the device.
    ssid: ${name}
    password: !secret ap_password

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

web_server:
  port: 80
  version: 3
  local: true

logger:
  level: WARN

# Referenced by every page as `homeassistant_time` (e.g. the clock page,
# design_rules.md §7's invalid-date fallback).
time:
  - platform: homeassistant
    id: homeassistant_time

# Referenced by the day/night triple-click handler in m5dial_fram.yaml.
button:
  - platform: restart
    name: "Restart"
    id: restart_button

# Watchdog: if neither the configured wifi nor the fallback AP is up
# five minutes after boot, restart. Prevents a device from getting
# stuck unreachable after a wifi outage.
interval:
  - interval: 1min
    startup_delay: 5min
    then:
      - if:
          condition:
            and:
              - not:
                  wifi.connected:
              - not:
                  wifi.ap_active:
          then:
            - logger.log: "Neither wifi nor fallback AP - restarting"
            - button.press: restart_button
