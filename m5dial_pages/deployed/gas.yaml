# =====================================================================
#  m5dial/gas.yaml — Seite: Gas (zwei Flaschen)
#  FRAM M5Dial Cockpit · Seiten-Package (Block B + C + D)
#
#
#  Doppelring (design.md §4):
#    aussen 224 x 224, arc_width 10 -> r 102..112   GAS A (in Betrieb)
#    innen  200 x 200, arc_width 10 -> r  90..100   GAS I (Reserve)
#    beide 135 -> 45. Nutzbarer Innenradius dadurch 90 px.
#
#  Zwei-Wert-Layout (design.md §3), beide Spalten auf x ±${x_col}:
#    y_cap    GAS A / GAS I    montserrat_12, Farbe des Rings
#    y_main   72%              montserrat_24
#    y_line2  7.6 kg           montserrat_16, 0xBDC1C6
#    y_row    frei (kein Taster)
#    y_footer Statuszeile
#
#  Breitenprüfung: "GAS I" montserrat_12 ≈ 57.5 px, bei y_cap -42 steht
#  bis x ±75 zur Verfügung. "100%" montserrat_24 ≈ 54 px, Spalte ~82 px.
#  Fusszeile "GAS A LEER" ≈ 66 px, in der Lücke bei y 90 sind es 152 px.
#
#  Die Beschriftung benennt den RING, nicht die Einbaulage: zwei
#  Flaschen stehen hintereinander, und konzentrische Ringe haben kein
#  Links und kein Rechts (design.md §3).
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
# Welche Flasche physisch am Aussenring haengt, entscheidet allein die
# entity_id (design.md §10).
sensor:
  - platform: homeassistant
    id: s_gas_a
    entity_id: sensor.gas_1_stand
    on_value:
      - script.execute: draw_gas
  - platform: homeassistant
    id: s_gas_i
    entity_id: sensor.gas_2_stand
    on_value:
      - script.execute: draw_gas

script:
  - id: draw_gas
    mode: restart
    then:
      # ---- Aussenring: GAS A ---------------------------------------
      - lvgl.arc.update:
          id: arc_gas_a
          value: !lambda |-
            if (!id(s_gas_a).has_state()) return 0.0f;
            return id(s_gas_a).state;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_gas_a).has_state()) return lv_color_hex(0x555555);
              float v = id(s_gas_a).state;
              if (v < 10.0f) return lv_color_hex(0xE74C3C);
              if (v < 25.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x4A9EFF);

      # ---- Innenring: GAS I ----------------------------------------
      - lvgl.arc.update:
          id: arc_gas_i
          value: !lambda |-
            if (!id(s_gas_i).has_state()) return 0.0f;
            return id(s_gas_i).state;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_gas_i).has_state()) return lv_color_hex(0x555555);
              float v = id(s_gas_i).state;
              if (v < 10.0f) return lv_color_hex(0xE74C3C);
              if (v < 25.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x9AA0A6);

      # ---- Spaltenbeschriftung, trägt die Ringfarbe ----------------
      - lvgl.label.update:
          id: lbl_gas_cap_a
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_gas_a).has_state()) return lv_color_hex(0x555555);
            float v = id(s_gas_a).state;
            if (v < 10.0f) return lv_color_hex(0xE74C3C);
            if (v < 25.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0x4A9EFF);
      - lvgl.label.update:
          id: lbl_gas_cap_i
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_gas_i).has_state()) return lv_color_hex(0x555555);
            float v = id(s_gas_i).state;
            if (v < 10.0f) return lv_color_hex(0xE74C3C);
            if (v < 25.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0x9AA0A6);

      # ---- Prozentwerte --------------------------------------------
      - lvgl.label.update:
          id: lbl_gas_pct_a
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---%");
            #endif
            if (!id(s_gas_a).has_state()) return std::string("---%");
            return str_sprintf("%.0f%%", id(s_gas_a).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_gas_a).has_state()) return lv_color_hex(0x555555);
            float v = id(s_gas_a).state;
            if (v < 10.0f) return lv_color_hex(0xE74C3C);
            if (v < 25.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);
      - lvgl.label.update:
          id: lbl_gas_pct_i
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---%");
            #endif
            if (!id(s_gas_i).has_state()) return std::string("---%");
            return str_sprintf("%.0f%%", id(s_gas_i).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_gas_i).has_state()) return lv_color_hex(0x555555);
            float v = id(s_gas_i).state;
            if (v < 10.0f) return lv_color_hex(0xE74C3C);
            if (v < 25.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- Absolutwerte --------------------------------------------
      # Fahrzeugfeste Konstante als Literal (design.md §9):
      # Gasflasche 10.5 kg netto.
      - lvgl.label.update:
          id: lbl_gas_kg_a
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("--- kg");
            #endif
            if (!id(s_gas_a).has_state()) return std::string("--- kg");
            return str_sprintf("%.1f kg", id(s_gas_a).state * 0.105f);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_gas_a).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);
      - lvgl.label.update:
          id: lbl_gas_kg_i
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("--- kg");
            #endif
            if (!id(s_gas_i).has_state()) return std::string("--- kg");
            return str_sprintf("%.1f kg", id(s_gas_i).state * 0.105f);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_gas_i).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Statuszeile ---------------------------------------------
      # design.md §6: zwei austauschbare Behälter, es zählt der Vorrat.
      # Der graue Fall setzt die automatische Umschaltung voraus
      # (Truma Duo). Ohne Umschaltung gehört er auf orange.
      - lvgl.label.update:
          id: lbl_gas_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (!id(s_gas_a).has_state() || !id(s_gas_i).has_state())
              return std::string("KEIN WERT");
            float a = id(s_gas_a).state;
            float i = id(s_gas_i).state;
            if (a < 10.0f && i < 10.0f) return std::string("GAS LEER");
            if (a < 25.0f && i < 25.0f) return std::string("GAS KNAPP");
            if (a < 10.0f) return std::string("GAS A LEER");
            if (i < 10.0f) return std::string("GAS I LEER");
            return std::string("");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_gas_a).has_state() || !id(s_gas_i).has_state())
              return lv_color_hex(0x555555);
            float a = id(s_gas_a).state;
            float i = id(s_gas_i).state;
            if (a < 10.0f && i < 10.0f) return lv_color_hex(0xE74C3C);
            if (a < 25.0f && i < 25.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0x707070);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_gas

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_gas
      # Eine LVGL-Seite ist per Default ein deckend WEISSES Objekt und
      # liegt ueber dem bottom_layer aus dem Header. Ohne diese zwei
      # Zeilen steht alles auf weissem Grund (Korrektur zu design.md §8).
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - arc:
            id: arc_gas_a
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x3C4043
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        - arc:
            id: arc_gas_i
            align: CENTER
            width: 200
            height: 200
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x3C4043
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        # ---- Spalte aussen -----------------------------------------
        - label:
            id: lbl_gas_cap_a
            align: CENTER
            x: -${x_col}
            y: ${y_cap}
            text: "GAS A"
            text_font: montserrat_12
            text_color: 0x555555
        - label:
            id: lbl_gas_pct_a
            align: CENTER
            x: -${x_col}
            y: ${y_main}
            text: "---%"
            text_font: montserrat_24
            text_color: 0x555555
        - label:
            id: lbl_gas_kg_a
            align: CENTER
            x: -${x_col}
            y: ${y_line2}
            text: "--- kg"
            text_font: montserrat_16
            text_color: 0x555555

        # ---- Spalte innen ------------------------------------------
        - label:
            id: lbl_gas_cap_i
            align: CENTER
            x: ${x_col}
            y: ${y_cap}
            text: "GAS I"
            text_font: montserrat_12
            text_color: 0x555555
        - label:
            id: lbl_gas_pct_i
            align: CENTER
            x: ${x_col}
            y: ${y_main}
            text: "---%"
            text_font: montserrat_24
            text_color: 0x555555
        - label:
            id: lbl_gas_kg_i
            align: CENTER
            x: ${x_col}
            y: ${y_line2}
            text: "--- kg"
            text_font: montserrat_16
            text_color: 0x555555

        - label:
            id: lbl_gas_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: montserrat_12
            text_color: 0x555555
