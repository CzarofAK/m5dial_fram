# =====================================================================
#  m5dial/strom2.yaml — page: Power / Grid (MultiPlus)
#  FRAM M5Dial Cockpit · page package (block B + C + D)
#
#
#  Slots (design.md §3):
#    y_main   1240W            montserrat_40
#    y_line2  ABSORPTION       montserrat_16
#    y_row    two buttons      76 x 30 each, x ±${x_col}
#    y_footer status line      montserrat_12
#
#  The arc shows the load as a percentage of the configured current
#  limit (design.md §8: never a physical quantity).
#  Width check y_line2: "ABSORPTION" montserrat_16 ≈ 92 px, about 197 px
#  available at y 25. Fits.
#  Button: 3–4 characters (design.md §8) — ON / CHG / INV / OFF, "16 A".
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_strom2_w
    entity_id: sensor.multiplus_eingangsleistung_l1
    on_value:
      - script.execute: draw_strom2
  - platform: homeassistant
    id: s_strom2_a
    entity_id: sensor.multiplus_eingangsstromstarke_l1
    on_value:
      - script.execute: draw_strom2
  - platform: homeassistant
    id: s_strom2_limit
    entity_id: number.multiplus_strombegrenzung
    on_value:
      - script.execute: draw_strom2

text_sensor:
  - platform: homeassistant
    id: s_strom2_state
    entity_id: sensor.multiplus_zustand
    on_value:
      - script.execute: draw_strom2

  - platform: homeassistant
    id: s_strom2_mode
    entity_id: select.multiplus
    # The button shows three characters (design.md §8). The shortening
    # lives here as a filter, so blocks C and D don't need to know
    # about it.
    filters:
      - lambda: |-
          // Options of select.multiplus:
          //   charger_only · inverter_only · on · off
          std::string s = x;
          if (s == "on") return std::string("ON");
          if (s == "charger_only") return std::string("CHG");
          if (s == "inverter_only") return std::string("INV");
          return std::string("OFF");
    on_value:
      - script.execute: draw_strom2

script:
  # OPEN ITEM (design.md §13): the jump to OFF takes away shore power,
  # charging, and 230 V, and should require a long press.
  - id: act_strom2_mode
    then:
      - homeassistant.service:
          service: select.select_option
          data:
            entity_id: select.multiplus
          data_template:
            option: "{{ opt }}"
          variables:
            opt: !lambda |-
              // ON -> CHG -> INV -> OFF -> ON
              std::string m = id(s_strom2_mode).state;
              if (m == "ON")  return std::string("charger_only");
              if (m == "CHG") return std::string("inverter_only");
              if (m == "INV") return std::string("off");
              return std::string("on");

  - id: act_strom2_limit
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.multiplus_strombegrenzung
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda |-
              // next value up, snapping to the list in case HA
              // returns an in-between value (e.g. 10.5)
              static const float t[] = {4.0f, 6.0f, 8.0f, 10.0f, 13.0f, 16.0f};
              float cur = id(s_strom2_limit).has_state() ? id(s_strom2_limit).state : 4.0f;
              for (int i = 0; i < 6; i++)
                if (t[i] > cur + 0.1f) return str_sprintf("%.0f", t[i]);
              return std::string("4");

  - id: draw_strom2
    mode: restart
    then:
      # ---- Arc: load as % of the limit -------------------------------
      - lvgl.arc.update:
          id: arc_strom2
          value: !lambda |-
            if (!id(s_strom2_a).has_state() || !id(s_strom2_limit).has_state())
              return 0.0f;
            float lim = id(s_strom2_limit).state;
            if (lim <= 0.0f) return 0.0f;
            float p = id(s_strom2_a).state / lim * 100.0f;
            if (p > 100.0f) p = 100.0f;
            if (p < 0.0f) p = 0.0f;
            return p;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_strom2_a).has_state() || !id(s_strom2_limit).has_state())
                return lv_color_hex(0x555555);
              float lim = id(s_strom2_limit).state;
              if (lim <= 0.0f) return lv_color_hex(0x555555);
              float p = id(s_strom2_a).state / lim * 100.0f;
              if (p >= 95.0f) return lv_color_hex(0xE74C3C);
              if (p >= 80.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x4A9EFF);

      # ---- Main value: input power -----------------------------------
      - lvgl.label.update:
          id: lbl_strom2_w
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---W");
            #endif
            if (!id(s_strom2_w).has_state()) return std::string("---W");
            return str_sprintf("%.0fW", id(s_strom2_w).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom2_w).has_state()) return lv_color_hex(0x555555);
            if (!id(s_strom2_a).has_state() || !id(s_strom2_limit).has_state())
              return lv_color_hex(0xFFFFFF);
            float lim = id(s_strom2_limit).state;
            if (lim <= 0.0f) return lv_color_hex(0xFFFFFF);
            float p = id(s_strom2_a).state / lim * 100.0f;
            if (p >= 95.0f) return lv_color_hex(0xE74C3C);
            if (p >= 80.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- Secondary line: MP state ------------------------------------
      - lvgl.label.update:
          id: lbl_strom2_state
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_strom2_state).has_state()) return std::string("---");
            // Options come as snake_case: bulk, absorption, float,
            // inverting, fault, power_assist, scheduled_recharging, ...
            // Longest case "SCHEDULED RECHARGING" = 20 characters ~184 px,
            // 197 px are available at y_line2 (design.md §4).
            std::string s = id(s_strom2_state).state;
            for (auto &c : s) { if (c == '_') c = ' '; else c = ::toupper(c); }
            return s;
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom2_state).has_state()) return lv_color_hex(0x555555);
            std::string s = id(s_strom2_state).state;
            if (s == "fault") return lv_color_hex(0xE74C3C);
            if (s == "off" || s == "low_power") return lv_color_hex(0x707070);
            return lv_color_hex(0xBDC1C6);

      # ---- Left button: mode -------------------------------------------
      - lvgl.label.update:
          id: lbl_strom2_mode
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_strom2_mode).has_state()) return std::string("---");
            return id(s_strom2_mode).state;
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom2_mode).has_state()) return lv_color_hex(0x555555);
            std::string m = id(s_strom2_mode).state;
            if (m == "ON")  return lv_color_hex(0x2ECC71);
            if (m == "CHG") return lv_color_hex(0x4A9EFF);
            if (m == "INV") return lv_color_hex(0xF39C12);
            return lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_strom2_mode
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_strom2_mode).has_state()) return lv_color_hex(0x202124);
            std::string m = id(s_strom2_mode).state;
            if (m == "ON")  return lv_color_hex(0x1B5E3A);
            if (m == "CHG") return lv_color_hex(0x14324F);
            if (m == "INV") return lv_color_hex(0x4F3814);
            return lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_strom2_mode).has_state()) return lv_color_hex(0x3C4043);
            std::string m = id(s_strom2_mode).state;
            if (m == "ON")  return lv_color_hex(0x2ECC71);
            if (m == "CHG") return lv_color_hex(0x4A9EFF);
            if (m == "INV") return lv_color_hex(0xF39C12);
            return lv_color_hex(0x3C4043);

      # ---- Right button: current limit ----------------------------------
      - lvgl.label.update:
          id: lbl_strom2_limit
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("--A");
            #endif
            if (!id(s_strom2_limit).has_state()) return std::string("--A");
            return str_sprintf("%.0fA", id(s_strom2_limit).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom2_limit).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0x4A9EFF);
      - lvgl.widget.update:
          id: btn_strom2_limit
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_strom2_limit).has_state()) return lv_color_hex(0x202124);
            return lv_color_hex(0x14324F);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_strom2_limit).has_state()) return lv_color_hex(0x3C4043);
            return lv_color_hex(0x4A9EFF);

      # ---- Status line ---------------------------------------------
      - lvgl.label.update:
          id: lbl_strom2_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (!id(s_strom2_a).has_state() || !id(s_strom2_limit).has_state())
              return std::string("");
            float lim = id(s_strom2_limit).state;
            if (lim <= 0.0f) return std::string("");
            float p = id(s_strom2_a).state / lim * 100.0f;
            if (p >= 95.0f) return std::string("NETZ AM LIMIT");
            if (p >= 80.0f) return std::string("NETZ HOCH");
            return std::string("");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom2_a).has_state() || !id(s_strom2_limit).has_state())
              return lv_color_hex(0x555555);
            float lim = id(s_strom2_limit).state;
            if (lim <= 0.0f) return lv_color_hex(0x555555);
            float p = id(s_strom2_a).state / lim * 100.0f;
            if (p >= 95.0f) return lv_color_hex(0xE74C3C);
            return lv_color_hex(0xF39C12);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_strom2

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_strom2
      # An LVGL page is by default an opaque WHITE object and sits over
      # the bottom_layer from the header. Without these two lines
      # everything sits on a white background (correction to design.md
      # §8).
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - arc:
            id: arc_strom2
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        - label:
            id: lbl_strom2_w
            align: CENTER
            y: ${y_main}
            text: "---W"
            text_font: montserrat_40
            text_color: 0x555555

        - label:
            id: lbl_strom2_state
            align: CENTER
            y: ${y_line2}
            text: "---"
            text_font: montserrat_16
            text_color: 0x555555

        - button:
            id: btn_strom2_mode
            align: CENTER
            x: -${x_col}
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_strom2_mode
                  align: CENTER
                  text: "---"
                  text_font: montserrat_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_strom2_mode

        - button:
            id: btn_strom2_limit
            align: CENTER
            x: ${x_col}
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_strom2_limit
                  align: CENTER
                  text: "--A"
                  text_font: montserrat_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_strom2_limit

        - label:
            id: lbl_strom2_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: montserrat_12
            text_color: 0x555555
