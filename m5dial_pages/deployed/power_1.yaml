# =====================================================================
#  m5dial/strom1.yaml — Seite: Strom / Batterie
#  FRAM M5Dial Cockpit · Seiten-Package (Block B + C + D)
#
#  Datenquellen kommen aus sources/strom1.sim.yaml bzw. strom1.ha.yaml.
#
#  Slots (design.md §3):
#    y_main   72%              montserrat_40
#    y_line2  13.4V  -12A      montserrat_16
#    y_row    Taster PARK      104 x 30
#    y_footer Statuszeile      montserrat_12
#
#  Statuszeile: design.md §6 verlangt "im Normalbetrieb leer". Die
#  Starterbatterie steht deshalb nur unten, wenn sie nicht "ok" meldet.
#  Sie liefert einen Zustand, keine Spannung — die Schwellen 12.4/12.0 V
#  aus design.md §6 sind damit gegenstandslos, solange kein echter
#  Spannungsfuehler an der Starterbatterie haengt.
#
#  Breitenprüfung y_main (montserrat_40, Kastenoberkante -44.5, r 102):
#    verfügbar ~183 px, "100%" ≈ 100 px. Passt.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
# Hängt sich per ID an die Sensoren aus dem Quellen-Package. Merge nach
# id: die Plattform steht dort, der Trigger hier.
sensor:
  - platform: homeassistant
    id: s_strom1_soc
    entity_id: sensor.smartshunt_ladestand
    on_value:
      - script.execute: draw_strom1
  - platform: homeassistant
    id: s_strom1_dc_v
    entity_id: sensor.smartshunt_dc_bus_spannung
    on_value:
      - script.execute: draw_strom1
  - platform: homeassistant
    id: s_strom1_dc_a
    entity_id: sensor.smartshunt_dc_bus_stromstarke
    on_value:
      - script.execute: draw_strom1

text_sensor:
  # Die Starterbatterie liefert KEINE Spannung, sondern einen Zustand
  # (mbapi2020):
  #   0 green            Vehicle ok
  #   1 yellow           Battery partly charged
  #   2 red              Vehicle not available
  #   3 serviceDisabled  Remote service disabled
  #   4 vehicleNotAvalable
  # 2/3/4 sagen nichts ueber die Batterie, sondern dass die Abfrage
  # nicht durchkam — die gelten deshalb als "kein Wert", nicht als Alarm.
  - platform: homeassistant
    id: s_strom1_starter
    entity_id: sensor.nw19939_starter_battery_state
    on_value:
      - script.execute: draw_strom1

binary_sensor:
  - platform: homeassistant
    id: s_strom1_park
    entity_id: switch.fram_parkmodus
    on_state:
      - script.execute: draw_strom1

script:
  # Der Taster ruft nie direkt einen Dienst, sondern immer ein
  # act_-Skript. Damit bleibt Block D geraeteunabhaengig.
  - id: act_strom1_park
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.fram_parkmodus

  - id: draw_strom1
    mode: restart
    then:
      # ---- Bogen + Hauptwert: SOC ----------------------------------
      - lvgl.arc.update:
          id: arc_strom1_soc
          value: !lambda |-
            if (!id(s_strom1_soc).has_state()) return 0.0f;
            return id(s_strom1_soc).state;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_strom1_soc).has_state()) return lv_color_hex(0x555555);
              float v = id(s_strom1_soc).state;
              if (v < 20.0f) return lv_color_hex(0xE74C3C);
              if (v < 40.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x2ECC71);

      - lvgl.label.update:
          id: lbl_strom1_soc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---%");
            #endif
            if (!id(s_strom1_soc).has_state()) return std::string("---%");
            return str_sprintf("%.0f%%", id(s_strom1_soc).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom1_soc).has_state()) return lv_color_hex(0x555555);
            float v = id(s_strom1_soc).state;
            if (v < 20.0f) return lv_color_hex(0xE74C3C);
            if (v < 40.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- Nebenzeile: DC-Spannung und -Strom ----------------------
      - lvgl.label.update:
          id: lbl_strom1_dc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---V  ---A");
            #endif
            if (!id(s_strom1_dc_v).has_state() || !id(s_strom1_dc_a).has_state())
              return std::string("---V  ---A");
            return str_sprintf("%.1fV  %+.0fA", id(s_strom1_dc_v).state, id(s_strom1_dc_a).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom1_dc_v).has_state() || !id(s_strom1_dc_a).has_state())
              return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Taster: Parkmodus ---------------------------------------
      # design.md §7: ohne Verbindung "PARK ---", nicht "PARK AUS".
      - lvgl.label.update:
          id: lbl_strom1_park
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("PARK ---");
            #endif
            if (!id(s_strom1_park).has_state()) return std::string("PARK ---");
            return id(s_strom1_park).state ? std::string("PARK EIN")
                                    : std::string("PARK AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom1_park).has_state()) return lv_color_hex(0x555555);
            return id(s_strom1_park).state ? lv_color_hex(0x2ECC71)
                                    : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_strom1_park
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_strom1_park).has_state()) return lv_color_hex(0x202124);
            return id(s_strom1_park).state ? lv_color_hex(0x1B5E3A)
                                    : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_strom1_park).has_state()) return lv_color_hex(0x3C4043);
            return id(s_strom1_park).state ? lv_color_hex(0x2ECC71)
                                    : lv_color_hex(0x3C4043);

      # ---- Statuszeile: Starterbatterie nur im Warnfall ------------
      # design.md §6: im Normalbetrieb leer.
      - lvgl.label.update:
          id: lbl_strom1_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (!id(s_strom1_starter).has_state()) return std::string("");
            std::string v = id(s_strom1_starter).state;
            if (v == "1" || v == "yellow") return std::string("START SCHWACH");
            if (v == "0" || v == "green")  return std::string("");
            // 2/3/4: Fahrzeug bzw. Fernabfrage nicht erreichbar
            return std::string("START KEIN WERT");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_strom1_starter).has_state()) return lv_color_hex(0x555555);
            std::string v = id(s_strom1_starter).state;
            if (v == "1" || v == "yellow") return lv_color_hex(0xF39C12);
            return lv_color_hex(0x555555);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_strom1

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_strom1
      # Eine LVGL-Seite ist per Default ein deckend WEISSES Objekt und
      # liegt ueber dem bottom_layer aus dem Header. Ohne diese zwei
      # Zeilen steht alles auf weissem Grund (Korrektur zu design.md §8).
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - arc:
            id: arc_strom1_soc
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x3C4043
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        - label:
            id: lbl_strom1_soc
            align: CENTER
            y: ${y_main}
            text: "---%"
            text_font: montserrat_40
            text_color: 0x555555

        - label:
            id: lbl_strom1_dc
            align: CENTER
            y: ${y_line2}
            text: "---V  ---A"
            text_font: montserrat_16
            text_color: 0x555555

        - button:
            id: btn_strom1_park
            align: CENTER
            y: ${y_row}
            width: 104
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_strom1_park
                  align: CENTER
                  text: "PARK ---"
                  text_font: montserrat_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_strom1_park

        - label:
            id: lbl_strom1_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: montserrat_12
            text_color: 0x555555
