# =====================================================================
#  m5dial_pages/page_boiler.yaml — page: Boiler (water heating)
#  FRAM M5Dial Cockpit · page package
#
#  The water-heating side of the same Truma Combi 4 as page_climate.yaml
#  — see that file's header for the integration background (real path
#  is the MQTT-based "womolin_controller" integration, not the
#  truma_inetbox guess this page originally assumed):
#    switch.womolin_controller_mqtt_activate_water_heater  on/off gate
#    climate.womolin_controller_mqtt_truma_water            the heater
#  Same caveat: the activate switch must be ON before the climate
#  entity carries live values, and every change (switch or target
#  temperature) has real lag -- ca. 2-4s, Truma's own LIN round trip,
#  not something to work around here.
#
#  Current/target water temperature come off the climate entity's own
#  current_temperature/temperature attributes, same as page_climate.yaml
#  — no separate sensor/number entity, and climate.set_temperature
#  instead of number.set_value.
#
#  OPEN ITEM: a shared fault flag existed on the old (wrong)
#  truma_inetbox assumption; dropped here rather than guessed again
#  under the real integration (design.md §15) — add it back once a
#  real error entity/attribute is confirmed.
#
#  Slots (design.md §3):
#    y_main   40°C              montserrat_40 — current water temp
#    y_line2  SOLL 60°C ECO     montserrat_16 — target temp + tier tag
#    y_row    one button        BOILER on/off (design.md §4: "BOILER
#                                AUS" is 10 characters, wider than any
#                                existing button label in this repo --
#                                check it actually fits the 104 px
#                                button on the real device, not just
#                                in the simulator)
#    y_row2   one button        SOLL, arms water temp for the encoder
#    y_footer status line       montserrat_12 — "turn to adjust" hint
#                                while armed
#
#  Button labels (readability follow-up: "SET" next to "BOILER EIN/AUS"
#  didn't say what either one actually controlled): the row-2 button is
#  now labelled SOLL, matching the SOLL line above it it arms -- BOILER
#  EIN/AUS is unambiguously the power toggle, SOLL is unambiguously the
#  temperature one.
#
#  NOT continuously adjustable, unlike page_climate.yaml's room temp:
#  this Truma boiler only actually has three fixed levels -- ECO
#  (40°C), an unnamed middle one (60°C, name TBD -- ask before
#  guessing, Truma's own naming isn't consistent enough across models
#  to assume), and BOOST (80°C). The encoder/double-click step
#  therefore jumps between exactly those three values, not ±1°C --
#  sending an in-between temperature to climate.set_temperature would
#  either get silently clamped by the Truma or just not correspond to
#  anything the physical control panel can select, so stepping through
#  the three real options is the correct behavior here, not a
#  simplification. SOLL shows the tier tag (ECO/BOOST) next to the two
#  known ones; the middle stays untagged until the name's confirmed --
#  update the string in draw_boiler once it is, don't guess it.
#
#  Water temp is encoder-adjustable (design.md §14, g_edit_target in
#  .m5dial_fram.yaml) via the SOLL button, same as page_climate.yaml's
#  room temp -- and the same guard: refuses to arm while BOILER is
#  off, since a target set while off doesn't take effect on the Truma.
#
#  Double-click on the physical front button cycles this page's two
#  actions, same pattern as page_climate.yaml (.m5dial_fram.yaml's
#  double-click handler -- home is long-press-only here now): 1st
#  click arms water temp, 2nd toggles BOILER, 3rd back to arming.
#
#  Encoder feel: same lag fix as page_power_2.yaml/page_climate.yaml
#  (see either header) -- adjusts a local g_boiler_temp_pending value
#  and redraws from it immediately, only calling climate.set_temperature
#  once the encoder's quiet for 400ms (or immediately on disarm). Less
#  load-bearing here than on the continuous pages since there are only
#  three possible values to land on, but keeps the behavior consistent
#  and the write still debounced against a fast double-tap of the
#  encoder.
#
#  Two more lag fixes, both about the DIAL not adding its own delay on
#  top of the Truma's (user feedback: the Truma lag alone is already
#  tedious from HA, doubling it via the dial made it "ungeniessbar") --
#  identical to page_climate.yaml's, see that file's header for the
#  fuller explanation:
#  1. SOLL is now ALWAYS rendered from g_boiler_temp_pending, armed or
#     not, instead of falling back to the stale confirmed value on
#     disarm. g_boiler_temp_known gates the "---" placeholder.
#  2. BOILER's button shows a local optimistic guess
#     (g_boiler_heater_optimistic) the instant it's tapped, ahead of
#     switch.womolin_controller_mqtt_activate_water_heater's own
#     confirmation.
#
#  Interlock (user report, new standard -- shared with page_climate.yaml,
#  see that file's header for the fuller rationale; applies to any
#  future AC control the same way): BOILER SOLL is only actually
#  USABLE while confirmed on, not merely shown as on via the optimistic
#  guess above. Before this fix, an already-armed SOLL stayed armed
#  even after the confirmed state flipped back to off, so the encoder
#  kept "working" and kept writing a target the Truma was no longer
#  listening to -- the reported "riesen Durcheinander". Now:
#  1. s_boiler_heater_on's on_state auto-disarms (flushing the pending
#     write first) the moment the CONFIRMED state goes to off while
#     target 5 is armed.
#  2. btn_boiler_temp_set/lbl_boiler_temp_set (draw_boiler) render a
#     third, visually distinct LOCKED state (dim border, dim label)
#     whenever BOILER isn't confirmed on, instead of looking identical
#     to the normal idle/available state.
#  3. The footer shows "BOILER STARTET" during the window where the
#     optimistic guess already says on but the real confirmation hasn't
#     arrived yet.
#  4. dc_boiler_cycle (below) only advances past its "arm" step once
#     arming actually happened, instead of advancing regardless and
#     flip-flopping the heater on/off if double-clicked again during
#     the confirmation lag.
#
#  on_load poll (design.md §9): HA only pushes an entity's CURRENT
#  value to this device at API-connect time if HA already has one --
#  an entity that's still unknown/unavailable at that moment sends
#  nothing, and then only catches up whenever it next changes on its
#  own (which, for something like a slow-polling integration, can be a
#  long wait -- reported as pages sitting on "---" until unrelated
#  interaction happened to trigger a state change). poll_boiler calls
#  homeassistant.update_entity per entity on page_boiler's own on_load
#  trigger, forcing a fresh push every time this page is actually
#  shown, rather than a background timer running for a page nobody's
#  looking at.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_boiler_temp
    entity_id: climate.womolin_controller_mqtt_truma_water
    attribute: current_temperature
    on_value:
      - script.execute: draw_boiler
  - platform: homeassistant
    id: s_boiler_target
    entity_id: climate.womolin_controller_mqtt_truma_water
    attribute: temperature
    on_value:
      # Resync pending from the confirmed value, but only while NOT
      # armed -- never fight an active edit. See header re: lag.
      - if:
          condition:
            lambda: return id(g_edit_target) != 5;
          then:
            - lambda: |-
                id(g_boiler_temp_pending) = id(s_boiler_target).state;
                id(g_boiler_temp_known) = true;
      - script.execute: draw_boiler

binary_sensor:
  - platform: homeassistant
    id: s_boiler_heater_on
    entity_id: switch.womolin_controller_mqtt_activate_water_heater
    on_state:
      # Real state just arrived -- stop trusting the optimistic guess.
      - globals.set:
          id: g_boiler_heater_optimistic_valid
          value: "false"
      # Interlock (see header): if SOLL was armed and the CONFIRMED
      # state just went to off, disarm it now instead of leaving the
      # encoder live on a target that can't take effect any more.
      - if:
          condition:
            lambda: |-
              return id(g_edit_target) == 5 &&
                     !(id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state);
          then:
            - lambda: |-
                id(boiler_temp_write_debounced)->stop();
                id(boiler_temp_write_now)->execute();
                id(g_edit_target) = 0;
      - script.execute: draw_boiler

globals:
  # Page-local, same reasoning as page_power_2.yaml's
  # g_power_2_assist_pending / page_climate.yaml's g_climate_temp_pending.
  # Kept in sync from s_boiler_target while not armed too -- see header.
  - id: g_boiler_temp_pending
    type: float
    restore_value: false
    initial_value: "40"

  # Gates the "---" placeholder -- g_boiler_temp_pending can't be told
  # apart from "genuinely 40°C" on its own.
  - id: g_boiler_temp_known
    type: bool
    restore_value: false
    initial_value: "false"

  # Optimistic BOILER state shown instantly on tap, ahead of
  # s_boiler_heater_on's own confirmation -- see header re: lag.
  - id: g_boiler_heater_optimistic
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_boiler_heater_optimistic_valid
    type: bool
    restore_value: false
    initial_value: "false"

  # Double-click cycle position (.m5dial_fram.yaml's dc_boiler_cycle):
  # 0 = arm temp SET next, 1 = toggle BOILER next.
  - id: g_boiler_dc_pos
    type: int
    restore_value: false
    initial_value: "0"

script:
  # Forces a fresh push from HA for this page's entities -- called
  # from page_boiler's own on_load trigger below. See header re: why.
  - id: poll_boiler
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: climate.womolin_controller_mqtt_truma_water
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.womolin_controller_mqtt_activate_water_heater

  - id: act_boiler_heater
    then:
      - lambda: |-
          bool cur = id(g_boiler_heater_optimistic_valid)
              ? id(g_boiler_heater_optimistic)
              : (id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state);
          id(g_boiler_heater_optimistic) = !cur;
          id(g_boiler_heater_optimistic_valid) = true;
      - script.execute: draw_boiler
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.womolin_controller_mqtt_activate_water_heater

  # Water temp (target 5), same guard as page_climate.yaml's target 3:
  # refuses to arm while BOILER is off, since a target set while off
  # doesn't take effect on the Truma.
  - id: act_boiler_arm_temp
    then:
      - if:
          condition:
            lambda: return id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state;
          then:
            - lambda: |-
                bool was_armed = (id(g_edit_target) == 5);
                id(g_edit_target) = was_armed ? 0 : 5;
                if (!was_armed) {
                  id(g_boiler_temp_pending) = id(s_boiler_target).has_state() ? id(s_boiler_target).state : 40.0f;
                  id(g_boiler_temp_known) = true;
                } else {
                  id(boiler_temp_write_debounced)->stop();
                  id(boiler_temp_write_now)->execute();
                }
      - script.execute: draw_boiler

  # Called by .m5dial_fram.yaml's double-click handler -- see header.
  # Interlock follow-up (same fix as page_climate.yaml's dc_climate_cycle,
  # see that file's comment for the fuller rationale): position only
  # advances past the "arm" step once arming actually happened.
  - id: dc_boiler_cycle
    then:
      - if:
          condition:
            lambda: return id(g_boiler_dc_pos) == 0;
          then:
            - if:
                condition:
                  lambda: return id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state;
                then:
                  - script.execute: act_boiler_arm_temp
                  - globals.set:
                      id: g_boiler_dc_pos
                      value: "1"
          else:
            - script.execute: act_boiler_heater
            - globals.set:
                id: g_boiler_dc_pos
                value: "0"

  # Three fixed tiers, not a continuous range -- see header. Clamped
  # at the ends, not wrapping (consistent with every other
  # encoder-adjustable value in this repo).
  - id: act_boiler_temp_up
    then:
      - lambda: |-
          float v = id(g_boiler_temp_pending);
          if (v < 60.0f) v = 60.0f;
          else v = 80.0f;
          id(g_boiler_temp_pending) = v;
      - script.execute: draw_boiler
      - script.execute: boiler_temp_write_debounced

  - id: act_boiler_temp_down
    then:
      - lambda: |-
          float v = id(g_boiler_temp_pending);
          if (v > 60.0f) v = 60.0f;
          else v = 40.0f;
          id(g_boiler_temp_pending) = v;
      - script.execute: draw_boiler
      - script.execute: boiler_temp_write_debounced

  # The actual write, split from the debounce delay so disarming can
  # call it immediately (act_boiler_arm_temp above).
  - id: boiler_temp_write_now
    then:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.womolin_controller_mqtt_truma_water
          data_template:
            temperature: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_boiler_temp_pending));"

  - id: boiler_temp_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: boiler_temp_write_now

  - id: draw_boiler
    mode: restart
    then:
      # ---- Main value: current water temperature -----------------------
      - lvgl.label.update:
          id: lbl_boiler_temp
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---°C");
            #endif
            if (!id(s_boiler_temp).has_state()) return std::string("---°C");
            return str_sprintf("%.0f°C", id(s_boiler_temp).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_boiler_temp).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xFFFFFF);

      # ---- Secondary line: target temperature --------------------------
      - lvgl.label.update:
          id: lbl_boiler_target
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("SOLL ---°C");
            #endif
            // Always the pending value, armed or not -- see header
            // re: lag (this is what stops SOLL jumping back to a
            // stale number right after disarming). Tag the two known
            // tiers (ECO/BOOST); the middle stays untagged until its
            // real name is confirmed -- don't guess it.
            if (!id(g_boiler_temp_known)) return std::string("SOLL ---°C");
            float v = id(g_boiler_temp_pending);
            std::string tag = (v <= 40.0f) ? " ECO" : (v >= 80.0f) ? " BOOST" : "";
            return str_sprintf("SOLL %.0f°C", v) + tag;
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(g_boiler_temp_known)) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Button: boiler on/off -----------------------------------
      # Optimistic (see header re: lag): trusts g_boiler_heater_optimistic
      # right after a tap, until s_boiler_heater_on's own on_state
      # clears _valid and hands authority back to the real state.
      - lvgl.label.update:
          id: lbl_boiler_heater
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("BOILER ---");
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? std::string("BOILER EIN") : std::string("BOILER AUS");
            }
            if (!id(s_boiler_heater_on).has_state()) return std::string("BOILER ---");
            return id(s_boiler_heater_on).state ? std::string("BOILER EIN")
                                         : std::string("BOILER AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0xBDC1C6);
            }
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x555555);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x2ECC71)
                                         : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_boiler_heater
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? lv_color_hex(0x1B5E3A) : lv_color_hex(0x202124);
            }
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x202124);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x1B5E3A)
                                         : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (id(g_boiler_heater_optimistic_valid)) {
              return id(g_boiler_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0x3C4043);
            }
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x3C4043);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x2ECC71)
                                         : lv_color_hex(0x3C4043);

      # ---- Row 2: SET, arms water temp (target 5) -----------------------
      # Interlock (see header): three visual states, not two -- locked
      # (BOILER not confirmed on) reads differently from idle-available
      # and from armed, otherwise the button looked identical whether
      # or not tapping it actually did anything.
      - lvgl.widget.update:
          id: btn_boiler_temp_set
          border_color: !lambda |-
            if (id(g_edit_target) == 5) return lv_color_hex(0x4A9EFF);
            if (!(id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state)) return lv_color_hex(0x2A2C2E);
            return lv_color_hex(0x3C4043);
      - lvgl.label.update:
          id: lbl_boiler_temp_set
          text_color: !lambda |-
            if (id(g_edit_target) == 5) return lv_color_hex(0xBDC1C6);
            if (!(id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state)) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Footer: edit-mode hint / interlock hint -----------------------
      - lvgl.label.update:
          id: lbl_boiler_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (id(g_edit_target) == 5) return std::string("DREHEN ZUM ÄNDERN");
            if (id(g_boiler_heater_optimistic_valid) && id(g_boiler_heater_optimistic) &&
                !(id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state))
              return std::string("BOILER STARTET");
            return std::string("");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            return lv_color_hex(0x4A9EFF);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_boiler

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_boiler
      on_load:
        - script.execute: poll_boiler
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_boiler_temp
            align: CENTER
            y: ${y_main}
            text: "---°C"
            text_font: font_40
            text_color: 0x555555

        - label:
            id: lbl_boiler_target
            align: CENTER
            y: ${y_line2}
            text: "SOLL ---°C"
            text_font: font_16
            text_color: 0x555555

        - button:
            id: btn_boiler_heater
            align: CENTER
            y: ${y_row}
            width: 104
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_boiler_heater
                  align: CENTER
                  text: "BOILER ---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_boiler_heater

        # ---- Row 2: SET, arms water temp (target 5) ----------------------
        - button:
            id: btn_boiler_temp_set
            align: CENTER
            y: ${y_row2}
            width: 68
            height: 26
            radius: 13
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_boiler_temp_set
                  align: CENTER
                  text: "SOLL"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_boiler_arm_temp

        - label:
            id: lbl_boiler_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: font_12
            text_color: 0x555555
