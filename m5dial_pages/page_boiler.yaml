# =====================================================================
#  m5dial_pages/page_boiler.yaml — page: Boiler (water heating)
#  FRAM M5Dial Cockpit · page package
#
#  The water-heating side of the same Truma Combi 4 as page_climate.yaml
#  — see that file's header for the integration background (real path
#  is the MQTT-based "womolin_controller" integration, not the
#  truma_inetbox guess this page originally assumed):
#    switch.womolin_controller_mqtt_activate_water_heater  on/off gate
#    climate.womolin_controller_mqtt_truma_water            the heater
#  Same caveat: the activate switch must be ON before the climate
#  entity carries live values, and every change (switch or target
#  temperature) has real lag -- ca. 2-4s, Truma's own LIN round trip,
#  not something to work around here.
#
#  Current/target water temperature come off the climate entity's own
#  current_temperature/temperature attributes, same as page_climate.yaml
#  — no separate sensor/number entity, and climate.set_temperature
#  instead of number.set_value.
#
#  OPEN ITEM: a shared fault flag existed on the old (wrong)
#  truma_inetbox assumption; dropped here rather than guessed again
#  under the real integration (design.md §15) — add it back once a
#  real error entity/attribute is confirmed.
#
#  Slots (design.md §3):
#    y_main   40°C              montserrat_40 — current water temp
#    y_line2  SOLL 60°C         montserrat_16 — target temp
#    y_row    one button        BOILER on/off (design.md §4: "BOILER
#                                AUS" is 10 characters, wider than any
#                                existing button label in this repo --
#                                check it actually fits the 104 px
#                                button on the real device, not just
#                                in the simulator)
#    y_row2   one button        SET, arms water temp for the encoder
#    y_footer status line       montserrat_12 — "turn to adjust" hint
#                                while armed
#
#  Water temp is encoder-adjustable (design.md §14, g_edit_target in
#  .m5dial_fram.yaml) via the SET button, same as page_climate.yaml's
#  room temp -- and the same guard: refuses to arm while BOILER is
#  off, since a target set while off doesn't take effect on the Truma.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_boiler_temp
    entity_id: climate.womolin_controller_mqtt_truma_water
    attribute: current_temperature
    on_value:
      - script.execute: draw_boiler
  - platform: homeassistant
    id: s_boiler_target
    entity_id: climate.womolin_controller_mqtt_truma_water
    attribute: temperature
    on_value:
      - script.execute: draw_boiler

binary_sensor:
  - platform: homeassistant
    id: s_boiler_heater_on
    entity_id: switch.womolin_controller_mqtt_activate_water_heater
    on_state:
      - script.execute: draw_boiler

script:
  - id: act_boiler_heater
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.womolin_controller_mqtt_activate_water_heater

  # Water temp (target 5), same guard as page_climate.yaml's target 3:
  # refuses to arm while BOILER is off, since a target set while off
  # doesn't take effect on the Truma.
  - id: act_boiler_arm_temp
    then:
      - if:
          condition:
            lambda: return id(s_boiler_heater_on).has_state() && id(s_boiler_heater_on).state;
          then:
            - globals.set:
                id: g_edit_target
                value: !lambda "return (id(g_edit_target) == 5) ? 0 : 5;"
      - script.execute: draw_boiler

  # 1°C step, clamped 30-70 (a guess at a sane range, not the Truma's
  # actual documented min/max -- verify on the device).
  - id: act_boiler_temp_up
    then:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.womolin_controller_mqtt_truma_water
          data_template:
            temperature: "{{ val }}"
          variables:
            val: !lambda |-
              float cur = id(s_boiler_target).has_state() ? id(s_boiler_target).state : 40.0f;
              float v = cur + 1.0f;
              if (v > 70.0f) v = 70.0f;
              return str_sprintf("%.0f", v);

  - id: act_boiler_temp_down
    then:
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.womolin_controller_mqtt_truma_water
          data_template:
            temperature: "{{ val }}"
          variables:
            val: !lambda |-
              float cur = id(s_boiler_target).has_state() ? id(s_boiler_target).state : 40.0f;
              float v = cur - 1.0f;
              if (v < 30.0f) v = 30.0f;
              return str_sprintf("%.0f", v);

  - id: draw_boiler
    mode: restart
    then:
      # ---- Main value: current water temperature -----------------------
      - lvgl.label.update:
          id: lbl_boiler_temp
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---°C");
            #endif
            if (!id(s_boiler_temp).has_state()) return std::string("---°C");
            return str_sprintf("%.0f°C", id(s_boiler_temp).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_boiler_temp).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xFFFFFF);

      # ---- Secondary line: target temperature --------------------------
      - lvgl.label.update:
          id: lbl_boiler_target
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("SOLL ---°C");
            #endif
            if (!id(s_boiler_target).has_state()) return std::string("SOLL ---°C");
            return str_sprintf("SOLL %.0f°C", id(s_boiler_target).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_boiler_target).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Button: boiler on/off -----------------------------------
      - lvgl.label.update:
          id: lbl_boiler_heater
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("BOILER ---");
            #endif
            if (!id(s_boiler_heater_on).has_state()) return std::string("BOILER ---");
            return id(s_boiler_heater_on).state ? std::string("BOILER EIN")
                                         : std::string("BOILER AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x555555);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x2ECC71)
                                         : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_boiler_heater
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x202124);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x1B5E3A)
                                         : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_boiler_heater_on).has_state()) return lv_color_hex(0x3C4043);
            return id(s_boiler_heater_on).state ? lv_color_hex(0x2ECC71)
                                         : lv_color_hex(0x3C4043);

      # ---- Row 2: SET, arms water temp (target 5) -----------------------
      - lvgl.widget.update:
          id: btn_boiler_temp_set
          border_color: !lambda |-
            if (id(g_edit_target) == 5) return lv_color_hex(0x4A9EFF);
            return lv_color_hex(0x3C4043);

      # ---- Footer: edit-mode hint ---------------------------------------
      - lvgl.label.update:
          id: lbl_boiler_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (id(g_edit_target) == 5) return std::string("DREHEN ZUM ÄNDERN");
            return std::string("");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            return lv_color_hex(0x4A9EFF);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_boiler

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_boiler
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_boiler_temp
            align: CENTER
            y: ${y_main}
            text: "---°C"
            text_font: font_40
            text_color: 0x555555

        - label:
            id: lbl_boiler_target
            align: CENTER
            y: ${y_line2}
            text: "SOLL ---°C"
            text_font: font_16
            text_color: 0x555555

        - button:
            id: btn_boiler_heater
            align: CENTER
            y: ${y_row}
            width: 104
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_boiler_heater
                  align: CENTER
                  text: "BOILER ---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_boiler_heater

        # ---- Row 2: SET, arms water temp (target 5) ----------------------
        - button:
            id: btn_boiler_temp_set
            align: CENTER
            y: ${y_row2}
            width: 68
            height: 26
            radius: 13
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "SET"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_boiler_arm_temp

        - label:
            id: lbl_boiler_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: font_12
            text_color: 0x555555
