# ===========================================================================
# FRAM M5Dial — Seite 1: Strom-Batterie
# Standalone-Konfiguration fuer den SDL2-Simulator (host-Plattform)
#
#   esphome run sim_01_strom.yaml
#
# Aufbau der Datei (Reihenfolge ist Absicht):
#   BLOCK A  Simulator-Gerüst    -> faellt beim Zusammenfuehren weg
#   BLOCK B  Datenquellen        -> wird gegen homeassistant-Sensoren getauscht
#   BLOCK C  Bindings            -> wandert 1:1 in die Zieldatei
#   BLOCK D  Seiten-Widgets      -> wandert 1:1 in die Zieldatei
# ===========================================================================

# ---------------------------------------------------------------------------
# LAYOUT-RASTER — auf allen Seiten identisch, damit beim Durchdrehen
# nichts springt. Diese vier Werte in *jeder* Seitendatei gleich halten.
#
#   oben          frei (reserviert)
#   y_main        Hauptwert, gross
#   y_line2       Nebenzeile, klein
#   y_row         Tasterreihe (1 oder 2 Taster)
#   y_footer      Statuszeile unten, in der Luecke des Bogens
# ---------------------------------------------------------------------------
substitutions:
  y_main: "-36"
  y_line2: "6"
  y_row: "44"
  y_footer: "-32"

# ---------------------------------------------------------------------------
# SCHRIFTEN — LVGL-intern (montserrat), keine Font-Datei noetig.
# Verfuegbar sind gerade Groessen von 8 bis 48.
#
# Falls spaeter doch eine eigene Groteske: font-Block anlegen und die drei
# Namen hier ersetzen. Die Nimbus-Variante sass vertikal schief im Taster.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# BLOCK A — Simulator-Gerüst
# ---------------------------------------------------------------------------
esphome:
  name: sim-01-strom

host:

logger:
  level: INFO

globals:
  # nur fuer die Simulation: haelt den Parkmodus-Zustand lokal
  - id: g_sim_park
    type: bool
    initial_value: "false"

display:
  - platform: sdl
    id: disp
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 240
      height: 240

touchscreen:
  - platform: sdl
    id: tsc
    display: disp

# ---------------------------------------------------------------------------
# BLOCK B — Datenquellen (SIMULATION)
#
# Auf dem Geraet werden diese drei Bloecke ersetzt durch:
#   - platform: homeassistant
#     entity_id: sensor.smartshunt_batterieladung
# Die IDs (s_soc, s_starter_v, s_parkmode) bleiben gleich, damit BLOCK C
# unveraendert uebernommen werden kann.
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    id: s_soc
    update_interval: 1500ms
    internal: true
    lambda: |-
      static float v = 100.0f;
      v -= 4.0f;
      if (v < 0.0f) v = 100.0f;
      return v;
    # ---- ab hier BLOCK C: identisch mit der Geraetedatei ----
    on_value:
      - lvgl.arc.update:
          id: arc_soc
          value: !lambda "return x;"
      - lvgl.arc.update:
          id: arc_soc
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_soc).has_state()) return lv_color_hex(0x555555);
              if (x < 20.0f) return lv_color_hex(0xE74C3C);
              if (x < 40.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x2ECC71);
      - lvgl.label.update:
          id: lbl_soc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_soc).has_state()) return std::string("---");
            return str_sprintf("%.0f%%", x);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_soc).has_state()) return lv_color_hex(0x555555);
            if (x < 20.0f) return lv_color_hex(0xE74C3C);
            if (x < 40.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

  - platform: template
    id: s_starter_v
    update_interval: 4s
    internal: true
    lambda: |-
      static const float vs[] = {12.8f, 12.5f, 12.2f, 11.8f};
      static int i = -1;
      i = (i + 1) % 4;
      return vs[i];
    on_value:
      - lvgl.label.update:
          id: lbl_starter_v
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("START ---V");
            #endif
            if (!id(s_starter_v).has_state()) return std::string("START ---V");
            return str_sprintf("START %.1fV", x);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_starter_v).has_state()) return lv_color_hex(0x555555);
            if (x < 12.0f) return lv_color_hex(0xE74C3C);
            if (x < 12.4f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0x707070);

  # DC-System: Spannung und Strom des Aufbau-Akkus (SmartShunt)
  #   Geraet: sensor.smartshunt_spannung / sensor.smartshunt_dc_bus_stromstarke
  - platform: template
    id: s_batt_v
    update_interval: 2s
    internal: true
    lambda: |-
      static const float vs[] = {13.4f, 13.2f, 12.9f, 12.6f, 14.2f};
      static int i = -1;
      i = (i + 1) % 5;
      return vs[i];
    on_value:
      - script.execute: draw_batt_dc

  - platform: template
    id: s_batt_a
    update_interval: 2s
    internal: true
    lambda: |-
      static const float as[] = {12.5f, -8.3f, 0.4f, -22.1f, 45.0f};
      static int i = -1;
      i = (i + 1) % 5;
      return as[i];
    on_value:
      - script.execute: draw_batt_dc

text_sensor:
  - platform: template
    id: s_parkmode
    update_interval: 1s
    internal: true
    lambda: |-
      return id(g_sim_park) ? std::string("on") : std::string("off");
    on_value:
      - lvgl.label.update:
          id: lbl_parkmode
          text: !lambda |-
            return (x == "on") ? std::string("PARK EIN")
                               : std::string("PARK AUS");
      - lvgl.widget.update:
          id: btn_parkmode
          bg_color: !lambda |-
            return lv_color_hex((x == "on") ? 0x1B5E3A : 0x202124);
          border_color: !lambda |-
            return lv_color_hex((x == "on") ? 0x2ECC71 : 0x3C4043);

# ---------------------------------------------------------------------------
# BLOCK C — Bindings
#
# Diese Trigger haengen in der Zieldatei an den homeassistant-Sensoren.
# Die Gueltigkeitspruefung ist mit #ifdef USE_API geklammert: im Simulator
# (kein api:) faellt sie weg, auf dem Geraet greift sie automatisch.
# ---------------------------------------------------------------------------
# Anmerkung zur Struktur: ESPHome erlaubt on_value nur direkt am Sensor,
# darum stehen die Trigger oben in BLOCK B mit drin. Beim Zusammenfuehren
# wandern sie mit dem jeweiligen Sensor mit.

script:
  - id: draw_batt_dc
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_batt_dc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---V   ---A");
            #endif
            if (!id(s_batt_v).has_state() || !id(s_batt_a).has_state())
              return std::string("---V   ---A");
            return str_sprintf("%.1fV   %+.1fA",
                               id(s_batt_v).state, id(s_batt_a).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_batt_v).has_state() || !id(s_batt_a).has_state())
              return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

# ---------------------------------------------------------------------------
# BLOCK D — Seite 1
# ---------------------------------------------------------------------------
lvgl:
  displays: [disp]
  touchscreens: [tsc]
  bg_color: 0x000000
  default_font: montserrat_16

  pages:
    - id: page_battery
      bg_color: 0x000000
      widgets:
        - arc:
            id: arc_soc
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x2ECC71
            knob:
              bg_opa: TRANSP

        # Kein Titel — der Bogen und die Prozentzahl sagen genug.
        # Der obere Slot bleibt frei (Reserve, z.B. Alarm-Icon).

        - label:
            id: lbl_soc
            align: CENTER
            y: ${y_main}
            text: "---"
            text_font: montserrat_40
            text_color: 0xFFFFFF

        # DC-System unter dem SOC — Spannung und Lade-/Entladestrom
        - label:
            id: lbl_batt_dc
            align: CENTER
            y: ${y_line2}
            text: "---V   ---A"
            text_font: montserrat_16
            text_color: 0xBDC1C6

        - button:
            id: btn_parkmode
            align: CENTER
            y: ${y_row}
            width: 104
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_parkmode
                  align: CENTER
                  text: "PARK ---"
                  text_font: montserrat_16
                  text_color: 0xE8EAED
            on_click:
              # SIM: schaltet nur den lokalen Global.
              # GERAET: hier stattdessen homeassistant.service switch.toggle
              - lambda: 'id(g_sim_park) = !id(g_sim_park);'

        - label:
            id: lbl_starter_v
            align: BOTTOM_MID
            y: ${y_footer}
            text: "START ---V"
            text_font: montserrat_12
            text_color: 0x707070
