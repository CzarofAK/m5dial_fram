# ===========================================================================
# FRAM M5Dial — page 1: Battery power
# Standalone configuration for the SDL2 simulator (host platform)
#
#   esphome run sim_01_strom.yaml
#
# File structure (order is deliberate):
#   BLOCK A  Simulator scaffold  -> dropped when merging
#   BLOCK B  Data sources        -> swapped for homeassistant sensors
#   BLOCK C  Bindings            -> carried over 1:1 into the target file
#   BLOCK D  Page widgets        -> carried over 1:1 into the target file
# ===========================================================================

# ---------------------------------------------------------------------------
# LAYOUT GRID — identical on all pages, so nothing jumps while paging
# through. Keep these four values the same in *every* page file. Matches
# the current design.md §3 substitutions.
#
#   top            free (reserved)
#   y_main         main value, large
#   y_line2        secondary line, small
#   y_row          button row (1 or 2 buttons)
#   y_footer       status line at the bottom, in the gap of the arc
# ---------------------------------------------------------------------------
substitutions:
  y_main: "-20"
  y_line2: "15"
  y_row: "48"
  y_footer: "-32"

# ---------------------------------------------------------------------------
# FONTS — LVGL-internal (montserrat), no font file needed.
# Only even sizes from 8 to 48 are available.
#
# If a custom grotesque is needed later: set up a font block and replace
# the three names here. The Nimbus variant sat vertically skewed in the
# button.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# BLOCK A — Simulator scaffold
# ---------------------------------------------------------------------------
esphome:
  name: sim-01-strom

host:

logger:
  level: INFO

globals:
  # simulation only: holds the park-mode state locally
  - id: g_sim_park
    type: bool
    initial_value: "false"

display:
  - platform: sdl
    id: disp
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 240
      height: 240

touchscreen:
  - platform: sdl
    id: tsc
    display: disp

# ---------------------------------------------------------------------------
# BLOCK B — Data sources (SIMULATION)
#
# On the device, these three blocks get replaced by:
#   - platform: homeassistant
#     entity_id: sensor.smartshunt_batterieladung
# The IDs (s_power_1_soc, s_power_1_starter_v, s_power_1_parkmode) stay the same, so BLOCK C can be
# carried over unchanged.
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    id: s_power_1_soc
    update_interval: 1500ms
    internal: true
    lambda: |-
      static float v = 100.0f;
      v -= 4.0f;
      if (v < 0.0f) v = 100.0f;
      return v;
    # ---- from here on BLOCK C: identical to the device file ----
    on_value:
      - lvgl.arc.update:
          id: arc_power_1_soc
          value: !lambda "return x;"
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_power_1_soc).has_state()) return lv_color_hex(0x555555);
              if (x < 20.0f) return lv_color_hex(0xE74C3C);
              if (x < 40.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x2ECC71);
      - lvgl.label.update:
          id: lbl_power_1_soc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_power_1_soc).has_state()) return std::string("---");
            return str_sprintf("%.0f%%", x);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_1_soc).has_state()) return lv_color_hex(0x555555);
            if (x < 20.0f) return lv_color_hex(0xE74C3C);
            if (x < 40.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

  - platform: template
    id: s_power_1_starter_v
    update_interval: 4s
    internal: true
    lambda: |-
      static const float vs[] = {12.8f, 12.5f, 12.2f, 11.8f};
      static int i = -1;
      i = (i + 1) % 4;
      return vs[i];
    on_value:
      - lvgl.label.update:
          id: lbl_power_1_starter_v
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("START ---V");
            #endif
            if (!id(s_power_1_starter_v).has_state()) return std::string("START ---V");
            return str_sprintf("START %.1fV", x);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_1_starter_v).has_state()) return lv_color_hex(0x555555);
            if (x < 12.0f) return lv_color_hex(0xE74C3C);
            if (x < 12.4f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0x707070);

  # DC system: voltage and current of the house battery (SmartShunt)
  #   Device: sensor.smartshunt_spannung / sensor.smartshunt_dc_bus_stromstarke
  - platform: template
    id: s_power_1_batt_v
    update_interval: 2s
    internal: true
    lambda: |-
      static const float vs[] = {13.4f, 13.2f, 12.9f, 12.6f, 14.2f};
      static int i = -1;
      i = (i + 1) % 5;
      return vs[i];
    on_value:
      - script.execute: draw_power_1_batt_dc

  - platform: template
    id: s_power_1_batt_a
    update_interval: 2s
    internal: true
    lambda: |-
      static const float as[] = {12.5f, -8.3f, 0.4f, -22.1f, 45.0f};
      static int i = -1;
      i = (i + 1) % 5;
      return as[i];
    on_value:
      - script.execute: draw_power_1_batt_dc

text_sensor:
  - platform: template
    id: s_power_1_parkmode
    update_interval: 1s
    internal: true
    lambda: |-
      return id(g_sim_park) ? std::string("on") : std::string("off");
    on_value:
      - lvgl.label.update:
          id: lbl_power_1_parkmode
          text: !lambda |-
            return (x == "on") ? std::string("PARK EIN")
                               : std::string("PARK AUS");
      - lvgl.widget.update:
          id: btn_power_1_parkmode
          bg_color: !lambda |-
            return lv_color_hex((x == "on") ? 0x1B5E3A : 0x202124);
          border_color: !lambda |-
            return lv_color_hex((x == "on") ? 0x2ECC71 : 0x3C4043);

# ---------------------------------------------------------------------------
# BLOCK C — Bindings
#
# In the target file, these triggers hang off the homeassistant sensors.
# The validity check is bracketed with #ifdef USE_API: in the simulator
# (no api:) it drops out, on the device it kicks in automatically.
# ---------------------------------------------------------------------------
# Note on structure: ESPHome only allows on_value directly on the sensor,
# so the triggers live up in BLOCK B alongside it. When merging, they move
# along with their respective sensor.

script:
  - id: draw_power_1_batt_dc
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_power_1_batt_dc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---V   ---A");
            #endif
            if (!id(s_power_1_batt_v).has_state() || !id(s_power_1_batt_a).has_state())
              return std::string("---V   ---A");
            return str_sprintf("%.1fV   %+.1fA",
                               id(s_power_1_batt_v).state, id(s_power_1_batt_a).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_1_batt_v).has_state() || !id(s_power_1_batt_a).has_state())
              return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

# ---------------------------------------------------------------------------
# BLOCK D — page 1
# ---------------------------------------------------------------------------
lvgl:
  displays: [disp]
  touchscreens: [tsc]
  bg_color: 0x000000
  default_font: montserrat_16

  pages:
    - id: page_power_1
      bg_color: 0x000000
      widgets:
        - arc:
            id: arc_power_1_soc
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x2ECC71
            knob:
              bg_opa: TRANSP

        # No title — the arc and the percentage say enough.
        # The top slot stays free (reserve, e.g. an alarm icon).

        - label:
            id: lbl_power_1_soc
            align: CENTER
            y: ${y_main}
            text: "---"
            text_font: montserrat_40
            text_color: 0xFFFFFF

        # DC system below the SOC — voltage and charge/discharge current
        - label:
            id: lbl_power_1_batt_dc
            align: CENTER
            y: ${y_line2}
            text: "---V   ---A"
            text_font: montserrat_16
            text_color: 0xBDC1C6

        - button:
            id: btn_power_1_parkmode
            align: CENTER
            y: ${y_row}
            width: 104
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_power_1_parkmode
                  align: CENTER
                  text: "PARK ---"
                  text_font: montserrat_16
                  text_color: 0xE8EAED
            on_click:
              # SIM: only toggles the local global.
              # DEVICE: homeassistant.service switch.toggle here instead
              - lambda: 'id(g_sim_park) = !id(g_sim_park);'

        - label:
            id: lbl_power_1_starter_v
            align: BOTTOM_MID
            y: ${y_footer}
            text: "START ---V"
            text_font: montserrat_12
            text_color: 0x707070
