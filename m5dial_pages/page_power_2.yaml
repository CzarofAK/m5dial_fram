# =====================================================================
#  m5dial_pages/page_power_2.yaml — page: Power / Grid (input, PowerAssist)
#  FRAM M5Dial Cockpit · page package
#
#  Single-arc layout (rebuilt, readability follow-up on the original
#  double-ring version): EINGANG is the page's one real telemetry
#  value and gets the same treatment as page_power_1's SOC -- single
#  arc, capped with a title, big value underneath. PowerAssist is a
#  setting, not a reading, and only needs a small footprint: one
#  button at y_row carries both its value and the SET/arm action, no
#  separate label or second ring. Same shape as page_power_3.yaml
#  (arc + main value + line2 + one button row + footer), just applied
#  to grid input instead of WR load.
#
#  arc          224 x 224   EINGANG %  -- current draw as % of the
#                                          PowerAssist limit (same
#                                          calculation this page
#                                          always used)
#  y_cap        "EINGANG"   title, since a bare Watt number doesn't
#                            say what it is (design.md §3's "no page
#                            title" rule is about naming the whole
#                            page -- page_entrance's "STUFE" is the
#                            same kind of per-value caption already)
#  y_main       "850W"      the reading itself
#  y_line2      "12.3A"     context for the Watt figure, same role as
#                            page_power_1's "13.4V -12A" line
#  y_row        one button  "ASSIST 8.0A" -- value in the button
#                            (number.multiplus_strombegrenzung),
#                            tapping arms/disarms encoder edit mode
#                            (design.md §14, g_edit_target target 6).
#                            Double-clicking the physical front button
#                            on this page does the same
#                            (.m5dial_fram.yaml's double-click handler
#                            -- home is long-press-only here now).
#  y_footer     status line
#
#  PowerAssist step is 1A now, not 0.1A: 0.1A steps made the encoder
#  feel laggy in practice (many detents needed to move anything, each
#  one its own number.set_value call). 1A moves the needle in far
#  fewer turns. Clamped 0-16A -- still this installation's real
#  ceiling on 2.5mm² wiring, not the entity's own 0-63A range.
#
#  CAVEAT: the button shows the setpoint (number.multiplus_strombegrenzung),
#  not a separately confirmed "applied" value -- there's no other
#  entity for that. The MultiPlus's own shore-current limiter can take
#  a moment to actually settle on VE.Bus, so the real, currently-active
#  limit can differ briefly from what's shown here. Nothing to fix
#  without a second entity that reports the applied value; noted so
#  it isn't mistaken for a live readback.
#
#  No "must be on" gate here, unlike climate/boiler -- PowerAssist has
#  nothing to be off.
#
#  Encoder feel (readability follow-up, separate from the 0.1A->1A
#  step change above): every tick used to call number.set_value and
#  then wait for HA to confirm the new number.multiplus_strombegrenzung
#  state before the button's label moved at all -- fast turning felt
#  laggy because the display was always one HA round trip behind the
#  knob. Now the encoder adjusts a local g_power_2_assist_pending
#  value directly and redraws immediately from THAT while armed (zero
#  perceived lag, all local), and only fires the actual
#  number.set_value once the encoder's been quiet for
#  ASSIST_DEBOUNCE_MS (act_power_2_assist_up/_down restart a debounce
#  script on every tick) -- so a fast spin sends one HA call at the
#  end, not one per detent. Disarming (SET tapped again) flushes
#  immediately instead of waiting out the debounce, since no more
#  ticks are coming. 400ms is a guess, not measured against how fast
#  someone actually turns this thing -- adjust if it still feels
#  laggy, or feels like it fires mid-turn.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_power_2_w
    entity_id: sensor.multiplus_eingangsleistung_l1
    on_value:
      - script.execute: draw_power_2
  - platform: homeassistant
    id: s_power_2_a
    entity_id: sensor.multiplus_eingangsstromstarke_l1
    on_value:
      - script.execute: draw_power_2
  - platform: homeassistant
    id: s_power_2_limit
    entity_id: number.multiplus_strombegrenzung
    on_value:
      - script.execute: draw_power_2

globals:
  # Page-local (design.md §3's "On/off-only pages" precedent for
  # page-local globals applies here too): the value being dialed while
  # armed, ahead of what HA's confirmed back yet. See header re: lag.
  - id: g_power_2_assist_pending
    type: float
    restore_value: false
    initial_value: "0"

script:
  - id: act_power_2_arm_assist
    then:
      - lambda: |-
          bool was_armed = (id(g_edit_target) == 6);
          id(g_edit_target) = was_armed ? 0 : 6;
          if (!was_armed) {
            // Just armed: seed pending from the last confirmed value.
            id(g_power_2_assist_pending) = id(s_power_2_limit).has_state() ? id(s_power_2_limit).state : 0.0f;
          } else {
            // Just disarmed: flush immediately, don't wait for the
            // debounce -- no more ticks are coming.
            id(power_2_assist_write_debounced)->stop();
            id(power_2_assist_write_now)->execute();
          }
      - script.execute: draw_power_2

  # 1A step, clamped 0-16 -- this installation's real ceiling (2.5mm²
  # wiring), not the entity's own 0-63A range. See header re: the 0.1A
  # -> 1A change and the debounced-write change (both about lag).
  - id: act_power_2_assist_up
    then:
      - lambda: |-
          float v = id(g_power_2_assist_pending) + 1.0f;
          if (v > 16.0f) v = 16.0f;
          id(g_power_2_assist_pending) = v;
      - script.execute: draw_power_2
      - script.execute: power_2_assist_write_debounced

  - id: act_power_2_assist_down
    then:
      - lambda: |-
          float v = id(g_power_2_assist_pending) - 1.0f;
          if (v < 0.0f) v = 0.0f;
          id(g_power_2_assist_pending) = v;
      - script.execute: draw_power_2
      - script.execute: power_2_assist_write_debounced

  # The actual write, split from the debounce delay so disarming can
  # call it immediately (see act_power_2_arm_assist above) instead of
  # duplicating the homeassistant.service call in two places.
  - id: power_2_assist_write_now
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.multiplus_strombegrenzung
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_power_2_assist_pending));"

  - id: power_2_assist_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: power_2_assist_write_now

  - id: draw_power_2
    mode: restart
    then:
      # ---- Arc: EINGANG, % of the PowerAssist limit -------------------
      - lvgl.arc.update:
          id: arc_power_2_in
          value: !lambda |-
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return 0.0f;
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return 0.0f;
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p > 100.0f) p = 100.0f;
            if (p < 0.0f) p = 0.0f;
            return p;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
                return lv_color_hex(0x555555);
              float lim = id(s_power_2_limit).state;
              if (lim <= 0.0f) return lv_color_hex(0x555555);
              float p = id(s_power_2_a).state / lim * 100.0f;
              if (p >= 95.0f) return lv_color_hex(0xE74C3C);
              if (p >= 80.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x4A9EFF);

      # ---- Main value: EINGANG -------------------------------------
      - lvgl.label.update:
          id: lbl_power_2_w
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---W");
            #endif
            if (!id(s_power_2_w).has_state()) return std::string("---W");
            return str_sprintf("%.0fW", id(s_power_2_w).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_2_w).has_state()) return lv_color_hex(0x555555);
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return lv_color_hex(0xFFFFFF);
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return lv_color_hex(0xFFFFFF);
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p >= 95.0f) return lv_color_hex(0xE74C3C);
            if (p >= 80.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- Line 2: input current, context for the Watt figure ---------
      - lvgl.label.update:
          id: lbl_power_2_a
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---A");
            #endif
            if (!id(s_power_2_a).has_state()) return std::string("---A");
            return str_sprintf("%.1fA", id(s_power_2_a).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_2_a).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Button: ASSIST, value in the button, also its own SET -----
      - lvgl.label.update:
          id: lbl_power_2_assist
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("ASSIST --A");
            #endif
            // Armed: show the pending (locally-dialed) value, not the
            // HA-confirmed one -- see header re: lag.
            if (id(g_edit_target) == 6) return str_sprintf("ASSIST %.0fA", id(g_power_2_assist_pending));
            if (!id(s_power_2_limit).has_state()) return std::string("ASSIST --A");
            return str_sprintf("ASSIST %.0fA", id(s_power_2_limit).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_2_limit).has_state()) return lv_color_hex(0x555555);
            if (id(g_edit_target) == 6) return lv_color_hex(0x4A9EFF);
            return lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_power_2_assist
          border_color: !lambda |-
            if (id(g_edit_target) == 6) return lv_color_hex(0x4A9EFF);
            return lv_color_hex(0x3C4043);

      # ---- Footer: high-load hint, or the edit-mode hint ----------------
      - lvgl.label.update:
          id: lbl_power_2_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (id(g_edit_target) == 6) return std::string("DREHEN ZUM ÄNDERN");
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return std::string("");
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return std::string("");
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p >= 95.0f) return std::string("NETZ AM LIMIT");
            if (p >= 80.0f) return std::string("NETZ HOCH");
            return std::string("");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (id(g_edit_target) == 6) return lv_color_hex(0x4A9EFF);
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return lv_color_hex(0x555555);
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return lv_color_hex(0x555555);
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p >= 95.0f) return lv_color_hex(0xE74C3C);
            return lv_color_hex(0xF39C12);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_power_2

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_power_2
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - arc:
            id: arc_power_2_in
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        - label:
            id: lbl_power_2_cap
            align: CENTER
            y: ${y_cap}
            text: "EINGANG"
            text_font: font_12
            text_color: 0x555555

        - label:
            id: lbl_power_2_w
            align: CENTER
            y: ${y_main}
            text: "---W"
            text_font: font_40
            text_color: 0x555555

        - label:
            id: lbl_power_2_a
            align: CENTER
            y: ${y_line2}
            text: "---A"
            text_font: font_16
            text_color: 0x555555

        - button:
            id: btn_power_2_assist
            align: CENTER
            y: ${y_row}
            width: 140
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_power_2_assist
                  align: CENTER
                  text: "ASSIST --A"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_power_2_arm_assist

        - label:
            id: lbl_power_2_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: font_12
            text_color: 0x555555
