# =====================================================================
#  m5dial_pages/page_power_2.yaml — page: Power / Grid (input, PowerAssist)
#  FRAM M5Dial Cockpit · page package
#
#  Split from what used to be here (which covered WR load and mode
#  too) once that got too full. This half: grid input power, and the
#  PowerAssist current limit. The other half moved to
#  page_power_3.yaml.
#
#  Double ring (design.md §4), same geometry as page_gas.yaml:
#    outer 224 x 224   EINGANG      -- input power, read-only
#    inner 200 x 200   ASSIST       -- PowerAssist limit, adjustable
#
#  Both arcs are percentages (design.md §8), not the raw values:
#    EINGANG = current draw as % of the PowerAssist limit (same
#      calculation this page always used for its one arc).
#    ASSIST  = the limit itself as % of 16A -- not the entity's own
#      0-63A range, but this installation's real ceiling (2.5mm² wiring).
#
#  PowerAssist (number.multiplus_strombegrenzung) is encoder-adjustable
#  (design.md §14, g_edit_target target 6) via the SET button under its
#  column: 0.1A steps, clamped 0-16A. Always armable -- unlike
#  climate/boiler, there's no "must be on first" gate here.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_power_2_w
    entity_id: sensor.multiplus_eingangsleistung_l1
    on_value:
      - script.execute: draw_power_2
  - platform: homeassistant
    id: s_power_2_a
    entity_id: sensor.multiplus_eingangsstromstarke_l1
    on_value:
      - script.execute: draw_power_2
  - platform: homeassistant
    id: s_power_2_limit
    entity_id: number.multiplus_strombegrenzung
    on_value:
      - script.execute: draw_power_2

script:
  - id: act_power_2_arm_assist
    then:
      - globals.set:
          id: g_edit_target
          value: !lambda "return (id(g_edit_target) == 6) ? 0 : 6;"
      - script.execute: draw_power_2

  # 0.1A step, clamped 0-16 -- this installation's real ceiling (2.5mm²
  # wiring), not the entity's own 0-63A range.
  - id: act_power_2_assist_up
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.multiplus_strombegrenzung
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda |-
              float cur = id(s_power_2_limit).has_state() ? id(s_power_2_limit).state : 0.0f;
              float v = cur + 0.1f;
              if (v > 16.0f) v = 16.0f;
              return str_sprintf("%.1f", v);

  - id: act_power_2_assist_down
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.multiplus_strombegrenzung
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda |-
              float cur = id(s_power_2_limit).has_state() ? id(s_power_2_limit).state : 0.0f;
              float v = cur - 0.1f;
              if (v < 0.0f) v = 0.0f;
              return str_sprintf("%.1f", v);

  - id: draw_power_2
    mode: restart
    then:
      # ---- Outer ring: EINGANG, % of the PowerAssist limit ------------
      - lvgl.arc.update:
          id: arc_power_2_in
          value: !lambda |-
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return 0.0f;
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return 0.0f;
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p > 100.0f) p = 100.0f;
            if (p < 0.0f) p = 0.0f;
            return p;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
                return lv_color_hex(0x555555);
              float lim = id(s_power_2_limit).state;
              if (lim <= 0.0f) return lv_color_hex(0x555555);
              float p = id(s_power_2_a).state / lim * 100.0f;
              if (p >= 95.0f) return lv_color_hex(0xE74C3C);
              if (p >= 80.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x4A9EFF);

      # ---- Inner ring: ASSIST, % of the 16A cable ceiling --------------
      - lvgl.arc.update:
          id: arc_power_2_assist
          value: !lambda |-
            if (!id(s_power_2_limit).has_state()) return 0.0f;
            float p = id(s_power_2_limit).state / 16.0f * 100.0f;
            if (p > 100.0f) p = 100.0f;
            if (p < 0.0f) p = 0.0f;
            return p;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_power_2_limit).has_state()) return lv_color_hex(0x555555);
              return lv_color_hex(0x9AA0A6);

      # ---- Outer column: EINGANG ----------------------------------------
      - lvgl.label.update:
          id: lbl_power_2_w
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---W");
            #endif
            if (!id(s_power_2_w).has_state()) return std::string("---W");
            return str_sprintf("%.0fW", id(s_power_2_w).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_2_w).has_state()) return lv_color_hex(0x555555);
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return lv_color_hex(0xFFFFFF);
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return lv_color_hex(0xFFFFFF);
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p >= 95.0f) return lv_color_hex(0xE74C3C);
            if (p >= 80.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- Inner column: ASSIST -----------------------------------------
      - lvgl.label.update:
          id: lbl_power_2_limit
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("--A");
            #endif
            if (!id(s_power_2_limit).has_state()) return std::string("--A");
            return str_sprintf("%.1fA", id(s_power_2_limit).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_2_limit).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_power_2_assist_set
          border_color: !lambda |-
            if (id(g_edit_target) == 6) return lv_color_hex(0x4A9EFF);
            return lv_color_hex(0x3C4043);

      # ---- Footer: high-load hint, or the edit-mode hint ----------------
      - lvgl.label.update:
          id: lbl_power_2_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (id(g_edit_target) == 6) return std::string("DREHEN ZUM ÄNDERN");
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return std::string("");
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return std::string("");
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p >= 95.0f) return std::string("NETZ AM LIMIT");
            if (p >= 80.0f) return std::string("NETZ HOCH");
            return std::string("");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (id(g_edit_target) == 6) return lv_color_hex(0x4A9EFF);
            if (!id(s_power_2_a).has_state() || !id(s_power_2_limit).has_state())
              return lv_color_hex(0x555555);
            float lim = id(s_power_2_limit).state;
            if (lim <= 0.0f) return lv_color_hex(0x555555);
            float p = id(s_power_2_a).state / lim * 100.0f;
            if (p >= 95.0f) return lv_color_hex(0xE74C3C);
            return lv_color_hex(0xF39C12);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_power_2

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_power_2
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - arc:
            id: arc_power_2_in
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        - arc:
            id: arc_power_2_assist
            align: CENTER
            width: 200
            height: 200
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x9AA0A6
            knob:
              bg_opa: TRANSP

        # ---- Outer column: EINGANG ----------------------------------
        - label:
            id: lbl_power_2_cap_w
            align: CENTER
            x: -${x_col}
            y: ${y_cap}
            text: "EINGANG"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_power_2_w
            align: CENTER
            x: -${x_col}
            y: ${y_main}
            text: "---W"
            text_font: font_16
            text_color: 0x555555

        # ---- Inner column: ASSIST ------------------------------------
        - label:
            id: lbl_power_2_cap_assist
            align: CENTER
            x: ${x_col}
            y: ${y_cap}
            text: "ASSIST"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_power_2_limit
            align: CENTER
            x: ${x_col}
            y: ${y_main}
            text: "--A"
            text_font: font_16
            text_color: 0x555555
        - button:
            id: btn_power_2_assist_set
            align: CENTER
            x: ${x_col}
            y: ${y_row}
            width: 68
            height: 26
            radius: 13
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "SET"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_power_2_arm_assist

        - label:
            id: lbl_power_2_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: font_12
            text_color: 0x555555
