# ===========================================================================
# FRAM M5Dial — page 2: Grid power
# Standalone configuration for the SDL2 simulator (host platform)
#
#   esphome run sim_02_netz.yaml
#
#   BLOCK A  Simulator scaffold  -> dropped when merging
#   BLOCK B  Data sources        -> swapped for homeassistant sensors
#   BLOCK C  Bindings            -> carried over 1:1 into the target file
#   BLOCK D  Page widgets        -> carried over 1:1 into the target file
#
# Difference from page 1: the displays depend on several values (input
# power, current limit, mode). That's why a script, draw_grid, draws the
# whole page, and each sensor just calls it.
#
# Layout: main value input power, secondary line MP state, button row
# mode | current limit. The footer (y_footer) stays free here.
# ===========================================================================

# ---------------------------------------------------------------------------
# LAYOUT GRID — identical on all pages, so nothing jumps while paging
# through. Keep these four values the same in *every* page file.
#
#   top            free (reserved)
#   y_main         main value, large
#   y_line2        secondary line, small
#   y_row          button row (1 or 2 buttons)
#   y_footer       status line at the bottom, in the gap of the arc
# ---------------------------------------------------------------------------
substitutions:
  y_main: "-36"
  y_line2: "6"
  y_row: "44"
  y_footer: "-32"

# ---------------------------------------------------------------------------
# FONTS — LVGL-internal (montserrat), no font file needed.
# Only even sizes from 8 to 48 are available.
#
# If a custom grotesque is needed later: set up a font block and replace
# the three names here. The Nimbus variant sat vertically skewed in the
# button.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# BLOCK A — Simulator scaffold
# ---------------------------------------------------------------------------
esphome:
  name: sim-02-netz

host:

logger:
  level: INFO

globals:
  # simulation only: hold mode and current limit locally
  - id: g_sim_limit
    type: float
    initial_value: "10.0f"
  - id: g_sim_mode
    type: int
    initial_value: "0"      # 0=on 1=charger_only 2=inverter_only 3=off

display:
  - platform: sdl
    id: disp
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 240
      height: 240

touchscreen:
  - platform: sdl
    id: tsc
    display: disp

# ---------------------------------------------------------------------------
# BLOCK B — Data sources (SIMULATION)
#
# On the device:
#   s_grid_w     -> sensor.multiplus_0_leitung_1_eingangsleistung
#   s_mp_limit   -> number.multiplus_eingangsstrombegrenzung   # <-- adjust
#   s_mp_state   -> sensor.multiplus_zustand
#   s_mp_mode    -> select.multiplus_modus                     # <-- adjust
# IDs stay the same, so BLOCK C can be carried over unchanged.
# ---------------------------------------------------------------------------
sensor:
  - platform: template
    id: s_grid_w
    update_interval: 1500ms
    internal: true
    lambda: |-
      static float w = 0.0f;
      w += 180.0f;
      if (w > 3800.0f) w = 0.0f;
      return w;
    on_value:
      - script.execute: draw_grid

  - platform: template
    id: s_mp_limit
    update_interval: 1s
    internal: true
    lambda: |-
      return id(g_sim_limit);
    on_value:
      - script.execute: draw_grid

text_sensor:
  - platform: template
    id: s_mp_state
    update_interval: 5s
    internal: true
    lambda: |-
      static const char *st[] = {"bulk", "absorption", "float",
                                 "inverting", "fault"};
      static int i = -1;
      i = (i + 1) % 5;
      return std::string(st[i]);
    on_value:
      - script.execute: draw_grid

  - platform: template
    id: s_mp_mode
    update_interval: 1s
    internal: true
    lambda: |-
      static const char *md[] = {"on", "charger_only", "inverter_only", "off"};
      return std::string(md[id(g_sim_mode) & 3]);
    on_value:
      - script.execute: draw_grid

# ---------------------------------------------------------------------------
# BLOCK C — Bindings
# ---------------------------------------------------------------------------
script:
  - id: draw_grid
    mode: restart
    then:
      # ---- Shore-power connection load, in % of the limit ------------------
      - lvgl.arc.update:
          id: arc_grid
          value: !lambda |-
            if (!id(s_grid_w).has_state() || !id(s_mp_limit).has_state())
              return 0;
            float lim = id(s_mp_limit).state;
            if (lim <= 0.0f) return 0;
            float pct = (id(s_grid_w).state / 230.0f) / lim * 100.0f;
            if (pct > 100.0f) pct = 100.0f;
            if (pct < 0.0f) pct = 0.0f;
            return (int) pct;
      - lvgl.arc.update:
          id: arc_grid
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_grid_w).has_state() || !id(s_mp_limit).has_state())
                return lv_color_hex(0x555555);
              float lim = id(s_mp_limit).state;
              if (lim <= 0.0f) return lv_color_hex(0x555555);
              float pct = (id(s_grid_w).state / 230.0f) / lim * 100.0f;
              if (pct >= 95.0f) return lv_color_hex(0xE74C3C);
              if (pct >= 80.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x4A9EFF);

      # ---- Input power ----------------------------------------------------
      - lvgl.label.update:
          id: lbl_grid_w
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_grid_w).has_state()) return std::string("---");
            return str_sprintf("%.0f W", id(s_grid_w).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_grid_w).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xFFFFFF);

      # ---- MP state ------------------------------------------------------
      - lvgl.label.update:
          id: lbl_mp_state
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_mp_state).has_state()) return std::string("---");
            std::string s = id(s_mp_state).state;
            for (auto &c : s) c = toupper(c);
            return s;
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_mp_state).has_state()) return lv_color_hex(0x555555);
            if (id(s_mp_state).state == "fault") return lv_color_hex(0xE74C3C);
            return lv_color_hex(0xBDC1C6);

      # ---- Current limit: button label ---------------------------------
      - lvgl.label.update:
          id: lbl_mp_limit
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("--- A");
            #endif
            if (!id(s_mp_limit).has_state()) return std::string("--- A");
            return str_sprintf("%.0f A", id(s_mp_limit).state);

      # ---- Mode: button label and color ---------------------------------
      - lvgl.label.update:
          id: lbl_mp_mode
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_mp_mode).has_state()) return std::string("---");
            std::string m = id(s_mp_mode).state;
            if (m == "on")             return std::string("ON");
            if (m == "charger_only")   return std::string("CHG");
            if (m == "inverter_only")  return std::string("INV");
            if (m == "off")            return std::string("OFF");
            return std::string("?");
      - lvgl.widget.update:
          id: btn_mp_mode
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            std::string m = id(s_mp_mode).state;
            if (m == "on")            return lv_color_hex(0x1B5E3A);
            if (m == "charger_only")  return lv_color_hex(0x14324F);
            if (m == "inverter_only") return lv_color_hex(0x4F3814);
            return lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            std::string m = id(s_mp_mode).state;
            if (m == "on")            return lv_color_hex(0x2ECC71);
            if (m == "charger_only")  return lv_color_hex(0x4A9EFF);
            if (m == "inverter_only") return lv_color_hex(0xF39C12);
            return lv_color_hex(0x3C4043);

# ---------------------------------------------------------------------------
# BLOCK D — page 2
# ---------------------------------------------------------------------------
lvgl:
  displays: [disp]
  touchscreens: [tsc]
  bg_color: 0x000000
  default_font: montserrat_16

  pages:
    - id: page_grid
      bg_color: 0x000000
      widgets:
        - arc:
            id: arc_grid
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x4A9EFF
            knob:
              bg_opa: TRANSP

        # No title — the top slot stays free, same as on page 1.

        - label:
            id: lbl_grid_w
            align: CENTER
            y: ${y_main}
            text: "---"
            text_font: montserrat_40
            text_color: 0xFFFFFF


        # Two buttons side by side: left mode, right current limit
        - button:
            id: btn_mp_mode
            align: CENTER
            x: -40
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_mp_mode
                  align: CENTER
                  text: "---"
                  text_font: montserrat_16
                  text_color: 0xE8EAED
            on_click:
              # SIM: cycles ON -> CHG -> INV -> OFF -> ON.
              # DEVICE: instead
              #   - homeassistant.service:
              #       service: select.select_option
              #       data:
              #         entity_id: select.multiplus_modus
              #       data_template:
              #         option: !lambda 'return naechster_modus;'
              - lambda: |-
                  id(g_sim_mode) = (id(g_sim_mode) + 1) % 4;

        - button:
            id: btn_mp_limit
            align: CENTER
            x: 40
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_mp_limit
                  align: CENTER
                  text: "--- A"
                  text_font: montserrat_16
                  text_color: 0xE8EAED
            on_click:
              # SIM: cycles 4 -> 6 -> 8 -> 10 -> 13 -> 16 -> 4 A.
              # DEVICE: instead
              #   - homeassistant.service:
              #       service: number.set_value
              #       data:
              #         entity_id: number.multiplus_eingangsstrombegrenzung
              #       data_template:
              #         value: !lambda 'return str_sprintf("%.0f", naechster_wert);'
              - lambda: |-
                  static const float steps[] = {4, 6, 8, 10, 13, 16};
                  float v = id(g_sim_limit);
                  int idx = 0;
                  for (int i = 0; i < 6; i++)
                    if (v >= steps[i] - 0.5f) idx = i;
                  id(g_sim_limit) = steps[(idx + 1) % 6];

        # Secondary line, same slot as the DC values on page 1
        - label:
            id: lbl_mp_state
            align: CENTER
            y: ${y_line2}
            text: "---"
            text_font: montserrat_16
            text_color: 0xBDC1C6
