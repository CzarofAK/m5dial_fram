# =====================================================================
#  m5dial_pages/page_levelling.yaml — page: Levelling (spirit level)
#  FRAM M5Dial Cockpit · page package
#
#  Real entities: an MPU6050 tilt sensor (external hardware, own
#  ESPHome device "mpu6050"). LÄNGS (front/back) = its Pitch sensor,
#  QUER (left/right) = its Roll sensor -- matches that device's own
#  sign convention (pitch: front down = +, roll: right down = +).
#
#  Bubble level, not just numbers (readability follow-up): three
#  static rings as a target, a bubble that moves off-center with tilt
#  -- the physical spirit-level metaphor, not the insect. LÄNGS/QUER
#  stay as compact numeric readouts above/below the rings, since the
#  bubble alone doesn't say "how many degrees."
#
#  Bubble travel: R_MAX = 85px maps to DEG_MAX = 4° (the alarm
#  threshold) on each axis independently, clamped beyond that so it
#  can't leave the outer ring. Direction convention -- UNVERIFIED,
#  there's no established "which way is screen-up vs. vehicle-front"
#  for this page yet: a real bubble floats toward the HIGH side, so
#  QUER positive (right-down) moves it left, LÄNGS positive
#  (front-down) moves it toward the back (down on screen, assuming the
#  dial's "up" faces the front). If that reads backwards on the actual
#  device, flip the sign in draw_levelling's ox/oy lambdas -- one line
#  each, not a redesign.
#
#  No arc: a tilt angle isn't a 0-100% quantity (design.md §8), and
#  the rings aren't arcs either -- full circles via LVGL's
#  radius = width/2 trick, not the gas/water double-ring pattern.
#
#  Thresholds (< 2° ok, 2-4° warning, >= 4° alarm) are a GUESS, not
#  measured against a real leveling requirement (fridge compressor
#  tolerance etc.) — confirm and adjust.
#
#  No button: reading only, nothing to act on from the dial.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_levelling_lon
    entity_id: sensor.mpu6050_pitch
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_lat
    entity_id: sensor.mpu6050_roll
    on_value:
      - script.execute: draw_levelling

script:
  - id: draw_levelling
    mode: restart
    then:
      # ---- Bubble position: clamped to the outer ring ------------------
      - lvgl.widget.update:
          id: obj_levelling_bubble
          x: !lambda |-
            if (!id(s_levelling_lat).has_state()) return 0;
            const float R_MAX = 85.0f, DEG_MAX = 4.0f;
            float ox = -(id(s_levelling_lat).state / DEG_MAX) * R_MAX;
            if (ox > R_MAX) ox = R_MAX;
            if (ox < -R_MAX) ox = -R_MAX;
            return (int) ox;
          y: !lambda |-
            if (!id(s_levelling_lon).has_state()) return 0;
            const float R_MAX = 85.0f, DEG_MAX = 4.0f;
            float oy = (id(s_levelling_lon).state / DEG_MAX) * R_MAX;
            if (oy > R_MAX) oy = R_MAX;
            if (oy < -R_MAX) oy = -R_MAX;
            return (int) oy;
          bg_color: !lambda |-
            if (!id(s_levelling_lon).has_state() || !id(s_levelling_lat).has_state())
              return lv_color_hex(0x555555);
            float lon = fabsf(id(s_levelling_lon).state);
            float lat = fabsf(id(s_levelling_lat).state);
            float v = lon > lat ? lon : lat;
            if (v >= 4.0f) return lv_color_hex(0xE74C3C);
            if (v >= 2.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- LÄNGS (front/back tilt) ------------------------------------
      - lvgl.label.update:
          id: lbl_levelling_lon
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("LÄNGS ---°");
            #endif
            if (!id(s_levelling_lon).has_state()) return std::string("LÄNGS ---°");
            return str_sprintf("LÄNGS %+.1f°", id(s_levelling_lon).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_levelling_lon).has_state()) return lv_color_hex(0x555555);
            float v = fabsf(id(s_levelling_lon).state);
            if (v >= 4.0f) return lv_color_hex(0xE74C3C);
            if (v >= 2.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xBDC1C6);

      # ---- QUER (left/right tilt) --------------------------------------
      - lvgl.label.update:
          id: lbl_levelling_lat
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("QUER ---°");
            #endif
            if (!id(s_levelling_lat).has_state()) return std::string("QUER ---°");
            return str_sprintf("QUER %+.1f°", id(s_levelling_lat).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_levelling_lat).has_state()) return lv_color_hex(0x555555);
            float v = fabsf(id(s_levelling_lat).state);
            if (v >= 4.0f) return lv_color_hex(0xE74C3C);
            if (v >= 2.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xBDC1C6);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_levelling

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_levelling
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # ---- Bubble level: static target rings --------------------------
        - obj:
            align: CENTER
            width: 200
            height: 200
            radius: 100
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x2A2D30
        - obj:
            align: CENTER
            width: 140
            height: 140
            radius: 70
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x2A2D30
        - obj:
            align: CENTER
            width: 80
            height: 80
            radius: 40
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x2ECC71

        # ---- Bubble level: the bubble itself ------------------------------
        - obj:
            id: obj_levelling_bubble
            align: CENTER
            width: 26
            height: 26
            radius: 13
            bg_color: 0x555555
            bg_opa: COVER
            border_width: 0

        - label:
            id: lbl_levelling_lon
            align: CENTER
            y: ${y_cap}
            text: "LÄNGS ---°"
            text_font: font_16
            text_color: 0x555555
        - label:
            id: lbl_levelling_lat
            align: BOTTOM_MID
            y: ${y_footer}
            text: "QUER ---°"
            text_font: font_16
            text_color: 0x555555
