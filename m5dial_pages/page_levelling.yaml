# =====================================================================
#  m5dial_pages/page_levelling.yaml — page: Levelling (spirit level)
#  FRAM M5Dial Cockpit · page package
#
#  Real entities:
#  - Bubble position: an MPU6050 tilt sensor (external hardware, own
#    ESPHome device "mpu6050"). LÄNGS (front/back) = its Pitch sensor,
#    QUER (left/right) = its Roll sensor -- matches that device's own
#    sign convention (pitch: front down = +, roll: right down = +).
#    Degrees only drive the bubble's on-screen position now -- see
#    below for why they're no longer shown as numbers.
#  - Corner readout: four sensors that already report how many
#    centimeters need adding at each corner (sensor.mpu6050_womo_vl_cm
#    / _vr_cm / _hl_cm / _hr_cm -- VL/VR/HL/HR = vorne links/rechts,
#    hinten links/rechts). These come pre-computed from elsewhere (the
#    mpu6050 device or a Node-RED flow) -- this page doesn't do its own
#    degrees-to-cm conversion, and doesn't know or need the vehicle's
#    track width/wheelbase to get there.
#
#  cm replaces ° for the numeric readout (readability follow-up): "how
#  many degrees" doesn't tell you what to actually do with a leveling
#  block, "how many cm at this corner" does. Four corners instead of
#  two axes because that's what the source sensors give -- LÄNGS/QUER
#  were a LIN-style axis pair, VL/VR/HL/HR is a per-wheel pair.
#
#  Bubble level, not just numbers (earlier readability follow-up):
#  three static rings as a target, a bubble that moves off-center with
#  tilt -- the physical spirit-level metaphor, not the insect.
#
#  Bubble travel: R_MAX = 85px maps to DEG_MAX = 4° (matches the old
#  alarm threshold) on each axis independently, clamped beyond that so
#  it can't leave the outer ring. Direction convention: a real bubble
#  floats toward the HIGH side, so QUER positive (right-down) moves it
#  left, LÄNGS positive (front-down) moves it toward the back (down on
#  screen, assuming the dial's "up" faces the front). Bubble COLOR
#  follows the cm readout instead (below), so a wrong bubble direction
#  wouldn't show as a wrong color, only a wrong position.
#
#  Diagonal corner mismatch (user report, now resolved): the WoMo sat
#  down at the rear left while this page showed the diagonally
#  opposite corner (front right) as worst, on both the bubble and the
#  cm labels -- a 180°-yaw mpu6050 mount error (it flips pitch and
#  roll, and anything computed from them, together; a single-axis
#  swap doesn't produce a diagonal flip, checked). Fixed AT THE SOURCE
#  via the mpu6050 device's own invert toggles (were off, now on) --
#  not in this file. Nothing to change here; noted in case the
#  direction ever looks wrong again, so a future fix isn't re-applied
#  on both ends at once.
#
#  No arc: a tilt isn't a 0-100% quantity (design.md §8), and the
#  rings aren't arcs either -- full circles via LVGL's radius = width/2
#  trick, not the gas/water double-ring pattern.
#
#  Thresholds (< 1.5cm ok, 1.5-3cm warning, >= 3cm alarm) are a GUESS,
#  same status as the old 2°/4° ones -- not measured against a real
#  leveling requirement (fridge compressor tolerance etc.), confirm
#  and adjust. Values round to whole cm for legibility at four labels
#  and font_12 -- revisit if that's not enough precision in practice.
#
#  Displayed clamped to >= 0, not signed: this is "how many cm to
#  place under this wheel" (wedges), not a delta to apply either
#  direction -- a negative source reading means "this corner's
#  already fine, no wedge needed here", which reads the same as 0,
#  not as "let air out". A corner clamped to 0 also doesn't count
#  toward the bubble's severity color -- nothing to do there isn't a
#  problem.
#
#  sensor.mpu6050_womo_vl_cm/_vr_cm/_hl_cm/_hr_cm now read real values
#  -- the degrees-to-cm math got built in HA per the original plan (a
#  template sensor per corner, using the vehicle's actual track
#  width/wheelbase), and this page still just reads the four finished
#  entities, no conversion of its own.
#
#  Corner labels sit on a page-local x:±44 / y:∓54 (not ${x_col}/
#  ${y_cap}, same page-local-literal reasoning as page_lights_outside's
#  x:±48) -- at the shared y_cap (-42) their text box's nearest corner
#  came out closer to center than the green target ring's own radius
#  (40px), so the ring visually cut through the label. Pushed out
#  along both axes for real clearance instead of just nudging one.
#
#  No button: reading only, nothing to act on from the dial.
#
#  on_load poll (design.md §9): poll_levelling forces a fresh push
#  from HA for all six entities on page_levelling's own on_load
#  trigger. Applied to every page.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_levelling_lon
    entity_id: sensor.mpu6050_pitch
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_lat
    entity_id: sensor.mpu6050_roll
    on_value:
      - script.execute: draw_levelling

  # ---- Per-corner cm-to-add, already computed upstream ---------------
  - platform: homeassistant
    id: s_levelling_vl
    entity_id: sensor.mpu6050_womo_vl_cm
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_vr
    entity_id: sensor.mpu6050_womo_vr_cm
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_hl
    entity_id: sensor.mpu6050_womo_hl_cm
    on_value:
      - script.execute: draw_levelling
  - platform: homeassistant
    id: s_levelling_hr
    entity_id: sensor.mpu6050_womo_hr_cm
    on_value:
      - script.execute: draw_levelling

script:
  # Forces a fresh push from HA for this page's entities -- called
  # from page_levelling's own on_load trigger below. See header re:
  # why (and re: the corner sensors having nothing real behind them
  # to poll yet).
  - id: poll_levelling
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_pitch
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_roll
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_vl_cm
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_vr_cm
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_hl_cm
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.mpu6050_womo_hr_cm

  - id: draw_levelling
    mode: restart
    then:
      # ---- Bubble position: clamped to the outer ring ------------------
      - lvgl.widget.update:
          id: obj_levelling_bubble
          x: !lambda |-
            if (!id(s_levelling_lat).has_state()) return 0;
            const float R_MAX = 85.0f, DEG_MAX = 4.0f;
            float ox = -(id(s_levelling_lat).state / DEG_MAX) * R_MAX;
            if (ox > R_MAX) ox = R_MAX;
            if (ox < -R_MAX) ox = -R_MAX;
            return (int) ox;
          y: !lambda |-
            if (!id(s_levelling_lon).has_state()) return 0;
            const float R_MAX = 85.0f, DEG_MAX = 4.0f;
            float oy = (id(s_levelling_lon).state / DEG_MAX) * R_MAX;
            if (oy > R_MAX) oy = R_MAX;
            if (oy < -R_MAX) oy = -R_MAX;
            return (int) oy;
          # Color now follows the worst corner (cm), not the raw degrees
          # -- same quantity the four labels show, so the bubble and the
          # numbers never disagree about how bad it is.
          bg_color: !lambda |-
            if (!id(s_levelling_vl).has_state() || !id(s_levelling_vr).has_state() ||
                !id(s_levelling_hl).has_state() || !id(s_levelling_hr).has_state())
              return lv_color_hex(0x555555);
            float v = id(s_levelling_vl).state;
            float t;
            t = id(s_levelling_vr).state; if (t > v) v = t;
            t = id(s_levelling_hl).state; if (t > v) v = t;
            t = id(s_levelling_hr).state; if (t > v) v = t;
            if (v < 0.0f) v = 0.0f;
            if (v >= 3.0f) return lv_color_hex(0xE74C3C);
            if (v >= 1.5f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- VL: vorne links (top left) ----------------------------------
      - lvgl.label.update:
          id: lbl_levelling_vl
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("VL --cm");
            #endif
            if (!id(s_levelling_vl).has_state()) return std::string("VL --cm");
            float v = id(s_levelling_vl).state;
            if (v < 0.0f) v = 0.0f;
            return str_sprintf("VL %.0fcm", v);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_levelling_vl).has_state()) return lv_color_hex(0x555555);
            float v = id(s_levelling_vl).state;
            if (v < 0.0f) v = 0.0f;
            if (v >= 3.0f) return lv_color_hex(0xE74C3C);
            if (v >= 1.5f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xBDC1C6);

      # ---- VR: vorne rechts (top right) ---------------------------------
      - lvgl.label.update:
          id: lbl_levelling_vr
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("VR --cm");
            #endif
            if (!id(s_levelling_vr).has_state()) return std::string("VR --cm");
            float v = id(s_levelling_vr).state;
            if (v < 0.0f) v = 0.0f;
            return str_sprintf("VR %.0fcm", v);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_levelling_vr).has_state()) return lv_color_hex(0x555555);
            float v = id(s_levelling_vr).state;
            if (v < 0.0f) v = 0.0f;
            if (v >= 3.0f) return lv_color_hex(0xE74C3C);
            if (v >= 1.5f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xBDC1C6);

      # ---- HL: hinten links (bottom left) --------------------------------
      - lvgl.label.update:
          id: lbl_levelling_hl
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("HL --cm");
            #endif
            if (!id(s_levelling_hl).has_state()) return std::string("HL --cm");
            float v = id(s_levelling_hl).state;
            if (v < 0.0f) v = 0.0f;
            return str_sprintf("HL %.0fcm", v);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_levelling_hl).has_state()) return lv_color_hex(0x555555);
            float v = id(s_levelling_hl).state;
            if (v < 0.0f) v = 0.0f;
            if (v >= 3.0f) return lv_color_hex(0xE74C3C);
            if (v >= 1.5f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xBDC1C6);

      # ---- HR: hinten rechts (bottom right) -------------------------------
      - lvgl.label.update:
          id: lbl_levelling_hr
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("HR --cm");
            #endif
            if (!id(s_levelling_hr).has_state()) return std::string("HR --cm");
            float v = id(s_levelling_hr).state;
            if (v < 0.0f) v = 0.0f;
            return str_sprintf("HR %.0fcm", v);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_levelling_hr).has_state()) return lv_color_hex(0x555555);
            float v = id(s_levelling_hr).state;
            if (v < 0.0f) v = 0.0f;
            if (v >= 3.0f) return lv_color_hex(0xE74C3C);
            if (v >= 1.5f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xBDC1C6);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_levelling

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_levelling
      on_load:
        - script.execute: poll_levelling
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # ---- Bubble level: static target rings --------------------------
        - obj:
            align: CENTER
            width: 200
            height: 200
            radius: 100
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x2A2D30
        - obj:
            align: CENTER
            width: 140
            height: 140
            radius: 70
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x2A2D30
        - obj:
            align: CENTER
            width: 80
            height: 80
            radius: 40
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x2ECC71

        # ---- Bubble level: the bubble itself ------------------------------
        - obj:
            id: obj_levelling_bubble
            align: CENTER
            width: 26
            height: 26
            radius: 13
            bg_color: 0x555555
            bg_opa: COVER
            border_width: 0

        # ---- Four corners: cm to add, VL/VR top, HL/HR bottom ------------
        - label:
            id: lbl_levelling_vl
            align: CENTER
            x: -44
            y: -54
            text: "VL --cm"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_levelling_vr
            align: CENTER
            x: 44
            y: -54
            text: "VR --cm"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_levelling_hl
            align: CENTER
            x: -44
            y: 54
            text: "HL --cm"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_levelling_hr
            align: CENTER
            x: 44
            y: 54
            text: "HR --cm"
            text_font: font_12
            text_color: 0x555555
