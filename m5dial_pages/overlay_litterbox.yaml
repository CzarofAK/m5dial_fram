# =====================================================================
#  m5dial_pages/overlay_litterbox.yaml — overlay: Litterbox (Katzenklo)
#  FRAM M5Dial Cockpit · overlay package
#
#  NOT a page (design.md §15) -- shown on top of whatever page is
#  current, via LVGL's top_layer rather than the pages: list. Doesn't
#  take part in page navigation (encoder next/previous, home_page) at
#  all.
#
#  Behavior, as specified:
#    - Light ON  -> overlay visible, red background. (Light OFF while
#      the overlay is showing and no fan cycle is running -> hidden
#      again immediately.)
#    - Fan turns ON while the overlay is showing -> background flips
#      to green for 5s, then the overlay hides, regardless of what the
#      light is doing by then.
#    - Dismissible early: double-clicking the physical front button
#      while this overlay is up acknowledges and hides it immediately
#      (`.m5dial_fram.yaml`'s double-click handler, generic across all
#      overlays -- see that file's header note). Acknowledging doesn't
#      change the light/fan, only the on-screen alert; it re-arms the
#      next time the light turns ON again (`g_ov_litterbox_ack` resets
#      whenever the light goes OFF).
#
#  Cat graphic: hand-drawn 16x16 blocky pixel art (not a photo, not a
#  real GIF -- LVGL's animimg widget just cycles two static PNGs,
#  m5dial_pages/assets/cat_1.png / cat_2.png, generated by
#  m5dial_pages/assets/gen_cat.py -- edit the frames there and re-run
#  it, not the PNGs pixel-by-pixel). RGBA source, `type: RGB565` +
#  `transparency: chroma_key` below so the background shows through
#  instead of a colored box around the cat.
#
#  The image:/animimg: block passed `esphome config` (schema-valid)
#  and its generated C++ was checked by hand (the lv_obj_has_flag/
#  LV_OBJ_FLAG_HIDDEN calls resolve to the same LVGL 9 symbols
#  ESPHome's own lvgl.widget.show/hide use) -- a full firmware
#  compile wasn't possible in this environment (no network route to
#  the ESP-IDF toolchain download). On-device rendering itself
#  (chroma-key correctness, whether the cat actually reads as a cat at
#  128px) still needs a real flash to confirm.
# =====================================================================

# ---------------------------------------------------------------------
#  B  Assets
# ---------------------------------------------------------------------
image:
  - id: img_cat_1
    file: m5dial_pages/assets/cat_1.png
    type: RGB565
    transparency: chroma_key
  - id: img_cat_2
    file: m5dial_pages/assets/cat_2.png
    type: RGB565
    transparency: chroma_key

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
globals:
  # Page-local state (an accepted exception to "no state held on the
  # dial" -- this isn't vehicle data, it's purely "did the user already
  # dismiss the alert that's currently showing"). Reset to false
  # whenever the light goes OFF, so the next ON re-arms it.
  - id: g_ov_litterbox_ack
    type: bool
    restore_value: false
    initial_value: "false"

binary_sensor:
  - platform: homeassistant
    id: s_ov_litterbox_light
    entity_id: switch.litterbox_light
    on_state:
      - script.execute: draw_ov_litterbox

  - platform: homeassistant
    id: s_ov_litterbox_fan
    entity_id: switch.litterbox_fan
    on_press:
      - script.execute: ov_litterbox_fan_flash

script:
  - id: draw_ov_litterbox
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(s_ov_litterbox_light).state;
          then:
            - if:
                condition:
                  lambda: return !id(g_ov_litterbox_ack);
                then:
                  - lvgl.widget.update:
                      id: ov_litterbox
                      bg_color: 0xE74C3C
                  - lvgl.widget.show: ov_litterbox
          else:
            - globals.set:
                id: g_ov_litterbox_ack
                value: "false"
            - script.stop: ov_litterbox_fan_flash
            - lvgl.widget.hide: ov_litterbox

  - id: ov_litterbox_fan_flash
    mode: restart
    then:
      # Only flash-and-dismiss if the overlay is actually up for a
      # reason -- a fan cycle with the light already off, or already
      # acknowledged, shouldn't summon it back.
      - if:
          condition:
            lambda: return id(s_ov_litterbox_light).state && !id(g_ov_litterbox_ack);
          then:
            - lvgl.widget.update:
                id: ov_litterbox
                bg_color: 0x2ECC71
            - delay: 5s
            - lvgl.widget.hide: ov_litterbox

  # Dismiss on double-click (.m5dial_fram.yaml calls this directly,
  # unconditionally -- guarded here so it's a no-op when this overlay
  # isn't the one showing).
  - id: ov_litterbox_ack
    then:
      - if:
          condition:
            lambda: return !lv_obj_has_flag(id(ov_litterbox), LV_OBJ_FLAG_HIDDEN);
          then:
            - globals.set:
                id: g_ov_litterbox_ack
                value: "true"
            - script.stop: ov_litterbox_fan_flash
            - lvgl.widget.hide: ov_litterbox

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_ov_litterbox

# ---------------------------------------------------------------------
#  D  Widget
# ---------------------------------------------------------------------
lvgl:
  top_layer:
    widgets:
      - obj:
          id: ov_litterbox
          align: CENTER
          width: 240
          height: 240
          radius: 0
          border_width: 0
          hidden: true
          bg_color: 0xE74C3C
          bg_opa: COVER
          widgets:
            - animimg:
                align: CENTER
                y: -25
                width: 128
                height: 128
                src:
                  - img_cat_1
                  - img_cat_2
                duration: 600ms
                repeat_count: forever
                auto_start: true
            - label:
                align: CENTER
                y: 55
                text: "KATZENKLO"
                text_font: font_24
                text_color: 0xFFFFFF
            - label:
                align: CENTER
                y: 92
                text: "2X KLICK = AUS"
                text_font: font_12
                text_color: 0xF5A9A0
