# =====================================================================
#  m5dial_pages/page_power_1.yaml — page: Power / Battery
#  FRAM M5Dial Cockpit · page package
#
#  Slots (design.md §3):
#    y_main   72%              montserrat_40
#    y_line2  13.4V  -12A      montserrat_16
#    y_row    button PARK      104 x 30
#    y_footer status line      montserrat_12
#
#  Status line: remaining battery time (SmartShunt, hours) while
#  discharging - deliberate exception to design.md §6 "empty in normal
#  operation" (repo-owner request 17.10.2026). The starter battery
#  warning takes priority; it only shows when it doesn't
#  report "ok". It delivers a state, not a voltage — the 12.4/12.0 V
#  thresholds from design.md §6 are therefore moot as long as no real
#  voltage sensor is wired to the starter battery.
#
#  Width check y_main (montserrat_40, box top edge -44.5, r 102):
#    available ~183 px, "100%" ≈ 100 px. Fits.
#
#  on_load poll (design.md §9): poll_power_1 forces a fresh push from
#  HA for this page's entities on page_power_1's own on_load trigger.
#  Applied to every page now, including ones that already tend to
#  update promptly -- the call is cheap, and consistency beats
#  guessing per page which integrations are fast enough to skip.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
# Hooks onto the sensors from the sources package by ID. Merge by id:
# the platform lives there, the trigger here.
sensor:
  - platform: homeassistant
    id: s_power_1_soc
    entity_id: sensor.smartshunt_ladestand
    on_value:
      - script.execute: draw_power_1
  - platform: homeassistant
    id: s_power_1_dc_v
    entity_id: sensor.smartshunt_dc_bus_spannung
    on_value:
      - script.execute: draw_power_1
  - platform: homeassistant
    id: s_power_1_dc_a
    entity_id: sensor.smartshunt_dc_bus_stromstarke
    on_value:
      - script.execute: draw_power_1

  # SmartShunt remaining time to empty, unit HOURS (Victron GX
  # integration). Shown in the status line while discharging.
  - platform: homeassistant
    id: s_power_1_ttg
    entity_id: sensor.smartshunt_verbleibende_zeit
    on_value:
      - script.execute: draw_power_1
text_sensor:
  # The starter battery delivers NO voltage, but a state (mbapi2020):
  #   0 green            Vehicle ok
  #   1 yellow           Battery partly charged
  #   2 red              Vehicle not available
  #   3 serviceDisabled  Remote service disabled
  #   4 vehicleNotAvalable
  # 2/3/4 say nothing about the battery, only that the query didn't get
  # through — those therefore count as "no value", not as an alarm.
  - platform: homeassistant
    id: s_power_1_starter
    entity_id: sensor.nw19939_starter_battery_state
    on_value:
      - script.execute: draw_power_1

binary_sensor:
  - platform: homeassistant
    id: s_power_1_park
    entity_id: switch.fram_parkmodus
    trigger_on_initial_state: true
    on_state:
      - script.execute: draw_power_1

script:
  # Forces a fresh push from HA for this page's entities -- called
  # from page_power_1's own on_load trigger below. See header re: why.
  - id: poll_power_1
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_ladestand
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_dc_bus_spannung
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_dc_bus_stromstarke
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.smartshunt_verbleibende_zeit
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.nw19939_starter_battery_state
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.fram_parkmodus

  # The button never calls a service directly, always an act_ script.
  # That keeps block D device-independent.
  - id: act_power_1_park
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.fram_parkmodus

  - id: draw_power_1
    mode: restart
    then:
      # ---- Arc + main value: SOC ------------------------------------
      - lvgl.arc.update:
          id: arc_power_1_soc
          value: !lambda |-
            if (!id(s_power_1_soc).has_state()) return 0.0f;
            return id(s_power_1_soc).state;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_power_1_soc).has_state()) return lv_color_hex(0x555555);
              float v = id(s_power_1_soc).state;
              if (v < 20.0f) return lv_color_hex(0xE74C3C);
              if (v < 40.0f) return lv_color_hex(0xF39C12);
              return lv_color_hex(0x2ECC71);

      - lvgl.label.update:
          id: lbl_power_1_soc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---%");
            #endif
            if (!id(s_power_1_soc).has_state()) return std::string("---%");
            return str_sprintf("%.0f%%", id(s_power_1_soc).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_1_soc).has_state()) return lv_color_hex(0x555555);
            float v = id(s_power_1_soc).state;
            if (v < 20.0f) return lv_color_hex(0xE74C3C);
            if (v < 40.0f) return lv_color_hex(0xF39C12);
            return lv_color_hex(0xFFFFFF);

      # ---- Secondary line: DC voltage and current --------------------
      - lvgl.label.update:
          id: lbl_power_1_dc
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---V  ---A");
            #endif
            if (!id(s_power_1_dc_v).has_state() || !id(s_power_1_dc_a).has_state())
              return std::string("---V  ---A");
            return str_sprintf("%.1fV  %+.0fA", id(s_power_1_dc_v).state, id(s_power_1_dc_a).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_1_dc_v).has_state() || !id(s_power_1_dc_a).has_state())
              return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Button: park mode -------------------------------------------
      # design.md §7: without a connection "PARK ---", not "PARK AUS".
      - lvgl.label.update:
          id: lbl_power_1_park
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("PARK ---");
            #endif
            if (!id(s_power_1_park).has_state()) return std::string("PARK ---");
            return id(s_power_1_park).state ? std::string("PARK EIN")
                                    : std::string("PARK AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_power_1_park).has_state()) return lv_color_hex(0x555555);
            return id(s_power_1_park).state ? lv_color_hex(0x2ECC71)
                                    : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_power_1_park
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_power_1_park).has_state()) return lv_color_hex(0x202124);
            return id(s_power_1_park).state ? lv_color_hex(0x1B5E3A)
                                    : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_power_1_park).has_state()) return lv_color_hex(0x3C4043);
            return id(s_power_1_park).state ? lv_color_hex(0x2ECC71)
                                    : lv_color_hex(0x3C4043);

      # ---- Status line ------------------------------------------------
      # Priority: no connection > starter battery warning > remaining
      # time while discharging (repo-owner request 17.10.2026: Restdauer
      # on this page) > empty. Remaining time comes from the SmartShunt
      # in hours; only meaningful while discharging (< -0.5 A).
      - lambda: |-
          char buf[24];
          const char *txt = "";
          uint32_t c = 0x707070;
          bool api = true;
          #ifdef USE_API
          api = api_is_connected();
          #endif
          bool starter_weak = false, starter_none = false;
          if (api && id(s_power_1_starter).has_state()) {
            const std::string &v = id(s_power_1_starter).state;
            starter_weak = (v == "1" || v == "yellow");
            starter_none = !(starter_weak || v == "0" || v == "green");
          }
          bool discharging = api && id(s_power_1_dc_a).has_state() &&
                             id(s_power_1_dc_a).state < -0.5f;
          bool ttg_ok = discharging && id(s_power_1_ttg).has_state() &&
                        !std::isnan(id(s_power_1_ttg).state) &&
                        id(s_power_1_ttg).state > 0.0f;
          if (!api) { txt = "KEINE VERBINDUNG"; c = 0x555555; }
          else if (starter_weak) { txt = "START SCHWACH"; c = 0xF39C12; }
          else if (ttg_ok) {
            int mins = (int) lroundf(id(s_power_1_ttg).state * 60.0f);
            if (mins >= 24 * 60)
              snprintf(buf, sizeof(buf), "NOCH %dd %02dh", mins / 1440, (mins % 1440) / 60);
            else
              snprintf(buf, sizeof(buf), "NOCH %dh%02dm", mins / 60, mins % 60);
            txt = buf;
            c = 0xBDC1C6;
          }
          else if (starter_none) { txt = "START KEIN WERT"; c = 0x555555; }
          lv_label_set_text(id(lbl_power_1_status), txt);
          lv_obj_set_style_text_color(id(lbl_power_1_status), lv_color_hex(c), 0);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_power_1

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_power_1
      on_load:
        - script.execute: poll_power_1
      # An LVGL page is by default an opaque WHITE object and sits over
      # the bottom_layer from the header. Without these two lines
      # everything sits on a white background (correction to design.md
      # §8).
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - arc:
            id: arc_power_1_soc
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        - label:
            id: lbl_power_1_soc
            align: CENTER
            y: ${y_main}
            text: "---%"
            text_font: font_40
            text_color: 0x555555

        - label:
            id: lbl_power_1_dc
            align: CENTER
            y: ${y_line2}
            text: "---V  ---A"
            text_font: font_16
            text_color: 0x555555

        - button:
            id: btn_power_1_park
            align: CENTER
            y: ${y_row}
            width: 104
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_power_1_park
                  align: CENTER
                  text: "PARK ---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_power_1_park

        - label:
            id: lbl_power_1_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: font_12
            text_color: 0x555555
