# =====================================================================
#  m5dial_pages/page_ipixel.yaml — page: iPixel
#  FRAM M5Dial Cockpit · page package
#
#  Real entities, not the placeholders originally guessed:
#
#  On/off: input_boolean.ipixel -- a scene/automation trigger, not the
#  iPixel's own hardware switch, so it's driven with input_boolean.*
#  services rather than switch.*.
#
#  Status: two real per-side switches, not one text status sensor --
#  switch.ipixel_front_left_led_left and
#  switch.ipixel_front_right_led_right. Shown as a compact L/R split
#  on y_line2 (design.md §3's "context for the main value" slot),
#  since there's no single combined status string to read anymore.
#
#  Slots (design.md §3):
#    y_main   AN / AUS          montserrat_40 — input_boolean.ipixel
#    y_line2  L EIN · R AUS     montserrat_16 — the two LED switches,
#                                split across x: ±${x_col}
#    y_row    one button        140 x 36 — toggle input_boolean.ipixel
#
#  Button grew from 104x30 (readability follow-up: a single small
#  button under a big AN/AUS value read as too sparse) -- bigger,
#  clearer touch target, also a better match now that double-click can
#  trigger the same toggle (.m5dial_fram.yaml's double-click handler --
#  home is long-press-only here now): haptic control while driving,
#  touch while parked, both always available.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: s_ipixel_power
    entity_id: input_boolean.ipixel
    on_state:
      - script.execute: draw_ipixel
  - platform: homeassistant
    id: s_ipixel_led_left
    entity_id: switch.ipixel_front_left_led_left
    on_state:
      - script.execute: draw_ipixel
  - platform: homeassistant
    id: s_ipixel_led_right
    entity_id: switch.ipixel_front_right_led_right
    on_state:
      - script.execute: draw_ipixel

script:
  - id: act_ipixel_power
    then:
      - homeassistant.service:
          service: input_boolean.toggle
          data:
            entity_id: input_boolean.ipixel

  - id: draw_ipixel
    mode: restart
    then:
      # ---- Main value: power state --------------------------------
      - lvgl.label.update:
          id: lbl_ipixel_power
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_ipixel_power).has_state()) return std::string("---");
            return id(s_ipixel_power).state ? std::string("AN") : std::string("AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_ipixel_power).has_state()) return lv_color_hex(0x555555);
            return id(s_ipixel_power).state ? lv_color_hex(0xFFFFFF)
                                     : lv_color_hex(0xBDC1C6);

      # ---- Line 2: LEFT LED status --------------------------------
      - lvgl.label.update:
          id: lbl_ipixel_led_left
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("L ---");
            #endif
            if (!id(s_ipixel_led_left).has_state()) return std::string("L ---");
            return id(s_ipixel_led_left).state ? std::string("L EIN") : std::string("L AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_ipixel_led_left).has_state()) return lv_color_hex(0x555555);
            return id(s_ipixel_led_left).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0xBDC1C6);

      # ---- Line 2: RIGHT LED status --------------------------------
      - lvgl.label.update:
          id: lbl_ipixel_led_right
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("R ---");
            #endif
            if (!id(s_ipixel_led_right).has_state()) return std::string("R ---");
            return id(s_ipixel_led_right).state ? std::string("R EIN") : std::string("R AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_ipixel_led_right).has_state()) return lv_color_hex(0x555555);
            return id(s_ipixel_led_right).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0xBDC1C6);

      # ---- Button: on/off -------------------------------------------
      - lvgl.label.update:
          id: lbl_ipixel_btn
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("PIXEL ---");
            #endif
            if (!id(s_ipixel_power).has_state()) return std::string("PIXEL ---");
            return id(s_ipixel_power).state ? std::string("PIXEL EIN")
                                     : std::string("PIXEL AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_ipixel_power).has_state()) return lv_color_hex(0x555555);
            return id(s_ipixel_power).state ? lv_color_hex(0x2ECC71)
                                     : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_ipixel_power
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_ipixel_power).has_state()) return lv_color_hex(0x202124);
            return id(s_ipixel_power).state ? lv_color_hex(0x1B5E3A)
                                     : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_ipixel_power).has_state()) return lv_color_hex(0x3C4043);
            return id(s_ipixel_power).state ? lv_color_hex(0x2ECC71)
                                     : lv_color_hex(0x3C4043);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_ipixel

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_ipixel
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_ipixel_power
            align: CENTER
            y: ${y_main}
            text: "---"
            text_font: font_40
            text_color: 0x555555

        - label:
            id: lbl_ipixel_led_left
            align: CENTER
            x: -${x_col}
            y: ${y_line2}
            text: "L ---"
            text_font: font_16
            text_color: 0x555555
        - label:
            id: lbl_ipixel_led_right
            align: CENTER
            x: ${x_col}
            y: ${y_line2}
            text: "R ---"
            text_font: font_16
            text_color: 0x555555

        - button:
            id: btn_ipixel_power
            align: CENTER
            y: ${y_row}
            width: 140
            height: 36
            radius: 18
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_ipixel_btn
                  align: CENTER
                  text: "PIXEL ---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_ipixel_power
