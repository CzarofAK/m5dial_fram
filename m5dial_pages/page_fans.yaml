# =====================================================================
#  m5dial_pages/page_fans.yaml — page: Fans (Fanboard + HVAC)
#  FRAM M5Dial Cockpit · page package
#
#  Double ring (design.md §4), same geometry as page_gas.yaml:
#    outer 224 x 224   FANBOARD -- real, number.fan_board_fan_speed
#    inner 200 x 200   HVAC     -- real,
#                                  number.relay_2ch_hvac_hvac_fan_battery.
#                                  This is the Sprinter's OEM blower
#                                  motor, driven by the separate
#                                  relay-2ch-hvac ESPHome device (2
#                                  relays + MD30C PWM driver) via a
#                                  template number entity -- entity_id
#                                  user-confirmed (2nd correction; an
#                                  earlier guess, number.hvac_fan_battery,
#                                  was wrong -- re-check again if the
#                                  device's `name:` ever changes, this
#                                  isn't a guess-proof scheme). That
#                                  device's own `set_action` only
#                                  actually moves the motor when
#                                  `battery_mode_allowed` is true there
#                                  (ignition off + an after-run delay) --
#                                  setting it here while driving is
#                                  accepted but has no effect until the
#                                  van is parked; that logic lives
#                                  entirely on the relay board's side,
#                                  not duplicated here. Device steps in
#                                  10% increments (its own `step: 10`),
#                                  so this page mirrors that instead of
#                                  FANBOARD's 5%.
#
#  FANBOARD also exposes four individual channel-speed readbacks
#  (sensor.fan_board_fan_speed_1.._4, user-confirmed) behind the one
#  combined setpoint above. Per user decision, not shown individually
#  (four more numbers don't fit the two-arc shape) -- instead
#  draw_fans shows their Ø (average) on y_line2, otherwise unused on
#  this page, plus a small red dot (dot_fans_board_dev) that lights up
#  when any one channel is > 15 percentage points off that average
#  (a guess, not a measured tolerance -- revisit on the device, same
#  as the boiler tiers/levelling cm thresholds elsewhere in this repo).
#  Needs >= 2 channels reporting to mean anything as a "deviation";
#  with 0 or 1 the dot just stays hidden. HVAC's own y_line2 stays
#  empty -- it has no channels to average.
#
#  Interaction: tap a column's SET button to arm it (design.md §14,
#  g_edit_target in .m5dial_fram.yaml) -- the encoder then adjusts
#  that value (5% steps for FANBOARD, 10% for HVAC, matching each
#  entity's own step size) instead of paging, until SET is tapped
#  again. Armed is shown by the SET button's border lighting up, and
#  by the footer hint. Both columns now write to real entities.
#
#  Double-click on the physical front button cycles between the two
#  columns' SET (.m5dial_fram.yaml's double-click handler -- home is
#  long-press-only here now): 1st click arms FANBOARD, 2nd click
#  switches to arming HVAC, 3rd disarms (back to navigate mode), then
#  wraps. Driven entirely off the CURRENT g_edit_target, not a
#  separate position counter (bug fix: a counter that just alternated
#  between "call act_fans_arm_board" / "call act_fans_arm_hvac" could
#  never reach disarmed -- each of those scripts only toggles ITS OWN
#  target off if IT was the one already armed, so bouncing between two
#  different targets meant neither ever saw itself armed, and the
#  encoder lock never released). Also correct if a touch tap (the
#  on-screen SET buttons) changes the armed target in between
#  double-clicks -- the cycle reads real state, not a remembered step.
#  Leaving either column (via double-click OR re-tapping its own SET)
#  flushes that column's debounced write immediately, same as before.
#
#  Encoder feel (both columns): same lag fix as page_power_2.yaml (see
#  that file's header) -- adjusts a local g_fans_*_pending value and
#  redraws from it immediately, only calling number.set_value once the
#  encoder's quiet for 400ms (or immediately on disarm).
#
#  on_load poll (design.md §9): poll_fans forces a fresh push from HA
#  for number.fan_board_fan_speed and number.relay_2ch_hvac_hvac_fan_battery on
#  page_fans's own on_load trigger. Applied to every page now,
#  including ones that already tend to update promptly -- the call is
#  cheap, and consistency beats guessing per page which integrations
#  are fast enough to skip.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_fans_board_speed
    entity_id: number.fan_board_fan_speed
    on_value:
      - script.execute: draw_fans

  - platform: homeassistant
    id: s_fans_hvac_speed
    entity_id: number.relay_2ch_hvac_hvac_fan_battery
    on_value:
      - script.execute: draw_fans

  # FANBOARD's four individual channel readbacks, user-confirmed --
  # feed the Ø average + deviation dot in draw_fans below, not shown
  # individually (see header).
  - platform: homeassistant
    id: s_fans_board_ch1
    entity_id: sensor.fan_board_fan_speed_1
    on_value:
      - script.execute: draw_fans
  - platform: homeassistant
    id: s_fans_board_ch2
    entity_id: sensor.fan_board_fan_speed_2
    on_value:
      - script.execute: draw_fans
  - platform: homeassistant
    id: s_fans_board_ch3
    entity_id: sensor.fan_board_fan_speed_3
    on_value:
      - script.execute: draw_fans
  - platform: homeassistant
    id: s_fans_board_ch4
    entity_id: sensor.fan_board_fan_speed_4
    on_value:
      - script.execute: draw_fans

globals:
  # Page-local, same reasoning as page_power_2.yaml's
  # g_power_2_assist_pending.
  - id: g_fans_board_pending
    type: float
    restore_value: false
    initial_value: "0"

  - id: g_fans_hvac_pending
    type: float
    restore_value: false
    initial_value: "0"

script:
  # Forces a fresh push from HA for this page's two real entities --
  # called from page_fans's own on_load trigger below. Two separate
  # calls, not a list -- homeassistant.service's data:/data_template:
  # values must be plain strings (design.md §9).
  - id: poll_fans
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: number.fan_board_fan_speed
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: number.relay_2ch_hvac_hvac_fan_battery
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.fan_board_fan_speed_1
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.fan_board_fan_speed_2
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.fan_board_fan_speed_3
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: sensor.fan_board_fan_speed_4

  - id: act_fans_arm_board
    then:
      - lambda: |-
          bool was_armed = (id(g_edit_target) == 1);
          id(g_edit_target) = was_armed ? 0 : 1;
          if (!was_armed) {
            id(g_fans_board_pending) = id(s_fans_board_speed).has_state() ? id(s_fans_board_speed).state : 0.0f;
          } else {
            id(fans_board_write_debounced)->stop();
            id(fans_board_write_now)->execute();
          }
      - script.execute: draw_fans

  - id: act_fans_arm_hvac
    then:
      - lambda: |-
          bool was_armed = (id(g_edit_target) == 2);
          id(g_edit_target) = was_armed ? 0 : 2;
          if (!was_armed) {
            id(g_fans_hvac_pending) = id(s_fans_hvac_speed).has_state() ? id(s_fans_hvac_speed).state : 0.0f;
          } else {
            id(fans_hvac_write_debounced)->stop();
            id(fans_hvac_write_now)->execute();
          }
      - script.execute: draw_fans

  # Called by .m5dial_fram.yaml's double-click handler -- see header
  # for why this reads current state instead of tracking its own
  # position: FANBOARD armed -> HVAC, HVAC armed -> disarm, anything
  # else (disarmed, or a leftover target from another page) -> FANBOARD.
  - id: dc_fans_cycle
    then:
      - lambda: |-
          int cur = id(g_edit_target);
          if (cur == 1) {
            id(fans_board_write_debounced)->stop();
            id(fans_board_write_now)->execute();
            id(g_fans_hvac_pending) = id(s_fans_hvac_speed).has_state() ? id(s_fans_hvac_speed).state : 0.0f;
            id(g_edit_target) = 2;
          } else if (cur == 2) {
            id(fans_hvac_write_debounced)->stop();
            id(fans_hvac_write_now)->execute();
            id(g_edit_target) = 0;
          } else {
            id(g_fans_board_pending) = id(s_fans_board_speed).has_state() ? id(s_fans_board_speed).state : 0.0f;
            id(g_edit_target) = 1;
          }
      - script.execute: draw_fans

  # 5%-step, clamped 0-100. Adjusts g_fans_board_pending locally and
  # redraws immediately (see header re: lag), only calling
  # number.set_value once the encoder's quiet for 400ms.
  - id: act_fans_speed_up
    then:
      - lambda: |-
          float v = id(g_fans_board_pending) + 5.0f;
          if (v > 100.0f) v = 100.0f;
          id(g_fans_board_pending) = v;
      - script.execute: draw_fans
      - script.execute: fans_board_write_debounced

  - id: act_fans_speed_down
    then:
      - lambda: |-
          float v = id(g_fans_board_pending) - 5.0f;
          if (v < 0.0f) v = 0.0f;
          id(g_fans_board_pending) = v;
      - script.execute: draw_fans
      - script.execute: fans_board_write_debounced

  # The actual write, split from the debounce delay so disarming can
  # call it immediately (act_fans_arm_board above).
  - id: fans_board_write_now
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.fan_board_fan_speed
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_fans_board_pending));"

  - id: fans_board_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: fans_board_write_now

  # 10%-step (matches number.relay_2ch_hvac_hvac_fan_battery's own `step: 10`),
  # clamped 0-100. Same local-pending + debounced-write shape as
  # FANBOARD above (see header re: lag).
  - id: act_fans_hvac_up
    then:
      - lambda: |-
          float v = id(g_fans_hvac_pending) + 10.0f;
          if (v > 100.0f) v = 100.0f;
          id(g_fans_hvac_pending) = v;
      - script.execute: draw_fans
      - script.execute: fans_hvac_write_debounced

  - id: act_fans_hvac_down
    then:
      - lambda: |-
          float v = id(g_fans_hvac_pending) - 10.0f;
          if (v < 0.0f) v = 0.0f;
          id(g_fans_hvac_pending) = v;
      - script.execute: draw_fans
      - script.execute: fans_hvac_write_debounced

  # The actual write, split from the debounce delay so disarming can
  # call it immediately (act_fans_arm_hvac / dc_fans_cycle above).
  - id: fans_hvac_write_now
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.relay_2ch_hvac_hvac_fan_battery
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_fans_hvac_pending));"

  - id: fans_hvac_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: fans_hvac_write_now

  - id: draw_fans
    mode: restart
    then:
      # ---- Outer ring: FANBOARD ---------------------------------------
      - lvgl.arc.update:
          id: arc_fans_board
          value: !lambda |-
            // Armed: show the pending (locally-dialed) value, not the
            // HA-confirmed one -- see header re: lag.
            if (id(g_edit_target) == 1) return id(g_fans_board_pending);
            if (!id(s_fans_board_speed).has_state()) return 0.0f;
            return id(s_fans_board_speed).state;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_fans_board_speed).has_state()) return lv_color_hex(0x555555);
              return lv_color_hex(0x4A9EFF);

      # ---- Inner ring: HVAC --------------------------------------------
      - lvgl.arc.update:
          id: arc_fans_hvac
          value: !lambda |-
            // Armed: show the pending (locally-dialed) value, not the
            // HA-confirmed one -- see header re: lag.
            if (id(g_edit_target) == 2) return id(g_fans_hvac_pending);
            if (!id(s_fans_hvac_speed).has_state()) return 0.0f;
            return id(s_fans_hvac_speed).state;
          indicator:
            arc_color: !lambda |-
              #ifdef USE_API
              if (!api_is_connected()) return lv_color_hex(0x555555);
              #endif
              if (!id(s_fans_hvac_speed).has_state()) return lv_color_hex(0x555555);
              return lv_color_hex(0x9AA0A6);

      # ---- Outer column: FANBOARD --------------------------------------
      - lvgl.label.update:
          id: lbl_fans_pct_board
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---%");
            #endif
            if (id(g_edit_target) == 1) return str_sprintf("%.0f%%", id(g_fans_board_pending));
            if (!id(s_fans_board_speed).has_state()) return std::string("---%");
            return str_sprintf("%.0f%%", id(s_fans_board_speed).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_fans_board_speed).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xFFFFFF);
      - lvgl.widget.update:
          id: btn_fans_set_board
          border_color: !lambda |-
            if (id(g_edit_target) == 1) return lv_color_hex(0x4A9EFF);
            return lv_color_hex(0x3C4043);

      # ---- Outer column: FANBOARD channel average + deviation dot ------
      # Ø of whichever of the four channel sensors currently have a
      # state (not all four are required -- one slow-to-report sensor
      # shouldn't blank the whole readout). The dot lights up when any
      # available channel is more than 15 percentage points off the
      # average -- a guess, not a measured tolerance (design.md §14
      # convention: flagged as a guess to revisit on the device, same
      # as the boiler tiers/levelling cm thresholds). Needs at least
      # two channels reporting to mean anything as a "deviation".
      - lvgl.label.update:
          id: lbl_fans_board_avg
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("Ø ---%");
            #endif
            float sum = 0.0f;
            int n = 0;
            if (id(s_fans_board_ch1).has_state()) { sum += id(s_fans_board_ch1).state; n++; }
            if (id(s_fans_board_ch2).has_state()) { sum += id(s_fans_board_ch2).state; n++; }
            if (id(s_fans_board_ch3).has_state()) { sum += id(s_fans_board_ch3).state; n++; }
            if (id(s_fans_board_ch4).has_state()) { sum += id(s_fans_board_ch4).state; n++; }
            if (n == 0) return std::string("Ø ---%");
            return str_sprintf("Ø%.0f%%", sum / n);
          text_color: 0x555555
      - lvgl.widget.update:
          id: dot_fans_board_dev
          hidden: !lambda |-
            float sum = 0.0f;
            float vals[4];
            int n = 0;
            if (id(s_fans_board_ch1).has_state()) { vals[n] = id(s_fans_board_ch1).state; sum += vals[n]; n++; }
            if (id(s_fans_board_ch2).has_state()) { vals[n] = id(s_fans_board_ch2).state; sum += vals[n]; n++; }
            if (id(s_fans_board_ch3).has_state()) { vals[n] = id(s_fans_board_ch3).state; sum += vals[n]; n++; }
            if (id(s_fans_board_ch4).has_state()) { vals[n] = id(s_fans_board_ch4).state; sum += vals[n]; n++; }
            if (n < 2) return true;
            float avg = sum / n;
            for (int i = 0; i < n; i++) {
              float diff = vals[i] - avg;
              if (diff < 0.0f) diff = -diff;
              if (diff > 15.0f) return false;
            }
            return true;

      # ---- Inner column: HVAC --------------------------------------------
      - lvgl.label.update:
          id: lbl_fans_pct_hvac
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---%");
            #endif
            if (id(g_edit_target) == 2) return str_sprintf("%.0f%%", id(g_fans_hvac_pending));
            if (!id(s_fans_hvac_speed).has_state()) return std::string("---%");
            return str_sprintf("%.0f%%", id(s_fans_hvac_speed).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_fans_hvac_speed).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_fans_set_hvac
          border_color: !lambda |-
            if (id(g_edit_target) == 2) return lv_color_hex(0x4A9EFF);
            return lv_color_hex(0x3C4043);

      # ---- Footer: edit-mode hint --------------------------------------
      - lvgl.label.update:
          id: lbl_fans_status
          text: !lambda |-
            if (id(g_edit_target) == 1 || id(g_edit_target) == 2)
              return std::string("DREHEN ZUM ÄNDERN");
            return std::string("");

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_fans

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_fans
      on_load:
        - script.execute: poll_fans
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - arc:
            id: arc_fans_board
            align: CENTER
            width: 224
            height: 224
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        - arc:
            id: arc_fans_hvac
            align: CENTER
            width: 200
            height: 200
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            adjustable: false
            arc_width: 10
            arc_color: 0x1A1C1E
            indicator:
              arc_width: 10
              arc_color: 0x555555
            knob:
              bg_opa: TRANSP

        # ---- Outer column: FANBOARD ---------------------------------
        - label:
            id: lbl_fans_cap_board
            align: CENTER
            x: -${x_col}
            y: ${y_cap}
            text: "FANBOARD"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_fans_pct_board
            align: CENTER
            x: -${x_col}
            y: ${y_main}
            text: "---%"
            text_font: font_24
            text_color: 0x555555
        # Ø of the four channel readbacks (draw_fans) -- y_line2 is
        # otherwise unused on this page (y_row hosts SET instead), and
        # only the FANBOARD column has channels to average, so the
        # HVAC column's own y_line2 stays empty rather than showing
        # something asymmetric there.
        - label:
            id: lbl_fans_board_avg
            align: CENTER
            x: -${x_col}
            y: ${y_line2}
            text: "Ø ---%"
            text_font: font_16
            text_color: 0x555555
        - obj:
            id: dot_fans_board_dev
            align: CENTER
            x: -8
            y: ${y_line2}
            width: 8
            height: 8
            radius: 4
            bg_color: 0xE74C3C
            border_width: 0
            hidden: true
        - button:
            id: btn_fans_set_board
            align: CENTER
            x: -${x_col}
            y: ${y_row}
            width: 68
            height: 26
            radius: 13
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "SET"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_fans_arm_board

        # ---- Inner column: HVAC ----------------------------------------
        - label:
            id: lbl_fans_cap_hvac
            align: CENTER
            x: ${x_col}
            y: ${y_cap}
            text: "HVAC"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_fans_pct_hvac
            align: CENTER
            x: ${x_col}
            y: ${y_main}
            text: "---%"
            text_font: font_24
            text_color: 0x555555
        - button:
            id: btn_fans_set_hvac
            align: CENTER
            x: ${x_col}
            y: ${y_row}
            width: 68
            height: 26
            radius: 13
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "SET"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_fans_arm_hvac

        - label:
            id: lbl_fans_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: font_12
            text_color: 0x4A9EFF
