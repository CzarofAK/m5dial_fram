# =====================================================================
#  m5dial_pages/page_clock.yaml — page: Clock (SBB railway clock)
#  FRAM M5Dial Cockpit · page package
#
#  The clock widget itself (hand kinematics, Stop2Go sweep, ticks,
#  date/temperature rendering) lives in its own repo now, as a reusable
#  ESPHome external component — not FRAM-specific, so it doesn't belong
#  in this repo. This file is only the FRAM wiring around it: which
#  time/temperature source, page id, colors, bezel.
#  https://github.com/CzarofAK/m5dial_clock_sbb
#
#  Deliberately NOT set: `night_mode`. design.md §6 says day and night
#  differ ONLY in backlight brightness, never in the color scheme —
#  apply_daynight in the header already handles that. The component
#  supports inverting the clock face for night (`set_night_mode()`),
#  but wiring that up would contradict §6, so it's left at its default
#  (off) here. Revisit deliberately if that rule ever changes.
#
#  `show_face: true` draws a filled circle in `background` with a
#  `foreground`-colored border (width scales with the radius, 3 px at
#  240x240) — this is what replaces the old page's separate bezel
#  object, no extra widget needed for it.
# =====================================================================

external_components:
  - source:
      type: git
      url: https://github.com/CzarofAK/m5dial_clock_sbb
      ref: main
    refresh: 1d
    components: [sbb_clock]

# Marker key — without it ESPHome won't load the component's code.
sbb_clock:

# The component takes colors as color: objects, not as hex numbers.
color:
  - id: col_ink
    hex: FFFFFF
  - id: col_bg
    hex: "000000"
  - id: col_second
    hex: E74C3C

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
#  No block B/C here: the component reads time and temperature itself
#  on every render tick, and draws date/temperature/hands in one pass —
#  no separate sensor, script, or interval needed on this side any more.
lvgl:
  pages:
    - id: page_clock
      # By LVGL default the page is opaque WHITE and sits over the
      # bottom_layer — without this line it would be white on white.
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - sbb_clock:
            id: clock_face
            align: CENTER
            width: 240
            height: 240
            time_id: homeassistant_time
            foreground: col_ink
            background: col_bg
            second_hand_color: col_second
            render_interval: 100ms
            show_seconds: true
            # Verified real value (SBB/Mondaine "Stop2Go"): 58s sweep,
            # 2s pause at 12 — this is the component default, set here
            # only for visibility.
            second_hand_sweep: 58s
            show_ticks: true
            show_face: true
            show_date: true
            date_font: montserrat_16
            show_temperature: true
            temperature_sensor_id: s_aussentemp
            temperature_font: montserrat_16
