# =====================================================================
#  m5dial_pages/page_clock.yaml — page: Clock (SBB railway clock)
#  FRAM M5Dial Cockpit · page package
#
#  The clock widget itself (hand kinematics, Stop2Go sweep, ticks,
#  date/temperature rendering) lives in its own repo now, as a reusable
#  ESPHome external component — not FRAM-specific, so it doesn't belong
#  in this repo. This file is only the FRAM wiring around it: which
#  time/temperature source, page id, colors, bezel.
#  https://github.com/CzarofAK/m5dial_clock_sbb
#
#  Exception to design.md §6 (background always black, day/night is
#  brightness only): by day this page is white face / black hands,
#  matching the real SBB station clock — genuinely nicer than the dark
#  theme everywhere else, per design.md §6. That's too bright for a
#  dark cabin at night, so it inverts instead of just dimming: black
#  face / white hands, the look this page used before the switch to
#  this component. The header's `apply_daynight` script drives the
#  switch via `id(clock_face).set_night_mode(...)` — see the comment
#  there for the coupling that creates. The second hand stays red in
#  both modes either way (component behavior, matches the real clock).
#
#  `show_face: true` draws a filled circle in `background` with a
#  `foreground`-colored border (width scales with the radius, 3 px at
#  240x240) — this is what replaces the old page's separate bezel
#  object, no extra widget needed for it.
#
#  on_load poll (design.md §9): poll_clock forces a fresh push from HA
#  for weather.forecast_home (s_aussentemp, declared in
#  .m5dial_fram.yaml's shared header, not here -- the only entity this
#  page reads) on page_clock's own on_load trigger. Applied to every
#  page now, including ones that already tend to update promptly --
#  the call is cheap, and consistency beats guessing per page which
#  integrations are fast enough to skip.
# =====================================================================

script:
  - id: poll_clock
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: weather.forecast_home

external_components:
  - source:
      type: git
      url: https://github.com/CzarofAK/m5dial_clock_sbb
      ref: main
    refresh: 1d
    components: [sbb_clock]

# Marker key — without it ESPHome won't load the component's code.
sbb_clock:

# The component takes colors as color: objects, not as hex numbers.
# Day (default): white face, black ink -- the real SBB look. Night
# mode swaps these at runtime (set_night_mode(), see the header).
color:
  - id: col_ink
    hex: "000000"
  - id: col_bg
    hex: FFFFFF
  - id: col_second
    hex: E74C3C

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
#  No block B/C here beyond poll_clock above: the component reads time
#  and temperature itself on every render tick, and draws date/
#  temperature/hands in one pass — no separate sensor, drawing script,
#  or interval needed on this side for the clock itself any more.
lvgl:
  pages:
    - id: page_clock
      on_load:
        - script.execute: poll_clock
      # By LVGL default the page is opaque WHITE and sits over the
      # bottom_layer — without this line it would be white on white.
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - sbb_clock:
            id: clock_face
            align: CENTER
            width: 240
            height: 240
            time_id: homeassistant_time
            foreground: col_ink
            background: col_bg
            second_hand_color: col_second
            # Initial/day state; apply_daynight (header) flips this at
            # runtime via set_night_mode() -- see the header comment.
            night_mode: false
            render_interval: 100ms
            show_seconds: true
            # Verified real value (SBB/Mondaine "Stop2Go"): 58s sweep,
            # 2s pause at 12 — this is the component default, set here
            # only for visibility.
            second_hand_sweep: 58s
            show_ticks: true
            show_face: true
            show_date: true
            date_font: montserrat_16
            show_temperature: true
            temperature_sensor_id: s_aussentemp
            temperature_font: montserrat_16
