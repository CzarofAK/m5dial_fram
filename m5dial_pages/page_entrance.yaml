# =====================================================================
#  m5dial_pages/page_entrance.yaml — page: Entrance (step, door lock)
#  FRAM M5Dial Cockpit · page package
#
#  Real hardware, not the shape originally guessed:
#
#  Step (Trittstufe): no toggleable on/off state exists. The relay
#  board has two momentary pulse relays, RAUS (extend) and REIN
#  (retract), each auto-releasing after 4s -- so this is two fire-once
#  buttons, not one toggle. Status is approximate: the central AKTIV/
#  RUHE readout (lbl_entrance_step_state, y_main) is
#  binary_sensor.relay_4ch_step_step_out_engine_on and NOTHING else --
#  that's the one entity behind it. It reads OFF ("---" if HA has no
#  value for it at all, RUHE if it does) both when the step is
#  retracted AND when the ignition is off -- it can't tell those two
#  apart, that's the hardware's own limit, not a bug here. Shown as-is,
#  not invented into something more precise than the source data.
#
#  Lock (Zentralverriegelung, rear doors): no state entity exists at
#  all -- HA only has ZV status for the FRONT doors, via MercedesME,
#  which doesn't cover this lock. ZU/AUF are fire-only buttons calling
#  the relay board's own custom ESPHome services (esphome:
#  relay_4ch_step_zv_lock / _zv_unlock), same as the Homematic wall
#  switch does. No status readout is possible, so none is shown.
#
#  Layout (readability follow-up, 2nd pass): rows group by ACTION now,
#  not by device -- y_row is REIN + ZU (securing the vehicle: retract
#  the step, lock the doors -- what you'd do right before driving off,
#  matching the pre-flight-check overlay's own concern), y_row2 is
#  RAUS + AUF (the opposite: what you'd do on arrival). The previous
#  pass grouped by device instead (STUFE column / ZV column) -- traded
#  back for this because the two actions IN one row now share a
#  purpose, not just a device. The central AKTIV/RUHE readout stays
#  put; it's the page's only real telemetry, still not tied to either
#  row (STUFE's own state, shown regardless of which row you're
#  looking at).
#
#  Both rows use a literal x offset instead of ${x_col} (page-local
#  geometry, same reasoning as page_levelling's literal y:42 /
#  page_lights_outside's literal x:±48) -- x_col=40 was sized for
#  narrow text columns, not these buttons, and left them nearly
#  touching. y_row buttons are 76x30 at x:±48 (~106px corner radius);
#  y_row2 buttons are smaller, 64x24 at x:±42 (~117px corner radius,
#  design.md §3: y_row2 sits further out, needs to stay smaller to
#  clear the round display's r=120 limit).
#
#  No double-click shortcut on this page, unlike most others (design
#  feedback: double-click should reach a page's fixed settings too,
#  not just SET) -- deliberately: none of these four actions is safely
#  "the" one worth a quick double-click while driving, and door
#  lock/step while moving is exactly the kind of thing design.md
#  §14's open item about MP OFF/RETRACT already flags as needing a
#  deliberate confirmation, not a fast gesture. Touch only for now.
#
#  on_load poll (design.md §9): HA only pushes an entity's CURRENT
#  value to this device at API-connect time if HA already has one --
#  an entity that's still unknown/unavailable at that moment sends
#  nothing, and then only catches up whenever it next changes on its
#  own. poll_entrance calls homeassistant.update_entity on
#  page_entrance's own on_load trigger, forcing a fresh push of the
#  one entity that matters here every time this page is shown.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
binary_sensor:
  # See header note: OFF means "step in" OR "ignition off", not
  # distinguishable from this sensor alone.
  - platform: homeassistant
    id: s_entrance_step_active
    entity_id: binary_sensor.relay_4ch_step_step_out_engine_on
    on_state:
      - script.execute: draw_entrance

script:
  # Forces a fresh push from HA for this page's entity -- called from
  # page_entrance's own on_load trigger below. See header re: why.
  - id: poll_entrance
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: binary_sensor.relay_4ch_step_step_out_engine_on

  - id: act_entrance_step_out
    then:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.relay_4ch_step_relay_step_out

  - id: act_entrance_step_in
    then:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.relay_4ch_step_relay_step_in

  - id: act_entrance_lock
    then:
      - homeassistant.service:
          service: esphome.relay_4ch_step_zv_lock

  - id: act_entrance_unlock
    then:
      - homeassistant.service:
          service: esphome.relay_4ch_step_zv_unlock

  - id: draw_entrance
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_entrance_step_state
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_entrance_step_active).has_state()) return std::string("---");
            return id(s_entrance_step_active).state ? std::string("AKTIV") : std::string("RUHE");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_entrance_step_active).has_state()) return lv_color_hex(0x555555);
            return id(s_entrance_step_active).state ? lv_color_hex(0x2ECC71)
                                               : lv_color_hex(0xBDC1C6);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_entrance

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_entrance
      on_load:
        - script.execute: poll_entrance
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_entrance_cap
            align: CENTER
            y: ${y_cap}
            text: "STUFE"
            text_font: font_12
            text_color: 0x555555
        - label:
            id: lbl_entrance_step_state
            align: CENTER
            y: ${y_main}
            text: "---"
            text_font: font_40
            text_color: 0x555555

        # ---- Row 1: securing (REIN + ZU) -----------------------------
        - button:
            id: btn_entrance_step_in
            align: CENTER
            x: -48
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "REIN"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_step_in
        - button:
            id: btn_entrance_lock
            align: CENTER
            x: 48
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "ZU"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_lock

        # ---- Row 2: arriving (RAUS + AUF) -----------------------------
        - button:
            id: btn_entrance_step_out
            align: CENTER
            x: -42
            y: ${y_row2}
            width: 64
            height: 24
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "RAUS"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_step_out
        - button:
            id: btn_entrance_unlock
            align: CENTER
            x: 42
            y: ${y_row2}
            width: 64
            height: 24
            radius: 12
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "AUF"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_unlock
