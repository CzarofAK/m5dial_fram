# =====================================================================
#  m5dial_pages/page_entrance.yaml — page: Entrance (step, door lock)
#  FRAM M5Dial Cockpit · page package
#
#  Real hardware, corrected in three rounds:
#
#  Step (Trittstufe): no toggleable on/off state exists -- REIN
#  (retract) and RAUS (extend) are fire-once momentary actions, not a
#  toggle. 2nd correction (now itself reverted, see 3rd below): the
#  relay switches originally guessed, switch.relay_4ch_step_relay_step_
#  in/_out, were reported as not working, so this page was switched to
#  press two `input_button` helpers instead -- input_button.zv_lock_
#  button (REIN) / input_button.zv_unlock_button (RAUS) -- which then
#  turned out to do nothing at all (no motor sound, no reaction).
#
#  3rd correction, from the relay-4ch-step device's own ESPHome source
#  (obtained directly, not re-guessed): it defines exactly two GPIO
#  switches for the step -- relay_step_in (GPIO14) and relay_step_out
#  (GPIO16) -- each wired `on_turn_on: delay 4s -> turn_off`, i.e.
#  already self-resetting momentary relays; turn_on is the whole
#  interaction, nothing here needs to turn them off again. Those are
#  the switch.relay_4ch_step_relay_step_in/_out entities from the 2nd
#  correction above -- the ORIGINAL guess was right. The device source
#  has no `input_button` anywhere: those two helpers are ordinary HA
#  helper entities with no automation behind them, so pressing one
#  (however it's pressed, dial or HA UI alike) only updates the
#  helper's own state and drives no hardware -- silence was the
#  correct, expected result of the 2nd correction, not a fluke. Why the
#  switches were reported broken before is unresolved (a bad test, a
#  transient issue, or something in the relay-4ch-step device unrelated
#  to these two switches -- e.g. it also auto-retracts via
#  binary_sensor.step_out_engine_on -> switch.turn_on: relay_step_in on
#  that device, which could look like RAUS "not working" if the
#  ignition state fought it during a test); the switches themselves are
#  confirmed straight from the firmware now, so back to those, this
#  time on firmer ground than a remembered "user-confirmed."
#
#  Turned on via homeassistant.service (matching every other page and
#  design_rules.md §9's own documented pattern -- the previous round's
#  homeassistant.action was a one-off deviation, not a deliberate
#  choice, and not what made the input_button calls silent anyway).
#
#  Lock (Zentralverriegelung, rear doors): no state entity exists at
#  all -- HA only has ZV status for the FRONT doors, via MercedesME,
#  which doesn't cover this lock. ZU/AUF are fire-only buttons calling
#  the relay board's own custom ESPHome services (esphome:
#  relay_4ch_step_zv_lock / _zv_unlock), same as the Homematic wall
#  switch does -- user-confirmed these already work, untouched here.
#  No status readout is possible for this one either.
#
#  STUFE status readout REMOVED (user decision): this page used to
#  show a central AKTIV/RUHE readout off
#  binary_sensor.relay_4ch_step_step_out_engine_on, but that entity
#  reads OFF both when the step is retracted AND when the ignition is
#  off (can't tell those two apart, a hardware limit) -- and the
#  actually load-bearing case (step still out while the ignition is on)
#  is already covered by the pre-flight-check overlay
#  (overlay_preflight.yaml). Kept as a redundant, imprecise readout
#  wasn't worth the screen space once that overlap was pointed out, so
#  it's gone: no more s_entrance_step_active binary_sensor, no more
#  poll of that entity, no more y_cap/y_main content on this page at
#  all.
#
#  Layout, redesigned now that the STUFE readout is gone (user report:
#  "button gleich gross und schön vertikal mittig" -- uniform size,
#  nicely vertically centered, echoing the same ask made for
#  page_lights_outside.yaml): a plain 2x2 grid, ALL FOUR buttons the
#  same 76x30/radius15 size (the shared design.md §8 "two buttons"
#  spec, not a page-specific size any more), symmetric about true
#  center (y:∓22, x:∓56 -- corner radius ≈101.0, comfortably clear of
#  r=120) instead of the old two-different-sized-rows-below-center
#  layout the STUFE readout used to force. Rows still group by ACTION,
#  not by device (unchanged from the previous pass): top row REIN + ZU
#  (securing the vehicle -- what you'd do right before driving off,
#  matching the pre-flight-check overlay's own concern), bottom row
#  RAUS + AUF (the opposite, arriving). Literal x/y (not
#  ${x_col}/${y_row}/${y_row2}) -- page-local geometry, same reasoning
#  as page_levelling's literal y:42 / page_lights_outside's literal
#  x:±60: this page no longer uses the shared main-value grid at all,
#  so there's nothing to line up with.
#
#  No double-click shortcut on this page, unlike most others (design
#  feedback: double-click should reach a page's fixed settings too,
#  not just SET) -- deliberately: none of these four actions is safely
#  "the" one worth a quick double-click while driving, and door
#  lock/step while moving is exactly the kind of thing design.md
#  §14's open item about MP OFF/RETRACT already flags as needing a
#  deliberate confirmation, not a fast gesture. Touch only for now.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
script:
  - id: act_entrance_step_in
    then:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.relay_4ch_step_relay_step_in

  - id: act_entrance_step_out
    then:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.relay_4ch_step_relay_step_out

  - id: act_entrance_lock
    then:
      - homeassistant.service:
          service: esphome.relay_4ch_step_zv_lock

  - id: act_entrance_unlock
    then:
      - homeassistant.service:
          service: esphome.relay_4ch_step_zv_unlock

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_entrance
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        # ---- Row 1 (y:-22): securing (REIN + ZU) ----------------------
        - button:
            id: btn_entrance_step_in
            align: CENTER
            x: -56
            y: -22
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "Step In"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_step_in
        - button:
            id: btn_entrance_lock
            align: CENTER
            x: 56
            y: -22
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "Lock"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_lock

        # ---- Row 2 (y:+22): arriving (RAUS + AUF) ----------------------
        - button:
            id: btn_entrance_step_out
            align: CENTER
            x: -56
            y: 22
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "Step Out"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_step_out
        - button:
            id: btn_entrance_unlock
            align: CENTER
            x: 56
            y: 22
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  align: CENTER
                  text: "Unlock"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_entrance_unlock
