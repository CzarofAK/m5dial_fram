# =====================================================================
#  m5dial_pages/page_lights_outside.yaml — page: Outside lights
#  FRAM M5Dial Cockpit · page package
#
#  PLACEHOLDER ENTITIES — entrance light and awning light (both
#  dimmable per design.md §15), light.PLACEHOLDER_* below.
#
#  Dimming itself isn't exposed here: the dial has no slider convention
#  (design.md has none either — only arcs, buttons, labels), so this
#  is on/off only, like every other two-button page. If per-light
#  brightness control is actually wanted from the dial, that's a new
#  widget type to design first, not something to improvise here.
#
#  Two-column layout (design.md §3) without arcs, same shape as
#  page_levelling.yaml: y_cap names the light, the button below it
#  is the control -- there's no y_main/y_line2 value to show besides
#  on/off, which already lives on the button label.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: s_lights_entrance
    entity_id: light.PLACEHOLDER_eingang
    on_state:
      - script.execute: draw_lights_outside
  - platform: homeassistant
    id: s_lights_awning
    entity_id: light.PLACEHOLDER_markise
    on_state:
      - script.execute: draw_lights_outside

script:
  - id: act_lights_entrance
    then:
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.PLACEHOLDER_eingang

  - id: act_lights_awning
    then:
      - homeassistant.service:
          service: light.toggle
          data:
            entity_id: light.PLACEHOLDER_markise

  - id: draw_lights_outside
    mode: restart
    then:
      # ---- Entrance light -----------------------------------------
      - lvgl.label.update:
          id: lbl_lights_entrance
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_lights_entrance).has_state()) return std::string("---");
            return id(s_lights_entrance).state ? std::string("EIN") : std::string("AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_lights_entrance).has_state()) return lv_color_hex(0x555555);
            return id(s_lights_entrance).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_lights_entrance
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_lights_entrance).has_state()) return lv_color_hex(0x202124);
            return id(s_lights_entrance).state ? lv_color_hex(0x1B5E3A)
                                        : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_lights_entrance).has_state()) return lv_color_hex(0x3C4043);
            return id(s_lights_entrance).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0x3C4043);

      # ---- Awning light -----------------------------------------
      - lvgl.label.update:
          id: lbl_lights_awning
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_lights_awning).has_state()) return std::string("---");
            return id(s_lights_awning).state ? std::string("EIN") : std::string("AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_lights_awning).has_state()) return lv_color_hex(0x555555);
            return id(s_lights_awning).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_lights_awning
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_lights_awning).has_state()) return lv_color_hex(0x202124);
            return id(s_lights_awning).state ? lv_color_hex(0x1B5E3A)
                                        : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_lights_awning).has_state()) return lv_color_hex(0x3C4043);
            return id(s_lights_awning).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0x3C4043);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_lights_outside

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_lights_outside
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_lights_cap_entrance
            align: CENTER
            x: -${x_col}
            y: ${y_cap}
            text: "EINGANG"
            text_font: font_12
            text_color: 0x555555
        - button:
            id: btn_lights_entrance
            align: CENTER
            x: -${x_col}
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_lights_entrance
                  align: CENTER
                  text: "---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_lights_entrance

        - label:
            id: lbl_lights_cap_awning
            align: CENTER
            x: ${x_col}
            y: ${y_cap}
            text: "MARKISE"
            text_font: font_12
            text_color: 0x555555
        - button:
            id: btn_lights_awning
            align: CENTER
            x: ${x_col}
            y: ${y_row}
            width: 76
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_lights_awning
                  align: CENTER
                  text: "---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_lights_awning
