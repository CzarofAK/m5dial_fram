# =====================================================================
#  m5dial_pages/page_lights_outside.yaml — page: Outside lights
#  FRAM M5Dial Cockpit · page package
#
#  Real entities, not the light-domain placeholders originally
#  guessed (design.md §15 flagged both as unverified) -- both are
#  plain switches, not the `light` domain, so the service calls below
#  are switch.turn_on/_off/toggle, not light.*:
#
#  EINGANG (entrance): TWO switches, not one -- switch.light_pir (the
#  PIR-triggered entrance light) and switch.light_step (the step
#  light). Read and driven as one group: the button shows EIN if
#  EITHER is on, and toggling always drives both to the SAME target
#  state (both on, or both off) rather than toggling each
#  independently -- a mixed on/off state would otherwise be
#  unreachable from one button and confusing to read.
#
#  MARKISE (awning): one switch, switch.shelly1g4_7c2c6772123c.
#
#  Dimming isn't exposed here: the dial has no slider convention
#  (design.md has none either — only arcs, buttons, labels), and these
#  turned out to be switches, not dimmable lights anyway, so on/off is
#  the whole story now, not a deliberate simplification of something
#  richer.
#
#  Two-column layout (design.md §3) without arcs, same shape as
#  page_levelling.yaml: y_cap names the light, the button below it
#  is the control -- there's no y_main/y_line2 value to show besides
#  on/off, which already lives on the button label.
#
#  Layout (readability follow-up: the two-switch template read as too
#  sparse and too cramped at once). x_col=40 is meant for narrow TEXT
#  columns (gas/water's percentages) -- at a 76px-wide BUTTON it left
#  only a 4px gap between the two, close enough to misregister a tap
#  on the wrong one. Widened to a literal x:±48 (not ${x_col}, same
#  reasoning as page_levelling's literal y:42 -- a page-local geometry
#  choice, not a shared grid constant, kept inside the round display's
#  r=120 limit even at the button's far corner) and the buttons grew
#  to 76x32 -- a bigger, clearer touch target, which also matters more
#  now that double-click can trigger these too (see below) and touch
#  should feel like the equally-sized sibling of that, not an
#  afterthought.
#
#  Double-click on the physical front button cycles between the two
#  switches (.m5dial_fram.yaml's double-click handler -- home is
#  long-press-only here now): 1st click toggles EINGANG, 2nd toggles
#  MARKISE, 3rd back to EINGANG. Same reasoning as page_fans.yaml's
#  FANBOARD/HVAC cycle -- haptic control while driving, touch while
#  parked, both always available.
#
#  on_load poll (design.md §9): HA only pushes an entity's CURRENT
#  value to this device at API-connect time if HA already has one --
#  an entity that's still unknown/unavailable at that moment sends
#  nothing, and then only catches up whenever it next changes on its
#  own. poll_lights_outside calls homeassistant.update_entity per
#  entity on page_lights_outside's own on_load trigger, forcing a
#  fresh push every time this page is actually shown.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
globals:
  # Double-click cycle position (.m5dial_fram.yaml's
  # dc_lights_outside_cycle): 0 = toggle EINGANG next, 1 = toggle
  # MARKISE next.
  - id: g_lights_outside_dc_pos
    type: int
    restore_value: false
    initial_value: "0"

binary_sensor:
  - platform: homeassistant
    id: s_lights_entrance_pir
    entity_id: switch.light_pir
    on_state:
      - script.execute: draw_lights_outside
  - platform: homeassistant
    id: s_lights_entrance_step
    entity_id: switch.light_step
    on_state:
      - script.execute: draw_lights_outside
  - platform: homeassistant
    id: s_lights_awning
    entity_id: switch.shelly1g4_7c2c6772123c
    on_state:
      - script.execute: draw_lights_outside

script:
  # Forces a fresh push from HA for this page's entities -- called
  # from page_lights_outside's own on_load trigger below. See header
  # re: why.
  - id: poll_lights_outside
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.light_pir
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.light_step
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.shelly1g4_7c2c6772123c

  # Any-on-reads-on, toggle-drives-both-the-same-way -- see header.
  # Two separate homeassistant.service calls, not one call with a YAML
  # list under entity_id: -- ESPHome's data:/data_template: values must
  # be plain strings, a list there is a hard config error ("Must be
  # string, got EList").
  - id: act_lights_entrance
    then:
      - if:
          condition:
            lambda: |-
              return (id(s_lights_entrance_pir).has_state() && id(s_lights_entrance_pir).state) ||
                     (id(s_lights_entrance_step).has_state() && id(s_lights_entrance_step).state);
          then:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.light_pir
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.light_step
          else:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.light_pir
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.light_step

  - id: act_lights_awning
    then:
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.shelly1g4_7c2c6772123c

  # Called by .m5dial_fram.yaml's double-click handler -- see header.
  - id: dc_lights_outside_cycle
    then:
      - if:
          condition:
            lambda: return id(g_lights_outside_dc_pos) == 0;
          then:
            - script.execute: act_lights_entrance
          else:
            - script.execute: act_lights_awning
      - globals.set:
          id: g_lights_outside_dc_pos
          value: !lambda "return (id(g_lights_outside_dc_pos) + 1) % 2;"

  - id: draw_lights_outside
    mode: restart
    then:
      # ---- Entrance light (either switch on = EIN) -------------------
      - lvgl.label.update:
          id: lbl_lights_entrance
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_lights_entrance_pir).has_state() || !id(s_lights_entrance_step).has_state())
              return std::string("---");
            bool on = id(s_lights_entrance_pir).state || id(s_lights_entrance_step).state;
            return on ? std::string("EIN") : std::string("AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_lights_entrance_pir).has_state() || !id(s_lights_entrance_step).has_state())
              return lv_color_hex(0x555555);
            bool on = id(s_lights_entrance_pir).state || id(s_lights_entrance_step).state;
            return on ? lv_color_hex(0x2ECC71) : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_lights_entrance
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_lights_entrance_pir).has_state() || !id(s_lights_entrance_step).has_state())
              return lv_color_hex(0x202124);
            bool on = id(s_lights_entrance_pir).state || id(s_lights_entrance_step).state;
            return on ? lv_color_hex(0x1B5E3A) : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_lights_entrance_pir).has_state() || !id(s_lights_entrance_step).has_state())
              return lv_color_hex(0x3C4043);
            bool on = id(s_lights_entrance_pir).state || id(s_lights_entrance_step).state;
            return on ? lv_color_hex(0x2ECC71) : lv_color_hex(0x3C4043);

      # ---- Awning light -----------------------------------------
      - lvgl.label.update:
          id: lbl_lights_awning
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---");
            #endif
            if (!id(s_lights_awning).has_state()) return std::string("---");
            return id(s_lights_awning).state ? std::string("EIN") : std::string("AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_lights_awning).has_state()) return lv_color_hex(0x555555);
            return id(s_lights_awning).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_lights_awning
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (!id(s_lights_awning).has_state()) return lv_color_hex(0x202124);
            return id(s_lights_awning).state ? lv_color_hex(0x1B5E3A)
                                        : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (!id(s_lights_awning).has_state()) return lv_color_hex(0x3C4043);
            return id(s_lights_awning).state ? lv_color_hex(0x2ECC71)
                                        : lv_color_hex(0x3C4043);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_lights_outside

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_lights_outside
      on_load:
        - script.execute: poll_lights_outside
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_lights_cap_entrance
            align: CENTER
            x: -48
            y: ${y_cap}
            text: "EINGANG"
            text_font: font_12
            text_color: 0x555555
        - button:
            id: btn_lights_entrance
            align: CENTER
            x: -48
            y: ${y_row}
            width: 76
            height: 32
            radius: 16
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_lights_entrance
                  align: CENTER
                  text: "---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_lights_entrance

        - label:
            id: lbl_lights_cap_awning
            align: CENTER
            x: 48
            y: ${y_cap}
            text: "MARKISE"
            text_font: font_12
            text_color: 0x555555
        - button:
            id: btn_lights_awning
            align: CENTER
            x: 48
            y: ${y_row}
            width: 76
            height: 32
            radius: 16
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_lights_awning
                  align: CENTER
                  text: "---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_lights_awning
