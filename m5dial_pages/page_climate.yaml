# =====================================================================
#  m5dial_pages/page_climate.yaml — page: Climate (room heating)
#  FRAM M5Dial Cockpit · page package
#
#  AC/aircon isn't installed yet (design.md §15), so this page is the
#  room-heating side of the Truma Combi 4 (gas only, no electric
#  element).
#
#  Real integration, not the truma_inetbox guess this page originally
#  assumed (that component/entity-naming guess was simply wrong --
#  there's no separate ESP32 running it): the real path is a MQTT-
#  based "womolin_controller" integration --
#    switch.womolin_controller_mqtt_activate_room_heater             on/off gate
#    climate.womolin_controller_mqtt_truma_room                      current temp (attribute)
#    number.womolin_controller_mqtt_target_room_temperature          target temp
#  The activate switch must be ON before either entity carries live
#  values at all -- until then it's simply unavailable, same as any
#  other HA entity behind a powered-off device. Expect real lag after
#  any change (on the switch, or the target temperature): the
#  underlying Truma panel talks LIN, ca. 2-4s round trip, not
#  something to work around here.
#
#  Current room temperature still comes off the climate entity's own
#  current_temperature attribute (no separate sensor entity for it).
#  Target temperature, 2nd correction (user-confirmed, same fix as
#  page_boiler.yaml -- see that file's header for the fuller
#  rationale): originally assumed the climate entity's own
#  `temperature` attribute + climate.set_temperature, on the belief
#  that "number.set_value doesn't apply to a climate entity's
#  setpoint" -- true, but beside the point, since the integration
#  exposes the target as its OWN first-class number entity instead of
#  routing it through the climate entity at all. That mismatch is the
#  likely cause of a real "Can't convert 'None' to number!" warning
#  seen against the sibling climate.womolin_controller_mqtt_truma_water
#  entity. Reads via `sensor: platform: homeassistant` on the number
#  entity directly (no `attribute:` needed) and writes via
#  number.set_value, not climate.set_temperature.
#
#  OPEN ITEM: fan mode/level and a fault flag both existed on the old
#  (wrong) truma_inetbox assumption; dropped here rather than guessed
#  again under the real integration. If the womolin_controller climate
#  entity exposes fan_mode/fan_modes or an error attribute, add them
#  back once confirmed -- not before, that's exactly the kind of
#  unverified entity_id design.md §15 warns about.
#
#  Slots (design.md §3):
#    y_main   21°C              montserrat_40 — current room temp
#    y_line2  SOLL 22°C         montserrat_16 — target temperature
#    y_row    one button        104 x 30 — HEIZUNG on/off
#    y_row2   one button        SOLL, arms room temp for the encoder
#    y_footer status line       montserrat_12 — "turn to adjust" hint
#                                while armed
#
#  Row-2 button labelled SOLL, not the generic "SET" it had before
#  (readability follow-up: next to "HEIZ EIN/AUS" it wasn't clear
#  which button was power and which was temperature) -- matches the
#  SOLL line it arms, same fix as page_boiler.yaml.
#
#  Room temp is encoder-adjustable (design.md §14, g_edit_target
#  target 3 in .m5dial_fram.yaml) via the SOLL button. Refuses to arm
#  while HEIZUNG is off: per Truma, a target set while off doesn't
#  take effect, so this blocks arming rather than letting the encoder
#  silently do nothing.
#
#  Double-click on the physical front button cycles this page's two
#  actions (.m5dial_fram.yaml's double-click handler -- home is
#  long-press-only here now): 1st click arms room temp (same as SET),
#  2nd toggles HEIZUNG, 3rd back to arming, and so on -- lets HEIZUNG
#  itself be reached without touching the screen too, not just the
#  temperature (design feedback: haptic control matters while driving,
#  touch works fine parked, so both stay available always).
#
#  Encoder feel: same lag fix as page_power_2.yaml (see that file's
#  header) -- adjusts a local g_climate_temp_pending value and redraws
#  from it immediately, only calling number.set_value once the
#  encoder's quiet for 400ms (or immediately on disarm). The Truma's
#  own ~2-4s lag is unchanged and unavoidable, but the number now
#  tracks the knob instead of the (slow) confirmation.
#
#  Two more lag fixes, both about the DIAL not adding its own delay on
#  top of the Truma's (user feedback: the Truma lag alone is already
#  tedious from HA, doubling it via the dial made it "ungeniessbar"):
#
#  1. SOLL is now ALWAYS rendered from g_climate_temp_pending, armed or
#     not -- not just while armed. Disarming used to fall back to
#     s_climate_target's last CONFIRMED value, which is exactly what's
#     still stale for the next 2-4s after you just changed it -- so
#     the line would visibly jump back to the old number right as you
#     let go, before slowly catching up again. Now pending stays
#     authoritative always; s_climate_target's on_value only resyncs
#     it while NOT armed (never fighting an active edit), which is a
#     no-op once the Truma actually confirms what was asked, and
#     otherwise keeps pending accurate for the next time SOLL is
#     tapped. g_climate_temp_known gates the "---" placeholder
#     (nothing shown/armed yet) since a plain float can't tell "0" from
#     "never initialized".
#  2. The HEIZ button used to wait for switch.womolin_controller_mqtt_
#     activate_room_heater's own confirmation (on_state) before its
#     label/color moved at all -- another real round trip stacked on
#     top of the Truma one. Now flips a local optimistic guess the
#     instant it's tapped (g_climate_heater_optimistic) and shows THAT
#     until the real switch state reports in, which then simply takes
#     back over (g_climate_heater_optimistic_valid goes false on
#     s_climate_heater_on's own on_state) -- self-corrects if the
#     guess was wrong, costs nothing if it wasn't.
#
#  Interlock (user report, new standard -- also applies to
#  page_boiler.yaml, and to any future AC control the same way): SOLL
#  is only actually USABLE while the heater is CONFIRMED on -- not
#  merely shown as on via the optimistic guess above. Before this fix,
#  arming was already guarded by the confirmed state (below), but
#  nothing stopped an ALREADY-armed SOLL from staying armed once the
#  heater's confirmed state flipped back to off (manually, or from
#  elsewhere in HA) -- the encoder kept "working" and kept writing a
#  target the Truma was no longer listening to, which is exactly the
#  "riesen Durcheinander" reported: everything looked adjustable, none
#  of it visibly did anything. Now:
#  1. s_climate_heater_on's on_state auto-disarms (flushes the pending
#     write first) the moment the CONFIRMED state goes to off while
#     target 3 is armed -- the encoder then falls back to page
#     navigation instead of quietly editing a locked-out target.
#  2. btn_climate_temp_set/lbl_climate_temp_set (draw_climate) render a
#     third, visually distinct LOCKED state (dim border, dim label)
#     whenever the heater isn't confirmed on -- previously this looked
#     identical to the normal idle/available state, so tapping it did
#     nothing with no visible reason why.
#  3. The footer shows "HEIZUNG STARTET" during the specific window
#     where the optimistic guess already says on but the real
#     confirmation hasn't arrived yet -- the one case a driver could
#     otherwise read as "broken" rather than "still confirming".
#  4. dc_climate_cycle (below) only advances past its "arm" step once
#     arming actually happened -- the old version advanced regardless,
#     so double-clicking again during the confirmation lag called
#     act_climate_heater next and flip-flopped the heater on/off for as
#     long as the lag lasted.
#
#  on_load poll (design.md §9): HA only pushes an entity's CURRENT
#  value to this device at API-connect time if HA already has one --
#  an entity that's still unknown/unavailable at that moment sends
#  nothing, and then only catches up whenever it next changes on its
#  own (which, for something like a slow-polling integration, can be a
#  long wait -- reported as pages sitting on "---" until unrelated
#  interaction happened to trigger a state change). poll_climate calls
#  homeassistant.update_entity per entity on page_climate's own
#  on_load trigger, forcing a fresh push every time this page is
#  actually shown, rather than a background timer running for a page
#  nobody's looking at.
# =====================================================================

# ---------------------------------------------------------------------
#  C  Bindings
# ---------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: s_climate_room_temp
    entity_id: climate.womolin_controller_mqtt_truma_room
    attribute: current_temperature
    on_value:
      - script.execute: draw_climate
  - platform: homeassistant
    id: s_climate_target
    entity_id: number.womolin_controller_mqtt_target_room_temperature
    on_value:
      # Resync pending from the confirmed value, but only while NOT
      # armed -- never fight an active edit. See header re: lag.
      - if:
          condition:
            lambda: return id(g_edit_target) != 3;
          then:
            - lambda: |-
                id(g_climate_temp_pending) = id(s_climate_target).state;
                id(g_climate_temp_known) = true;
      - script.execute: draw_climate

binary_sensor:
  - platform: homeassistant
    id: s_climate_heater_on
    entity_id: switch.womolin_controller_mqtt_activate_room_heater
    on_state:
      # Real state just arrived -- stop trusting the optimistic guess.
      - globals.set:
          id: g_climate_heater_optimistic_valid
          value: "false"
      # Interlock (user report: turning HEIZUNG on/off from the dial
      # let SOLL keep being adjusted the whole time the Truma took to
      # confirm, and the resulting writes just silently did nothing --
      # "riesen Durcheinander"). SOLL's arm button already refused to
      # ARM while not confirmed-on (act_climate_arm_temp's own guard,
      # below); this closes the other half: if it was already armed
      # and the CONFIRMED state just went to off, disarm it right now
      # instead of leaving the encoder live on a target that can't
      # take effect any more. Flushes any not-yet-sent edit first, same
      # as a manual disarm would.
      - if:
          condition:
            lambda: |-
              return id(g_edit_target) == 3 &&
                     !(id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state);
          then:
            - lambda: |-
                id(climate_temp_write_debounced)->stop();
                id(climate_temp_write_now)->execute();
                id(g_edit_target) = 0;
      - script.execute: draw_climate

globals:
  # Page-local (design.md §3's "On/off-only pages" precedent for
  # page-local globals applies here too): the temp being dialed while
  # armed, ahead of what HA's confirmed back (and long ahead of what
  # the Truma's actually done -- see header re: lag). Kept in sync
  # from s_climate_target while not armed too, not just while turning
  # the encoder -- see header, this is the fix for SOLL jumping back
  # to a stale value right after disarming.
  - id: g_climate_temp_pending
    type: float
    restore_value: false
    initial_value: "20"

  # Gates the "---" placeholder -- g_climate_temp_pending can't be
  # told apart from "genuinely 20°C" on its own.
  - id: g_climate_temp_known
    type: bool
    restore_value: false
    initial_value: "false"

  # Optimistic HEIZ state shown instantly on tap, ahead of
  # s_climate_heater_on's own confirmation -- see header re: lag.
  - id: g_climate_heater_optimistic
    type: bool
    restore_value: false
    initial_value: "false"
  - id: g_climate_heater_optimistic_valid
    type: bool
    restore_value: false
    initial_value: "false"

  # Double-click cycle position (.m5dial_fram.yaml's dc_climate_cycle
  # calls this page's actions in turn): 0 = arm temp SET next, 1 =
  # toggle HEIZUNG next.
  - id: g_climate_dc_pos
    type: int
    restore_value: false
    initial_value: "0"

script:
  # Forces a fresh push from HA for this page's entities -- called
  # from page_climate's own on_load trigger below. See header re: why.
  - id: poll_climate
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: climate.womolin_controller_mqtt_truma_room
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.womolin_controller_mqtt_activate_room_heater
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: number.womolin_controller_mqtt_target_room_temperature

  - id: act_climate_heater
    then:
      - lambda: |-
          bool cur = id(g_climate_heater_optimistic_valid)
              ? id(g_climate_heater_optimistic)
              : (id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state);
          id(g_climate_heater_optimistic) = !cur;
          id(g_climate_heater_optimistic_valid) = true;
      - script.execute: draw_climate
      - homeassistant.service:
          service: switch.toggle
          data:
            entity_id: switch.womolin_controller_mqtt_activate_room_heater

  # Room temp (target 3): refuses to arm while the heater's off -- per
  # Truma, a target set while off doesn't take (nothing rejects the HA
  # call, it just has no effect on the device), so arming is blocked
  # here rather than letting the encoder silently do nothing once
  # armed.
  - id: act_climate_arm_temp
    then:
      - if:
          condition:
            lambda: return id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state;
          then:
            - lambda: |-
                bool was_armed = (id(g_edit_target) == 3);
                id(g_edit_target) = was_armed ? 0 : 3;
                if (!was_armed) {
                  id(g_climate_temp_pending) = id(s_climate_target).has_state() ? id(s_climate_target).state : 20.0f;
                  id(g_climate_temp_known) = true;
                } else {
                  id(climate_temp_write_debounced)->stop();
                  id(climate_temp_write_now)->execute();
                }
      - script.execute: draw_climate

  # Called by .m5dial_fram.yaml's double-click handler -- see header.
  # Interlock follow-up: position only advances past the "arm" step
  # when arming actually happened (heater confirmed on) -- the old
  # version advanced unconditionally, so double-clicking again while
  # the Truma was still confirming a just-requested "on" would call
  # act_climate_heater next, i.e. toggle it straight back off, and the
  # cycle after that would toggle it back on again, and so on for as
  # long as the confirmation lag lasted. Now a blocked arm attempt
  # just retries the same step next time instead.
  - id: dc_climate_cycle
    then:
      - if:
          condition:
            lambda: return id(g_climate_dc_pos) == 0;
          then:
            - if:
                condition:
                  lambda: return id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state;
                then:
                  - script.execute: act_climate_arm_temp
                  - globals.set:
                      id: g_climate_dc_pos
                      value: "1"
          else:
            - script.execute: act_climate_heater
            - globals.set:
                id: g_climate_dc_pos
                value: "0"

  # 1°C step, clamped 5-30 (a guess at a sane range, not the Truma's
  # actual documented min/max -- verify on the device).
  - id: act_climate_temp_up
    then:
      - lambda: |-
          float v = id(g_climate_temp_pending) + 1.0f;
          if (v > 30.0f) v = 30.0f;
          id(g_climate_temp_pending) = v;
      - script.execute: draw_climate
      - script.execute: climate_temp_write_debounced

  - id: act_climate_temp_down
    then:
      - lambda: |-
          float v = id(g_climate_temp_pending) - 1.0f;
          if (v < 5.0f) v = 5.0f;
          id(g_climate_temp_pending) = v;
      - script.execute: draw_climate
      - script.execute: climate_temp_write_debounced

  # The actual write, split from the debounce delay so disarming can
  # call it immediately (act_climate_arm_temp above).
  - id: climate_temp_write_now
    then:
      - homeassistant.service:
          service: number.set_value
          data:
            entity_id: number.womolin_controller_mqtt_target_room_temperature
          data_template:
            value: "{{ val }}"
          variables:
            val: !lambda "return str_sprintf(\"%.0f\", id(g_climate_temp_pending));"

  - id: climate_temp_write_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: climate_temp_write_now

  - id: draw_climate
    mode: restart
    then:
      # ---- Main value: current room temperature -----------------------
      - lvgl.label.update:
          id: lbl_climate_temp
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("---°C");
            #endif
            if (!id(s_climate_room_temp).has_state()) return std::string("---°C");
            return str_sprintf("%.0f°C", id(s_climate_room_temp).state);
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(s_climate_room_temp).has_state()) return lv_color_hex(0x555555);
            return lv_color_hex(0xFFFFFF);

      # ---- Secondary line: target temperature --------------------------
      - lvgl.label.update:
          id: lbl_climate_target
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("SOLL ---°C");
            #endif
            // Always the pending value, armed or not -- see header
            // re: lag (this is what stops SOLL jumping back to a
            // stale number right after disarming).
            if (!id(g_climate_temp_known)) return std::string("SOLL ---°C");
            return str_sprintf("SOLL %.0f°C", id(g_climate_temp_pending));
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (!id(g_climate_temp_known)) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Button: heater on/off --------------------------------
      # Optimistic (see header re: lag): trusts g_climate_heater_optimistic
      # right after a tap, until s_climate_heater_on's own on_state
      # clears _valid and hands authority back to the real state.
      - lvgl.label.update:
          id: lbl_climate_heater
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("HEIZ ---");
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? std::string("HEIZ EIN") : std::string("HEIZ AUS");
            }
            if (!id(s_climate_heater_on).has_state()) return std::string("HEIZ ---");
            return id(s_climate_heater_on).state ? std::string("HEIZ EIN")
                                          : std::string("HEIZ AUS");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0xBDC1C6);
            }
            if (!id(s_climate_heater_on).has_state()) return lv_color_hex(0x555555);
            return id(s_climate_heater_on).state ? lv_color_hex(0x2ECC71)
                                          : lv_color_hex(0xBDC1C6);
      - lvgl.widget.update:
          id: btn_climate_heater
          bg_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x202124);
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? lv_color_hex(0x1B5E3A) : lv_color_hex(0x202124);
            }
            if (!id(s_climate_heater_on).has_state()) return lv_color_hex(0x202124);
            return id(s_climate_heater_on).state ? lv_color_hex(0x1B5E3A)
                                          : lv_color_hex(0x202124);
          border_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x3C4043);
            #endif
            if (id(g_climate_heater_optimistic_valid)) {
              return id(g_climate_heater_optimistic) ? lv_color_hex(0x2ECC71) : lv_color_hex(0x3C4043);
            }
            if (!id(s_climate_heater_on).has_state()) return lv_color_hex(0x3C4043);
            return id(s_climate_heater_on).state ? lv_color_hex(0x2ECC71)
                                          : lv_color_hex(0x3C4043);

      # ---- Row 2: SET button, arms room temp (target 3) ----------------
      # Interlock (see binary_sensor's on_state and act_climate_arm_temp's
      # own guard): SOLL only actually works while the heater is
      # CONFIRMED on, not just optimistically shown as on. Three visual
      # states, not two -- unavailable/locked reads differently from
      # armed and from idle-but-usable, otherwise the button looks the
      # same whether or not tapping it does anything.
      - lvgl.widget.update:
          id: btn_climate_temp_set
          border_color: !lambda |-
            if (id(g_edit_target) == 3) return lv_color_hex(0x4A9EFF);
            if (!(id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state)) return lv_color_hex(0x2A2C2E);
            return lv_color_hex(0x3C4043);
      - lvgl.label.update:
          id: lbl_climate_temp_set
          text_color: !lambda |-
            if (id(g_edit_target) == 3) return lv_color_hex(0xBDC1C6);
            if (!(id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state)) return lv_color_hex(0x555555);
            return lv_color_hex(0xBDC1C6);

      # ---- Footer: edit-mode hint / interlock hint -----------------------
      - lvgl.label.update:
          id: lbl_climate_status
          text: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return std::string("KEINE VERBINDUNG");
            #endif
            if (id(g_edit_target) == 3) return std::string("DREHEN ZUM ÄNDERN");
            // Optimistic tap already shown, real confirmation still
            // pending -- SOLL is locked during this window (see
            // header), say so instead of leaving it unexplained.
            if (id(g_climate_heater_optimistic_valid) && id(g_climate_heater_optimistic) &&
                !(id(s_climate_heater_on).has_state() && id(s_climate_heater_on).state))
              return std::string("HEIZUNG STARTET");
            return std::string("");
          text_color: !lambda |-
            #ifdef USE_API
            if (!api_is_connected()) return lv_color_hex(0x555555);
            #endif
            return lv_color_hex(0x4A9EFF);

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: draw_climate

# ---------------------------------------------------------------------
#  D  Widgets
# ---------------------------------------------------------------------
lvgl:
  pages:
    - id: page_climate
      on_load:
        - script.execute: poll_climate
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_climate_temp
            align: CENTER
            y: ${y_main}
            text: "---°C"
            text_font: font_40
            text_color: 0x555555

        - label:
            id: lbl_climate_target
            align: CENTER
            y: ${y_line2}
            text: "SOLL ---°C"
            text_font: font_16
            text_color: 0x555555

        - button:
            id: btn_climate_heater
            align: CENTER
            y: ${y_row}
            width: 104
            height: 30
            radius: 15
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_climate_heater
                  align: CENTER
                  text: "HEIZ ---"
                  text_font: font_16
                  text_color: 0x555555
            on_click:
              - script.execute: act_climate_heater

        # ---- Row 2: SET, arms room temp (target 3) -----------------------
        - button:
            id: btn_climate_temp_set
            align: CENTER
            y: ${y_row2}
            width: 68
            height: 26
            radius: 13
            bg_color: 0x202124
            border_width: 1
            border_color: 0x3C4043
            widgets:
              - label:
                  id: lbl_climate_temp_set
                  align: CENTER
                  text: "SOLL"
                  text_font: font_16
                  text_color: 0xBDC1C6
            on_click:
              - script.execute: act_climate_arm_temp

        - label:
            id: lbl_climate_status
            align: BOTTOM_MID
            y: ${y_footer}
            text: ""
            text_font: font_12
            text_color: 0x555555
