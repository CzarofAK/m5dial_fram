# =====================================================================
#  .m5dial_fram.yaml — header for every M5 Dial in the FRAM
#  FRAM M5Dial Cockpit
#
#  Applies to EVERY dial in the FRAM. Contains everything that's wired
#  to the M5 Dial and that every page needs — but no page itself and
#  nothing that only applies to a single device.
#
#  The device name, the home page, and the page list therefore do NOT
#  live here, but in the _cockpit file. Otherwise a second dial in the
#  FRAM couldn't share this header.
#
#  Dot-prefixed like .basics.yaml, for the same reason: this file has
#  no `esphome.name:` of its own, but the ESPHome dashboard still
#  offered it as a flashable device when it sat here undotted -- a
#  leading dot keeps it out of that listing.
#
#  Assumes basics.yaml (already in the ESPHome directory and NOT
#  included from here). From there come wifi, api, ota, logger,
#  web_server, restart_button, and the time source
#  `homeassistant_time`.
#
#  This header is included by the device file
#  m5dial_fram_cockpit.yaml, which also brings in the pages.
#
#  NOTE: the pin assignment hasn't been checked against the device yet.
# =====================================================================

substitutions:
  # ---- Layout grid, design.md §3 ------------------------------------
  # Lives only here now. The pages inherit it.
  #
  # ${name}, ${friendly_name} and ${home_page} come from the _cockpit —
  # they're statements about ONE device, not about the model.
  y_main: "-20"
  y_line2: "15"
  y_row: "48"
  # Second button row, for pages that need two rows of buttons instead
  # of one (page_entrance: step + lock, four momentary actions total).
  # Tighter than y_row because the round display's r=120 limit (§1)
  # bites at this radius -- unverified on the device, check visually.
  y_row2: "78"
  y_footer: "-32"
  y_cap: "-42"
  x_col: "40"

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: apply_daynight

esp32:
  # `board: esp32s3` isn't a real PlatformIO board id (it's the chip
  # variant name, not a board) -- ESPHome rejects it as unknown and
  # asks for `variant:` instead. Matches M5's own example config
  # (docs.m5stack.com/en/homeassistant/kit/dial), which likewise has
  # no `board:` key at all.
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# =====================================================================
#  Hardware
# =====================================================================
i2c:
  - id: bus_int
    sda: GPIO11
    scl: GPIO12
    scan: true

spi:
  - id: bus_disp
    clk_pin: GPIO6
    mosi_pin: GPIO5

display:
  - platform: mipi_spi
    id: disp_main
    model: GC9A01A
    spi_id: bus_disp
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    dimensions:
      width: 240
      height: 240
    # The GC9A01A glass in the M5Dial is mounted inverted. Without this
    # line every color arrives as its complementary color: green turns
    # pink, red turns green. Documented that way in M5's own guide for
    # the Dial with mipi_spi (docs.m5stack.com/en/homeassistant/kit/dial),
    # there alongside data_rate: 40MHz.
    invert_colors: true
    data_rate: 40MHz
    auto_clear_enabled: false
    # rotation does NOT belong here as long as LVGL is active —
    # it belongs in the lvgl block.

# The touch controller is an FT3267 and runs over the ft5x06 platform at
# address 0x38. NO interrupt_pin: the M5Dial reference config has GPIO14
# explicitly commented out — without the pin it's polled instead.
# With interrupt_pin, the first flash produced:
#   [E][component:143]: touchscreen is marked FAILED: unspecified
touchscreen:
  - platform: ft5x06
    id: touch_main
    i2c_id: bus_int
    address: 0x38
    display: disp_main

output:
  - platform: ledc
    id: out_backlight
    pin: GPIO9
  # ESPHome warns "GPIO3 is a strapping pin" here -- expected, not a
  # bug: GPIO3 is where M5Stack's own hardware wires the buzzer on the
  # M5StampS3 module (M5's reference config uses the same pin), so
  # there's no other pin to move this to. Strapping only matters
  # during the reset/boot sampling window; this pin is only ever
  # driven afterward, as a plain ledc output, with nothing external
  # pulling on it -- the failure mode the warning is about
  # (mis-sampled boot straps from an external pull resistor) doesn't
  # apply here.
  - platform: ledc
    id: out_buzzer
    pin: GPIO3

light:
  - platform: monochromatic
    id: lgt_backlight
    output: out_backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

# The M5Dial's onboard buzzer, GPIO3, per M5's own reference config
# (docs.m5stack.com/en/homeassistant/kit/dial). ONE tone right now:
# beep_confirm, the triple-click day/night acknowledgement below.
#
# Two more uses were on the table (a confirmation tone for "dangerous"
# buttons like MP OFF and RETRACT; an alert tone for the pre-flight/
# cat-litter overlays) but neither has anything to attach to yet:
# MP OFF is just wherever the power_2 mode-cycle button lands, no
# dedicated action or long-press confirm exists (design.md's own open
# item); RETRACT and the overlay pages themselves aren't built. Wiring
# a tone to either now would mean inventing the UX along with it, not
# just adding a beep -- left for when that UX exists.
rtttl:
  output: out_buzzer
  id: rtttl_player
  gain: 0.6

# =====================================================================
#  Sensors
# =====================================================================
#  The rotary encoder belongs to the device. The data sources below are
#  the EXCEPTION:
#
#  ONLY VALUES NEEDED BY MORE THAN ONE PAGE BELONG HERE.
#  Everything else lives on the page that displays it, with a
#  page-prefixed ID (s_power_1_soc, s_gas_a). Duplicate IDs are a hard
#  error in ESPHome — a collision fails at `esphome config`, not at
#  runtime. If a second page needs a value: move the sensor definition
#  here, rename the IDs, the validator will point out the leftovers.
# ---------------------------------------------------------------------
sensor:
  # M5 Dial: 16 detents, 64 pulses, 4 edges per detent — that's why
  # there's NO `resolution:`; otherwise one detent would jump four
  # pages. Doesn't know the page count: page.next just walks the list,
  # however long it is.
  - platform: rotary_encoder
    id: s_encoder
    internal: true
    pin_a: GPIO40
    pin_b: GPIO41
    # g_edit_target == 0 (default): encoder navigates pages, as always.
    # A page can "arm" a value for editing (set g_edit_target to its
    # own target number, on a button click) -- while armed, the
    # encoder adjusts that value instead and page navigation is
    # unreachable until the page disarms it (design.md §14 "Level 2
    # with two buttons"). See encoder_adjust_up/_down below for the
    # dispatch, and page_fans.yaml for the only page using this so far.
    on_clockwise:
      - if:
          condition:
            lambda: return id(g_edit_target) == 0;
          then:
            - lvgl.page.next
          else:
            - script.execute: encoder_adjust_up
    on_anticlockwise:
      - if:
          condition:
            lambda: return id(g_edit_target) == 0;
          then:
            - lvgl.page.previous
          else:
            - script.execute: encoder_adjust_down

  # ---- shared: clock page and temperature page ----------------------
  # There's (still) no real outdoor sensor on the vehicle. Until then
  # the value comes from the weather forecast for the location — that's
  # the region's air temperature, not the one at the vehicle. Once a
  # sensor exists: swap the entity_id and drop `attribute:`.
  - platform: homeassistant
    id: s_aussentemp
    entity_id: weather.forecast_home
    attribute: temperature

binary_sensor:
  - platform: gpio
    id: s_frontbutton
    internal: true
    pin:
      number: GPIO42
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      # Triple click: AUTO -> DAY -> NIGHT -> AUTO
      - timing:
          - ON for at most 0.35s
          - OFF for at most 0.35s
          - ON for at most 0.35s
          - OFF for at most 0.35s
          - ON for at most 0.35s
          - OFF for at least 0.2s
        then:
          - script.execute: beep_confirm
          - globals.set:
              id: g_daynight
              value: !lambda "return (id(g_daynight) + 1) % 3;"
          - script.execute: apply_daynight
      # Double click, two-way -- design feedback: it's for SET/toggle
      # now, period, never for going home (that moved to long-press,
      # unconditionally, on every page -- see below).
      #
      # 1. An overlay is up -- dismiss it. Checked via each overlay's
      #    own root widget (LV_OBJ_FLAG_HIDDEN, the flag
      #    lvgl.widget.show/hide actually flips) before calling its
      #    _ack script, which is a no-op if that overlay isn't the one
      #    showing. Hard-coded, "add a branch per new one" list:
      #    ov_litterbox, ov_ipixel, ov_preflight so far.
      #
      # 2. No overlay was up -- run the current page's double-click
      #    action, if it has one (LvPageType::is_showing() picks the
      #    page, the real "which page is active" check, not a guess).
      #    Same action a tap on that page's own primary button/SET
      #    would do, so double-click reaches ordinary toggles too, not
      #    just encoder-SET (design feedback: haptic control matters
      #    while driving, touch works fine parked, so both stay
      #    available on every page that has one). A page with two
      #    things worth reaching (page_fans, page_climate,
      #    page_boiler, page_lights_outside) exposes a dedicated
      #    dc_<page>_cycle script that alternates between them, one per
      #    click, rather than one fixed action always winning. A page
      #    with nothing to act on (page_clock, page_gas, page_levelling)
      #    or where none of its actions is safe for a quick
      #    double-click while driving (page_entrance -- see that
      #    file's header) simply does nothing here; hard-coded per
      #    page, same "add a branch per page" pattern as
      #    encoder_adjust_up/down.
      - timing:
          - ON for at most 0.35s
          - OFF for at most 0.35s
          - ON for at most 0.35s
          - OFF for at least 0.5s
        then:
          - globals.set:
              id: g_dc_overlay_active
              value: !lambda |-
                return !lv_obj_has_flag(id(ov_litterbox), LV_OBJ_FLAG_HIDDEN) ||
                       !lv_obj_has_flag(id(ov_ipixel), LV_OBJ_FLAG_HIDDEN) ||
                       !lv_obj_has_flag(id(ov_preflight), LV_OBJ_FLAG_HIDDEN);
          - script.execute: ov_litterbox_ack
          - script.execute: ov_ipixel_ack
          - script.execute: ov_preflight_ack
          - if:
              condition:
                lambda: return !id(g_dc_overlay_active);
              then:
                - lambda: |-
                    if (id(page_power_1)->is_showing()) { id(act_power_1_park)->execute(); }
                    else if (id(page_power_2)->is_showing()) { id(act_power_2_arm_assist)->execute(); }
                    else if (id(page_power_3)->is_showing()) { id(act_power_3_mode)->execute(); }
                    else if (id(page_water)->is_showing()) { id(act_water_pump)->execute(); }
                    else if (id(page_fans)->is_showing()) { id(dc_fans_cycle)->execute(); }
                    else if (id(page_climate)->is_showing()) { id(dc_climate_cycle)->execute(); }
                    else if (id(page_boiler)->is_showing()) { id(dc_boiler_cycle)->execute(); }
                    else if (id(page_lights_outside)->is_showing()) { id(dc_lights_outside_cycle)->execute(); }
                    else if (id(page_ipixel)->is_showing()) { id(act_ipixel_power)->execute(); }
                    // page_clock, page_gas, page_levelling, page_entrance:
                    // nothing to act on / deliberately excluded -- see
                    // page_entrance.yaml's header. No else: a double-click
                    // there simply does nothing now.
      # Long press: the only way home now (double-click no longer
      # falls back to it, see above) -- on every page, unconditionally.
      # Also drops out of encoder edit mode if a page had one armed
      # (design.md §14) -- draw_fans is the only page using it right
      # now; add its own script.execute here if a second page ever
      # does too.
      - timing:
          - ON for 0.5s to 3s
          - OFF for at least 0.2s
        then:
          - globals.set:
              id: g_edit_target
              value: "0"
          - script.execute: draw_fans
          - lvgl.page.show: ${home_page}

text_sensor:
  # ---- shared: is the vehicle driving? -------------------------------
  # mbapi2020 delivers a state, not a switch:
  #   0 lock · 1 off · 2 accessory · 4 on · 5 start
  # Since v0.19.0, value_short/value_description are gone, so the state
  # is the bare number. The comparison below covers both.
  #
  # Gates overlay_preflight.yaml (state 4 or 5 = ignition on/starting,
  # its own trigger condition) -- the "suppresses the overlays" idea
  # this comment used to only anticipate. Still NOT suppressing
  # overlay_litterbox -- that one has no ignition gate at all yet.
  - platform: homeassistant
    id: s_ignition
    entity_id: sensor.nw19939_ignition_state
    on_value:
      - script.execute: draw_ov_preflight

  # ---- shared: sun.sun follows the vehicle's GPS position ------------
  - platform: homeassistant
    id: s_sun
    entity_id: sun.sun
    on_value:
      - script.execute: apply_daynight

# =====================================================================
#  Day / Night
# =====================================================================
#  design.md §6: day and night differ ONLY in backlight brightness,
#  never in the color scheme -- except the clock page, a deliberate,
#  documented exception (design.md §6). This script is therefore the
#  one place in the header that reaches into a specific page's widget
#  (clock_face, from page_clock.yaml). That's only safe because every
#  cockpit currently includes the same page set (m5dial_fram_cockpit.yaml's
#  own comment: "otherwise the same packages") -- if a future dial ever
#  drops the clock page, this call needs to come out too, or the build
#  breaks on the missing id.
globals:
  - id: g_daynight
    type: int
    restore_value: true
    initial_value: "0" # 0 AUTO, 1 DAY, 2 NIGHT

  # Encoder edit mode (design.md §14 "Level 2 with two buttons"): 0 =
  # encoder navigates pages. >0 = which value it adjusts instead; a
  # page assigns itself a number and arms/disarms it on a button
  # click. Never restored across reboots -- always start in
  # navigate mode.
  - id: g_edit_target
    type: int
    restore_value: false
    initial_value: "0" # 0 = navigate. 1/2 = page_fans, 3 = page_climate, 5 = page_boiler, 6 = page_power_2.

  # Scratch flag for the front-button double-click handler below: was
  # any overlay up right before this click? Set once per click, right
  # before the _ack calls run (which would otherwise hide it and make
  # it too late to check). Not meaningful outside that handler.
  - id: g_dc_overlay_active
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: beep_confirm
    then:
      - rtttl.play:
          id: rtttl_player
          rtttl: "confirm:d=4,o=5,b=180:16e"

  # Dispatch for g_edit_target (rotary_encoder above). Same kind of
  # hard-coded, page-specific reference as apply_daynight's clock_face
  # below -- add a branch here for each new target a page introduces,
  # remove it if that page drops the target. page_fans.yaml (1/2),
  # page_climate.yaml (3), page_boiler.yaml (5), page_power_2.yaml
  # (6) so far. 4 is retired (page_climate's fan-mode control, dropped
  # when the truma_inetbox entity guess it was built on turned out
  # wrong -- see that page's header).
  - id: encoder_adjust_up
    then:
      - if:
          condition:
            lambda: return id(g_edit_target) == 1;
          then:
            - script.execute: act_fans_speed_up
      - if:
          condition:
            lambda: return id(g_edit_target) == 2;
          then:
            - script.execute: act_fans_hvac_up
      - if:
          condition:
            lambda: return id(g_edit_target) == 3;
          then:
            - script.execute: act_climate_temp_up
      - if:
          condition:
            lambda: return id(g_edit_target) == 5;
          then:
            - script.execute: act_boiler_temp_up
      - if:
          condition:
            lambda: return id(g_edit_target) == 6;
          then:
            - script.execute: act_power_2_assist_up

  - id: encoder_adjust_down
    then:
      - if:
          condition:
            lambda: return id(g_edit_target) == 1;
          then:
            - script.execute: act_fans_speed_down
      - if:
          condition:
            lambda: return id(g_edit_target) == 3;
          then:
            - script.execute: act_climate_temp_down
      - if:
          condition:
            lambda: return id(g_edit_target) == 5;
          then:
            - script.execute: act_boiler_temp_down
      - if:
          condition:
            lambda: return id(g_edit_target) == 6;
          then:
            - script.execute: act_power_2_assist_down
      - if:
          condition:
            lambda: return id(g_edit_target) == 2;
          then:
            - script.execute: act_fans_hvac_down

  - id: apply_daynight
    mode: restart
    then:
      - lambda: |-
          bool night;
          int m = id(g_daynight);
          if (m == 1) {
            night = false;
          } else if (m == 2) {
            night = true;
          } else {
            night = id(s_sun).has_state() && id(s_sun).state != "above_horizon";
          }
          auto call = id(lgt_backlight).turn_on();
          call.set_brightness(night ? 0.25f : 1.0f);
          call.perform();
          id(clock_face).set_night_mode(night);

# =====================================================================
#  Fonts
# =====================================================================
#  Custom, not the `montserrat_NN` names used everywhere before --
#  those are LVGL's own precompiled fonts, ASCII-only (no Latin-1),
#  which is why every Ä/Ö/Ü/ä/ö/ü/ß on the device showed as a tofu
#  box: LVGL doesn't have the glyph, full stop, and ESPHome can't add
#  one to an already-compiled font. This pulls the real Montserrat TTF
#  and rasterizes it ourselves instead, with the glyphs we actually
#  need spelled out explicitly. `glyphs:` REPLACES ESPHome's default
#  auto-detected list rather than adding to it, so every character
#  used anywhere in any page's `text:` or lambda strings needs to be
#  in this set — including ° (already relied on everywhere) — or it
#  silently goes back to a tofu box.
#
#  One entry per size, same four sizes as before (design.md §3), same
#  naming pattern minus the reserved word: font_12/16/24/40 instead of
#  montserrat_12/16/24/40. Every page's `text_font:` (and this block's
#  own `default_font:` below) needs to say font_NN now, not
#  montserrat_NN -- montserrat_NN still exists as LVGL's own font and
#  still compiles, it just silently opts back out of umlaut support if
#  anything ever reintroduces it.
#
#  Ø added for page_fans.yaml's FANBOARD channel-average readout
#  ("Ø42%") -- same rule applies: it's a flow scalar (quoted, one
#  line), not a `|-` block scalar, specifically so a leading/embedded
#  space can never be silently stripped as indentation the way it was
#  in the smart-ebl-display repo's font block (real bug there, fixed
#  by switching away from a block scalar -- see that repo's
#  smart-ebl-display.yaml for the postmortem). Keep any future
#  addition to this glyph string on one line for the same reason.
#
#  NOT covered: page_clock.yaml's `date_font`/`temperature_font`,
#  which are sbb_clock's own config (a separate external component) --
#  still on montserrat_16. Revisit only if that text ever shows a tofu
#  box too; nothing it renders needs a German umlaut right now.
font:
  - file: "gfonts://Montserrat"
    id: font_12
    size: 12
    glyphs: " !%(),.+-/0123456789:;ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°ÄÖÜäöüßØ"
  - file: "gfonts://Montserrat"
    id: font_16
    size: 16
    glyphs: " !%(),.+-/0123456789:;ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°ÄÖÜäöüßØ"
  - file: "gfonts://Montserrat"
    id: font_24
    size: 24
    glyphs: " !%(),.+-/0123456789:;ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°ÄÖÜäöüßØ"
  - file: "gfonts://Montserrat"
    id: font_40
    size: 40
    glyphs: " !%(),.+-/0123456789:;ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°ÄÖÜäöüßØ"

# =====================================================================
#  LVGL frame
# =====================================================================
#  Only the frame. The pages: come from the page packages.
lvgl:
  id: lvgl_main
  displays:
    - disp_main
  touchscreens:
    - touch_main
  default_font: font_16
  # Measured on the device: 0 is correct, not 180 (design.md §1 was
  # wrong). If a rotation is ever needed again: it goes here, not under
  # display: — with LVGL active, validation aborts otherwise.
  rotation: 0
  buffer_size: 25% # no PSRAM on the M5StampS3
  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER
